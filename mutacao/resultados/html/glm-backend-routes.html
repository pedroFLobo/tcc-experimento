l integracao\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RF01.3\n   * @objetivo Recusar token inválido ou adulterado\n   * @resultadoEsperado autenticar lança NAO_AUTENTICADO (401) com 'Token inválido ou expirado.'\n   */\n  test('token inválido recebe 401', () => {\n    const erro = capturar(() => servicos.authService.autenticar('token-falsificado'));\n    expect(erro.status).toBe(401);\n    expect(erro.message).toBe('Token inválido ou expirado.');\n  });\n\n  /**\n   * @caso CT-INT-091\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RF01.3, RNF02\n   * @objetivo Recusar token cujo usuário não existe mais ou está inativo\n   * @resultadoEsperado autenticar lança NAO_AUTENTICADO (401) de usuário inexistente ou inativo\n   */\n  test('token de usuário inexistente recebe 401', () => {\n    const token = jwt.sign({ sub: 9999, perfil: 'PACIENTE' }, config.jwtSegredo, { expiresIn: '8h' });\n    const erro = capturar(() => servicos.authService.autenticar(token));\n    expect(erro.status).toBe(401);\n    expect(erro.message).toBe('Usuário inexistente ou inativo.');\n  });\n\n  /**\n   * @caso CT-INT-092\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo confidencialidade\n   * @requisito RN01\n   * @objetivo Garantir que a senha nunca é gravada em texto puro\n   * @resultadoEsperado senhaHash é um hash bcrypt válido para 'Senha123' e diferente dela\n   */\n  test('senha é guardada apenas como hash bcrypt', () => {\n    const usuario = servicos.repos.usuarios.buscarPorEmail('ana@email.com');\n    expect(usuario.senhaHash).not.toBe('Senha123');\n    expect(usuario.senhaHash.startsWith('$2')).toBe(true);\n    expect(bcrypt.compareSync('Senha123', usuario.senhaHash)).toBe(true);\n  });\n});\n\ndescribe('relatórios (RF11)', () => {\n  let anaId, joaoId;\n  const recepcionar = (pacienteId, medicoId, inicio) =>\n    servicos.consultasService.agendar({ perfil: 'RECEPCAO' }, { pacienteId, medicoId, inicio });\n\n  beforeAll(() => {\n    anaId = pacientes[0].id;\n    joaoId = pacientes[1].id;\n    // AGENDADA\n    recepcionar(anaId, 1, '2026-10-20 08:00');\n    // CONFIRMADA\n    const confirmavel = recepcionar(anaId, 2, '2026-10-19 10:30');\n    servicos.consultasService.confirmar({ perfil: 'PACIENTE', pacienteId: anaId }, confirmavel.id);\n    // REALIZADA\n    const realizada = servicos.repos.consultas.inserir({\n      pacienteId: anaId, medicoId: 1, inicio: '2026-10-14 08:00', fim: '2026-10-14 08:30',\n      valorCentavos: 15000, retornoDe: null, agora: '2026-10-19 08:00',\n    });\n    servicos.repos.consultas.atualizarStatus(realizada, 'REALIZADA', '2026-10-19 08:00');\n    // FALTA\n    const falta = servicos.repos.consultas.inserir({\n      pacienteId: anaId, medicoId: 1, inicio: '2026-10-15 08:00', fim: '2026-10-15 08:30',\n      valorCentavos: 15000, retornoDe: null, agora: '2026-10-19 08:00',\n    });\n    servicos.repos.consultas.atualizarStatus(falta, 'FALTA', '2026-10-19 08:00');\n    // CANCELADA\n    const cancelada = servicos.repos.consultas.inserir({\n      pacienteId: anaId, medicoId: 1, inicio: '2026-10-16 08:00', fim: '2026-10-16 08:30',\n      valorCentavos: 15000, retornoDe: null, agora: '2026-10-19 08:00',\n    });\n    servicos.repos.consultas.atualizarStatus(cancelada, 'CANCELADA', '2026-10-19 08:00', { canceladoPor: 'RECEPCAO' });\n  });\n\n  /**\n   * @caso CT-INT-093\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF11.1\n   * @objetivo Consolidar as consultas do período agrupadas por status\n   * @resultadoEsperado porStatus traz exatamente 1 consulta em cada um dos 5 status\n   */\n  test('resumo agrupa consultas por status', () => {\n    const resumo = servicos.relatoriosService.resumo({ dataInicio: '2026-10-14', dataFim: '2026-10-20' });\n    expect(resumo.porStatus).toEqual({\n      AGENDADA: 1, CONFIRMADA: 1, REALIZADA: 1, FALTA: 1, CANCELADA: 1,\n    });\n    expect(resumo.periodo).toEqual({ dataInicio: '2026-10-14', dataFim: '2026-10-20' });\n  });\n\n  /**\n   * @caso CT-INT-094\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF11.1\n   * @objetivo Calcular a taxa de faltas por médico no período\n   * @resultadoEsperado Carlos aparece com 1 falta em 2 consultas encerradas, taxa de 50%\n   */\n  test('taxa de faltas do médico é calculada sobre as encerradas', () => {\n    const resumo = servicos.relatoriosService.resumo({ dataInicio: '2026-10-14', dataFim: '2026-10-20' });\n    const carlos = resumo.faltasPorMedico.find((l) => l.medicoId === 1);\n    expect(carlos.faltas).toBe(1);\n    expect(carlos.encerradas).toBe(2);\n    expect(carlos.taxaFaltas).toBe(50);\n  });\n\n  /**\n   * @caso CT-INT-095\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF11.1\n   * @objetivo Somar no faturamento apenas consultas realizadas\n   * @resultadoEsperado faturamentoCentavos do período é 15000, ignorando status não realizados\n   */\n  test('faturamento soma só as realizadas', () => {\n    const resumo = servicos.relatoriosService.resumo({ dataInicio: '2026-10-14', dataFim: '2026-10-20' });\n    expect(resumo.faturamentoCentavos).toBe(15000);\n  });\n\n  /**\n   * @caso CT-INT-096\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF11.1\n   * @objetivo Reportar taxa de 100% para médico cujas encerradas são todas faltas\n   * @resultadoEsperado Eduardo aparece com 1 falta, 0 realizações e taxaFaltas 100\n   */\n  test('médico só com faltas tem taxa de 100%', () => {\n    const id = servicos.repos.consultas.inserir({\n      pacienteId: joaoId, medicoId: 3, inicio: '2026-10-16 13:00', fim: '2026-10-16 13:30',\n      valorCentavos: 25000, retornoDe: null, agora: '2026-10-19 08:00',\n    });\n    servicos.repos.consultas.atualizarStatus(id, 'FALTA', '2026-10-19 08:00');\n    const resumo = servicos.relatoriosService.resumo({ dataInicio: '2026-10-14', dataFim: '2026-10-20' });\n    const eduardo = resumo.faltasPorMedico.find((l) => l.medicoId === 3);\n    expect(eduardo.faltas).toBe(1);\n    expect(eduardo.encerradas).toBe(1);\n    expect(eduardo.taxaFaltas).toBe(100);\n  });\n\n  /**\n   * @caso CT-INT-097\n   * @nivel integracao\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RF11\n   * @objetivo Recusar período com data final anterior à inicial\n   * @resultadoEsperado resumo lança VALIDACAO (400) com mensagem de coerência das datas\n   */\n  test('recusa período invertido', () => {\n    const erro = capturar(() => servicos.relatoriosService.resumo({ dataInicio: '2026-10-20', dataFim: '2026-10-14' }));\n    expect(erro.status).toBe(400);\n    expect(erro.message).toBe('dataFim não pode ser anterior a dataInicio.');\n  });\n\n  /**\n   * @caso CT-INT-098\n   * @nivel integracao\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RF11\n   * @objetivo Exigir as duas datas do período no formato correto\n   * @resultadoEsperado resumo sem datas lança VALIDACAO (400) pedindo AAAA-MM-DD\n   */\n  test('recusa período sem datas informadas', () => {\n    const erro = capturar(() => servicos.relatoriosService.resumo({}));\n    expect(erro.status).toBe(400);\n    expect(erro.message).toBe('Informe dataInicio e dataFim no formato AAAA-MM-DD.');\n  });\n});\n"},"backend/__testes__/integracao/agenda-servicos.test.js":{"tests":[{"id":"90","name":"grade semanal (RF05, RN10, RN11) salvar a grade substitui a grade anterior","location":{"start":{"column":4,"line":33}}},{"id":"91","name":"grade semanal (RF05, RN10, RN11) grade inválida não apaga a grade atual","location":{"start":{"column":4,"line":54}}},{"id":"92","name":"grade semanal (RF05, RN10, RN11) médico não altera a grade de colega","location":{"start":{"column":4,"line":74}}},{"id":"93","name":"grade semanal (RF05, RN10, RN11) recepção salva grade de qualquer médico","location":{"start":{"column":4,"line":90}}},{"id":"94","name":"bloqueios (RF06, RN12, RN13) cria bloqueio com período e motivo","location":{"start":{"column":4,"line":107}}},{"id":"95","name":"bloqueios (RF06, RN12, RN13) recusa período invertido","location":{"start":{"column":4,"line":125}}},{"id":"96","name":"bloqueios (RF06, RN12, RN13) recusa bloqueio começando no passado","location":{"start":{"column":4,"line":142}}},{"id":"97","name":"bloqueios (RF06, RN12, RN13) recusa bloqueio sobre consulta ativa","location":{"start":{"column":4,"line":159}}},{"id":"98","name":"bloqueios (RF06, RN12, RN13) remove bloqueio existente","location":{"start":{"column":4,"line":181}}},{"id":"99","name":"bloqueios (RF06, RN12, RN13) recusa remover bloqueio inexistente","location":{"start":{"column":4,"line":199}}},{"id":"100","name":"horários livres (RF07, RN14, RN15, RN21) gera os slots do dia pela grade e duração","location":{"start":{"column":9,"line":216}}},{"id":"101","name":"horários livres (RF07, RN14, RN15, RN21) exclui horário ocupado por consulta ativa","location":{"start":{"column":9,"line":232}}},{"id":"102","name":"horários livres (RF07, RN14, RN15, RN21) não gera horários em data bloqueada","location":{"start":{"column":4,"line":252}}},{"id":"103","name":"horários livres (RF07, RN14, RN15, RN21) exclui horários sem antecedência mínima","location":{"start":{"column":9,"line":270}}},{"id":"104","name":"horários livres (RF07, RN14, RN15, RN21) médico inativo não oferece horários","location":{"start":{"column":9,"line":286}}},{"id":"105","name":"horários livres (RF07, RN14, RN15, RN21) domingo sem grade não gera horários","location":{"start":{"column":4,"line":304}}},{"id":"106","name":"horários livres (RF07, RN14, RN15, RN21) recusa data inválida","location":{"start":{"column":4,"line":317}}}],"source":"// Testes de integração da grade, bloqueios e horários livres (RF05–RF07, RN10–RN15, RN21).\nconst clock = require('../../src/utils/clock');\nconst { abrirBanco } = require('../../src/db/connection');\nconst { semear } = require('../../src/db/seed');\nconst { criarServicos } = require('../../src/services');\n\nlet db, servicos, medicos, pacientes;\nconst recepcao = { perfil: 'RECEPCAO' };\nconst capturar = (acao) => { try { return acao(); } catch (erro) { return erro; } };\n\nbeforeAll(() => {\n  clock.definirAgora(new Date(2026, 9, 19, 8, 0)); // 2026-10-19 08:00, segunda-feira\n  db = abrirBanco(':memory:');\n  ({ medicos, pacientes } = semear(db));\n  servicos = criarServicos(db);\n});\n\nafterAll(() => {\n  clock.definirAgora(null);\n  db.close();\n});\n\ndescribe('grade semanal (RF05, RN10, RN11)', () => {\n  /**\n   * @caso CT-INT-015\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF05.2, RN10\n   * @objetivo Substituir a grade anterior por inteiro ao salvar novamente\n   * @resultadoEsperado após a segunda gravação restam apenas os 2 blocos novos\n   */\n  test('salvar a grade substitui a grade anterior', () => {\n    const medico = medicos[0];\n    servicos.agendaService.salvarGrade(recepcao, medico.id, [{ diaSemana: 1, horaInicio: '08:00', horaFim: '12:00' }]);\n    const nova = servicos.agendaService.salvarGrade(recepcao, medico.id, [\n      { diaSemana: 2, horaInicio: '08:00', horaFim: '10:00' },\n      { diaSemana: 3, horaInicio: '08:00', horaFim: '10:00' },\n    ]);\n    expect(nova).toHaveLength(2);\n    expect(nova.map((b) => b.diaSemana)).toEqual([2, 3]);\n    expect(servicos.repos.medicos.listarDisponibilidades(medico.id)).toHaveLength(2);\n  });\n\n  /**\n   * @caso CT-INT-016\n   * @nivel integracao\n   * @atributo confiabilidade\n   * @subatributo recuperabilidade\n   * @requisito RN10, RN11\n   * @objetivo Manter a grade anterior intacta quando a nova grade é inválida\n   * @resultadoEsperado salvarGrade lança VALIDACAO para blocos sobrepostos e a grade segue com 2 blocos\n   */\n  test('grade inválida não apaga a grade atual', () => {\n    const medico = medicos[0];\n    const erro = capturar(() => servicos.agendaService.salvarGrade(recepcao, medico.id, [\n      { diaSemana: 2, horaInicio: '08:00', horaFim: '12:00' },\n      { diaSemana: 2, horaInicio: '11:00', horaFim: '14:00' },\n    ]));\n    expect(erro.status).toBe(400);\n    expect(erro.message).toContain('sobrepostos');\n    expect(servicos.repos.medicos.listarDisponibilidades(medico.id)).toHaveLength(2);\n  });\n\n  /**\n   * @caso CT-INT-017\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RN30\n   * @objetivo Impedir que um médico salve a grade de outro médico\n   * @resultadoEsperado salvarGrade lança SEM_PERMISSAO (403) quando o dono não corresponde\n   */\n  test('médico não altera a grade de colega', () => {\n    const outro = { perfil: 'MEDICO', medicoId: medicos[1].id };\n    const erro = capturar(() => servicos.agendaService.salvarGrade(outro, medicos[0].id, []));\n    expect(erro.status).toBe(403);\n    expect(erro.codigo).toBe('SEM_PERMISSAO');\n  });\n\n  /**\n   * @caso CT-INT-018\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RF05.1\n   * @objetivo Permitir que a recepção salve a grade de qualquer médico\n   * @resultadoEsperado salvarGrade da recepção retorna a nova grade do médico escolhido\n   */\n  test('recepção salva grade de qualquer médico', () => {\n    const nova = servicos.agendaService.salvarGrade(recepcao, medicos[1].id, [{ diaSemana: 5, horaInicio: '09:00', horaFim: '15:00' }]);\n    expect(nova).toHaveLength(1);\n    expect(nova[0].diaSemana).toBe(5);\n  });\n});\n\ndescribe('bloqueios (RF06, RN12, RN13)', () => {\n  /**\n   * @caso CT-INT-019\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF06.1, RN12\n   * @objetivo Criar bloqueio por período de datas com motivo\n   * @resultadoEsperado criarBloqueio retorna o bloqueio gravado com motivo 'Férias'\n   */\n  test('cria bloqueio com período e motivo', () => {\n    const bloqueio = servicos.agendaService.criarBloqueio(recepcao, medicos[0].id, {\n      dataInicio: '2026-11-02', dataFim: '2026-11-06', motivo: 'Férias',\n    });\n    expect(bloqueio.id).toBeGreaterThan(0);\n    expect(bloqueio.motivo).toBe('Férias');\n    expect(bloqueio.dataFim).toBe('2026-11-06');\n  });\n\n  /**\n   * @caso CT-INT-020\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN12\n   * @objetivo Recusar bloqueio cuja data final é anterior à inicial\n   * @resultadoEsperado criarBloqueio lança VALIDACAO (400)\n   */\n  test('recusa período invertido', () => {\n    const erro = capturar(() => servicos.agendaService.criarBloqueio(recepcao, medicos[0].id, {\n      dataInicio: '2026-11-10', dataFim: '2026-11-05', motivo: 'Invertido',\n    }));\n    expect(erro.status).toBe(400);\n    expect(erro.message).toBe('A data final do bloqueio não pode ser anterior à inicial.');\n  });\n\n  /**\n   * @caso CT-INT-021\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN12\n   * @objetivo Recusar bloqueio que começa no passado\n   * @resultadoEsperado criarBloqueio lança REGRA_NEGOCIO (422) para início em 2026-10-18\n   */\n  test('recusa bloqueio começando no passado', () => {\n    const erro = capturar(() => servicos.agendaService.criarBloqueio(recepcao, medicos[0].id, {\n      dataInicio: '2026-10-18', dataFim: '2026-10-20', motivo: 'Passado',\n    }));\n    expect(erro.status).toBe(422);\n    expect(erro.message).toBe('O bloqueio não pode começar no passado.');\n  });\n\n  /**\n   * @caso CT-INT-022\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN13\n   * @objetivo Recusar bloqueio em período que já tenha consulta ativa do médico\n   * @resultadoEsperado criarBloqueio lança REGRA_NEGOCIO (422) citando a quantidade de consultas e não grava o bloqueio\n   */\n  test('recusa bloqueio sobre consulta ativa', () => {\n    const medico = medicos[0];\n    servicos.consultasService.agendar({ perfil: 'PACIENTE', pacienteId: pacientes[0].id }, {\n      medicoId: medico.id, inicio: '2026-10-21 08:00',\n    });\n    const erro = capturar(() => servicos.agendaService.criarBloqueio(recepcao, medico.id, {\n      dataInicio: '2026-10-20', dataFim: '2026-10-22', motivo: 'Congresso',\n    }));\n    expect(erro.status).toBe(422);\n    expect(erro.message).toContain('1 consulta');\n    expect(servicos.repos.medicos.listarBloqueios(medico.id).some((b) => b.motivo === 'Congresso')).toBe(false);\n  });\n\n  /**\n   * @caso CT-INT-023\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF06.2\n   * @objetivo Remover um bloqueio existente\n   * @resultadoEsperado removerBloqueio apaga o registro e buscarBloqueio passa a retornar null\n   */\n  test('remove bloqueio existente', () => {\n    const medico = medicos[0];\n    const bloqueio = servicos.agendaService.criarBloqueio(recepcao, medico.id, {\n      dataInicio: '2026-12-01', dataFim: '2026-12-02', motivo: 'Folga',\n    });\n    servicos.agendaService.removerBloqueio(recepcao, medico.id, bloqueio.id);\n    expect(servicos.repos.medicos.buscarBloqueio(bloqueio.id)).toBeNull();\n  });\n\n  /**\n   * @caso CT-INT-024\n   * @nivel integracao\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RF06.2, RN30\n   * @objetivo Recusar remoção de bloqueio inexistente com 404\n   * @resultadoEsperado removerBloqueio lança NAO_ENCONTRADO (404) para id 9999\n   */\n  test('recusa remover bloqueio inexistente', () => {\n    const erro = capturar(() => servicos.agendaService.removerBloqueio(recepcao, medicos[0].id, 9999));\n    expect(erro.status).toBe(404);\n    expect(erro.codigo).toBe('NAO_ENCONTRADO');\n  });\n});\n\ndescribe('horários livres (RF07, RN14, RN15, RN21)', () => {\n  /**\n   * @caso CT-INT-025\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF07.1, RN14\n   * @objetivo Gerar horários do dia a partir da grade em passos da duração do médico\n   * @resultadoEsperado horariosLivres retorna 16 slots para Carlos na terça 2026-10-20, do 08:00 ao 17:30\n   */\n  test.skip('gera os slots do dia pela grade e duração', () => {\n    const horarios = servicos.agendaService.horariosLivres(medicos[0].id, '2026-10-20');\n    expect(horarios).toHaveLength(16);\n    expect(horarios[0]).toBe('2026-10-20 08:00');\n    expect(horarios[15]).toBe('2026-10-20 17:30');\n  });\n\n  /**\n   * @caso CT-INT-026\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN15\n   * @objetivo Excluir das horas livres o horário já ocupado por consulta ativa\n   * @resultadoEsperado após agendar às 08:00, o slot de 08:00 some e os demais permanecem\n   */\n  test.skip('exclui horário ocupado por consulta ativa', () => {\n    const medico = medicos[0];\n    servicos.consultasService.agendar({ perfil: 'PACIENTE', pacienteId: pacientes[1].id }, {\n      medicoId: medico.id, inicio: '2026-10-22 08:00',\n    });\n    const horarios = servicos.agendaService.horariosLivres(medico.id, '2026-10-22');\n    expect(horarios).toHaveLength(15);\n    expect(horarios).not.toContain('2026-10-22 08:00');\n    expect(horarios).toContain('2026-10-22 08:30');\n  });\n\n  /**\n   * @caso CT-INT-027\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN15, RN12\n   * @objetivo Retornar nenhum horário nas datas dentro de um bloqueio\n   * @resultadoEsperado horariosLivres retorna [] dentro do período bloqueado\n   */\n  test('não gera horários em data bloqueada', () => {\n    const medico = medicos[0];\n    servicos.agendaService.criarBloqueio(recepcao, medico.id, {\n      dataInicio: '2026-10-27', dataFim: '2026-10-28', motivo: 'Manutenção',\n    });\n    expect(servicos.agendaService.horariosLivres(medico.id, '2026-10-27')).toEqual([]);\n    expect(servicos.agendaService.horariosLivres(medico.id, '2026-10-28')).toEqual([]);\n  });\n\n  /**\n   * @caso CT-INT-028\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN15, RN16\n   * @objetivo Excluir horários sem a antecedência mínima de 2 horas\n   * @resultadoEsperado para Beatriz hoje (09:00 e 09:45 estão a menos de 2h), o primeiro slot livre é 10:30\n   */\n  test.skip('exclui horários sem antecedência mínima', () => {\n    const horarios = servicos.agendaService.horariosLivres(medicos[1].id, '2026-10-19');\n    expect(horarios[0]).toBe('2026-10-19 10:30');\n    expect(horarios).not.toContain('2026-10-19 09:00');\n    expect(horarios).not.toContain('2026-10-19 09:45');\n  });\n\n  /**\n   * @caso CT-INT-029\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN21\n   * @objetivo Não gerar horários de médico inativo\n   * @resultadoEsperado horariosLivres retorna [] com o usuário do médico desativado e volta ao normal após reativação\n   */\n  test.skip('médico inativo não oferece horários', () => {\n    const medico = medicos[0];\n    const usuario = servicos.repos.usuarios.buscarPorEmail('carlos@clinica.com');\n    servicos.cadastroService.definirUsuarioAtivo(usuario.id, false);\n    expect(servicos.agendaService.horariosLivres(medico.id, '2026-10-20')).toEqual([]);\n    servicos.cadastroService.definirUsuarioAtivo(usuario.id, true);\n    expect(servicos.agendaService.horariosLivres(medico.id, '2026-10-20')).toHaveLength(16);\n  });\n\n  /**\n   * @caso CT-INT-030\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RF07.1\n   * @objetivo Retornar lista vazia em dia sem blocos na grade do médico\n   * @resultadoEsperado horariosLivres retorna [] no domingo 2026-10-25 para Carlos (grade seg–sex)\n   */\n  test('domingo sem grade não gera horários', () => {\n    expect(servicos.agendaService.horariosLivres(medicos[0].id, '2026-10-25')).toEqual([]);\n  });\n\n  /**\n   * @caso CT-INT-031\n   * @nivel integracao\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RF07.1\n   * @objetivo Recusar data de consulta fora do formato AAAA-MM-DD\n   * @resultadoEsperado horariosLivres lança VALIDACAO (400) com mensagem orientando o formato\n   */\n  test('recusa data inválida', () => {\n    const erro = capturar(() => servicos.agendaService.horariosLivres(medicos[0].id, '31/10/2026'));\n    expect(erro.status).toBe(400);\n    expect(erro.message).toBe('Data inválida. Use o formato AAAA-MM-DD.');\n  });\n});\n"},"backend/__testes__/api/agenda-api.test.js":{"tests":[{"id":"107","name":"horários livres (RF07, RN14, RN15) lista horários livres do dia","location":{"start":{"column":4,"line":40}}},{"id":"108","name":"horários livres (RF07, RN14, RN15) exclui horários com menos de 2 horas de antecedência","location":{"start":{"column":4,"line":60}}},{"id":"109","name":"horários livres (RF07, RN14, RN15) data ausente ou inválida retorna 400","location":{"start":{"column":4,"line":78}}},{"id":"110","name":"horários livres (RF07, RN14, RN15) horários sem token retorna 401","location":{"start":{"column":4,"line":99}}},{"id":"111","name":"grade semanal (RF05, RN10, RN11, RN30) médico salva a própria grade","location":{"start":{"column":4,"line":116}}},{"id":"112","name":"grade semanal (RF05, RN10, RN11, RN30) médico não altera grade de colega","location":{"start":{"column":4,"line":134}}},{"id":"113","name":"grade semanal (RF05, RN10, RN11, RN30) blocos sobrepostos retornam 400","location":{"start":{"column":4,"line":151}}},{"id":"114","name":"grade semanal (RF05, RN10, RN11, RN30) consulta a grade do médico","location":{"start":{"column":4,"line":173}}},{"id":"115","name":"bloqueios (RF06, RN12, RN13, RN30) recepção cria bloqueio","location":{"start":{"column":4,"line":192}}},{"id":"116","name":"bloqueios (RF06, RN12, RN13, RN30) médico cria bloqueio na própria agenda","location":{"start":{"column":4,"line":211}}},{"id":"117","name":"bloqueios (RF06, RN12, RN13, RN30) médico não cria bloqueio de colega","location":{"start":{"column":4,"line":228}}},{"id":"118","name":"bloqueios (RF06, RN12, RN13, RN30) bloqueio sobre consulta ativa retorna 422","location":{"start":{"column":9,"line":245}}},{"id":"119","name":"bloqueios (RF06, RN12, RN13, RN30) lista bloqueios do médico","location":{"start":{"column":4,"line":266}}},{"id":"120","name":"bloqueios (RF06, RN12, RN13, RN30) remove bloqueio existente","location":{"start":{"column":4,"line":282}}},{"id":"121","name":"bloqueios (RF06, RN12, RN13, RN30) remover bloqueio inexistente retorna 404","location":{"start":{"column":4,"line":303}}},{"id":"122","name":"bloqueios (RF06, RN12, RN13, RN30) data bloqueada devolve lista vazia","location":{"start":{"column":4,"line":319}}}],"source":"// Testes de API de grade, bloqueios e horários livres (RF05–RF07, RN10–RN15, RN30, RNF04).\nconst clock = require('../../src/utils/clock');\nconst request = require('supertest');\nconst { abrirBanco } = require('../../src/db/connection');\nconst { semear } = require('../../src/db/seed');\nconst { criarApp } = require('../../src/app');\n\nlet db, app, tokenRecepcao, tokenPaciente, tokenMedico, tokenBeatriz;\n\nbeforeAll(async () => {\n  clock.definirAgora(new Date(2026, 9, 19, 8, 0)); // 2026-10-19 08:00, segunda-feira\n  db = abrirBanco(':memory:');\n  semear(db);\n  app = criarApp({ db });\n  const entrar = async (email) => {\n    const r = await request(app).post('/api/auth/login').send({ email, senha: 'Senha123' });\n    return r.body.token;\n  };\n  tokenRecepcao = await entrar('recepcao@clinica.com');\n  tokenPaciente = await entrar('ana@email.com');\n  tokenMedico = await entrar('carlos@clinica.com');\n  tokenBeatriz = await entrar('beatriz@clinica.com');\n});\n\nafterAll(() => {\n  clock.definirAgora(null);\n  db.close();\n});\n\ndescribe('horários livres (RF07, RN14, RN15)', () => {\n  /**\n   * @caso CT-API-040\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF07.1, RN14\n   * @objetivo Devolver os horários livres do dia em passos da duração do médico\n   * @resultadoEsperado 200 com data ecoada e 16 horários de Carlos na terça 2026-10-20\n   */\n  test('lista horários livres do dia', async () => {\n    const r = await request(app)\n      .get('/api/medicos/1/horarios?data=2026-10-20')\n      .set('Authorization', `Bearer ${tokenPaciente}`);\n    expect(r.status).toBe(200);\n    expect(r.body.data).toBe('2026-10-20');\n    expect(r.body.horarios).toHaveLength(16);\n    expect(r.body.horarios[0]).toBe('2026-10-20 08:00');\n    expect(r.body.horarios[15]).toBe('2026-10-20 17:30');\n  });\n\n  /**\n   * @caso CT-API-041\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN15, RN16\n   * @objetivo Excluir horários sem a antecedência mínima de 2 horas\n   * @resultadoEsperado para Beatriz hoje, o primeiro horário retornado é 10:30\n   */\n  test('exclui horários com menos de 2 horas de antecedência', async () => {\n    const r = await request(app)\n      .get('/api/medicos/2/horarios?data=2026-10-19')\n      .set('Authorization', `Bearer ${tokenPaciente}`);\n    expect(r.status).toBe(200);\n    expect(r.body.horarios[0]).toBe('2026-10-19 10:30');\n    expect(r.body.horarios).not.toContain('2026-10-19 09:00');\n  });\n\n  /**\n   * @caso CT-API-042\n   * @nivel api\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RF07.1, RNF04\n   * @objetivo Tratar data ausente ou fora do formato na consulta de horários\n   * @resultadoEsperado resposta 400 VALIDACAO pedindo o formato AAAA-MM-DD\n   */\n  test('data ausente ou inválida retorna 400', async () => {\n    const semData = await request(app)\n      .get('/api/medicos/1/horarios')\n      .set('Authorization', `Bearer ${tokenPaciente}`);\n    expect(semData.status).toBe(400);\n    expect(semData.body.erro.mensagem).toBe('Data inválida. Use o formato AAAA-MM-DD.');\n    const dataRuim = await request(app)\n      .get('/api/medicos/1/horarios?data=31/10/2026')\n      .set('Authorization', `Bearer ${tokenPaciente}`);\n    expect(dataRuim.status).toBe(400);\n  });\n\n  /**\n   * @caso CT-API-043\n   * @nivel api\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RF01.2\n   * @objetivo Exigir token para consultar horários\n   * @resultadoEsperado requisição anônima devolve 401 NAO_AUTENTICADO\n   */\n  test('horários sem token retorna 401', async () => {\n    const r = await request(app).get('/api/medicos/1/horarios?data=2026-10-20');\n    expect(r.status).toBe(401);\n    expect(r.body.erro.codigo).toBe('NAO_AUTENTICADO');\n  });\n});\n\ndescribe('grade semanal (RF05, RN10, RN11, RN30)', () => {\n  /**\n   * @caso CT-API-044\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF05.1, RF05.2\n   * @objetivo Salvar a grade pelo próprio médico substituindo a anterior\n   * @resultadoEsperado 200 com a nova grade de 1 bloco devolvida\n   */\n  test('médico salva a própria grade', async () => {\n    const r = await request(app).put('/api/medicos/1/disponibilidades')\n      .set('Authorization', `Bearer ${tokenMedico}`)\n      .send({ blocos: [{ diaSemana: 1, horaInicio: '08:00', horaFim: '12:00' }] });\n    expect(r.status).toBe(200);\n    expect(r.body).toHaveLength(1);\n    expect(r.body[0].diaSemana).toBe(1);\n  });\n\n  /**\n   * @caso CT-API-045\n   * @nivel api\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RN30\n   * @objetivo Impedir que médico altere a grade de colega\n   * @resultadoEsperado PUT do médico 2 sobre o médico 1 devolve 403 SEM_PERMISSAO\n   */\n  test('médico não altera grade de colega', async () => {\n    const r = await request(app).put('/api/medicos/1/disponibilidades')\n      .set('Authorization', `Bearer ${tokenBeatriz}`)\n      .send({ blocos: [] });\n    expect(r.status).toBe(403);\n    expect(r.body.erro.codigo).toBe('SEM_PERMISSAO');\n  });\n\n  /**\n   * @caso CT-API-046\n   * @nivel api\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN11, RNF04\n   * @objetivo Recusar grade com blocos sobrepostos no mesmo dia\n   * @resultadoEsperado resposta 400 VALIDACAO citando sobreposição\n   */\n  test('blocos sobrepostos retornam 400', async () => {\n    const r = await request(app).put('/api/medicos/2/disponibilidades')\n      .set('Authorization', `Bearer ${tokenBeatriz}`)\n      .send({\n        blocos: [\n          { diaSemana: 1, horaInicio: '08:00', horaFim: '12:00' },\n          { diaSemana: 1, horaInicio: '11:00', horaFim: '14:00' },\n        ],\n      });\n    expect(r.status).toBe(400);\n    expect(r.body.erro.mensagem).toContain('sobrepostos');\n  });\n\n  /**\n   * @caso CT-API-047\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF05.1\n   * @objetivo Consultar a grade vigente do médico\n   * @resultadoEsperado GET disponibilidades devolve 200 com 1 bloco de segunda\n   */\n  test('consulta a grade do médico', async () => {\n    const r = await request(app).get('/api/medicos/1/disponibilidades')\n      .set('Authorization', `Bearer ${tokenPaciente}`);\n    expect(r.status).toBe(200);\n    expect(r.body).toHaveLength(1);\n    expect(r.body[0]).toEqual({ id: expect.any(Number), diaSemana: 1, horaInicio: '08:00', horaFim: '12:00' });\n  });\n});\n\ndescribe('bloqueios (RF06, RN12, RN13, RN30)', () => {\n  /**\n   * @caso CT-API-048\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF06.1, RN12\n   * @objetivo Criar bloqueio por período com motivo pela recepção\n   * @resultadoEsperado resposta 201 com id, período e motivo 'Congresso'\n   */\n  test('recepção cria bloqueio', async () => {\n    const r = await request(app).post('/api/medicos/1/bloqueios')\n      .set('Authorization', `Bearer ${tokenRecepcao}`)\n      .send({ dataInicio: '2026-11-05', dataFim: '2026-11-06', motivo: 'Congresso' });\n    expect(r.status).toBe(201);\n    expect(r.body.id).toBeGreaterThan(0);\n    expect(r.body.motivo).toBe('Congresso');\n    expect(r.body.dataFim).toBe('2026-11-06');\n  });\n\n  /**\n   * @caso CT-API-049\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF06.1\n   * @objetivo Criar bloqueio pelo próprio médico\n   * @resultadoEsperado resposta 201 do bloqueio de férias em 2026-10-26\n   */\n  test('médico cria bloqueio na própria agenda', async () => {\n    const r = await request(app).post('/api/medicos/1/bloqueios')\n      .set('Authorization', `Bearer ${tokenMedico}`)\n      .send({ dataInicio: '2026-10-26', dataFim: '2026-10-27', motivo: 'Férias' });\n    expect(r.status).toBe(201);\n    expect(r.body.motivo).toBe('Férias');\n  });\n\n  /**\n   * @caso CT-API-050\n   * @nivel api\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RN30\n   * @objetivo Impedir que médico crie bloqueio na agenda de colega\n   * @resultadoEsperado resposta 403 SEM_PERMISSAO\n   */\n  test('médico não cria bloqueio de colega', async () => {\n    const r = await request(app).post('/api/medicos/1/bloqueios')\n      .set('Authorization', `Bearer ${tokenBeatriz}`)\n      .send({ dataInicio: '2026-11-10', dataFim: '2026-11-11', motivo: 'Alheio' });\n    expect(r.status).toBe(403);\n    expect(r.body.erro.codigo).toBe('SEM_PERMISSAO');\n  });\n\n  /**\n   * @caso CT-API-051\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN13\n   * @objetivo Recusar bloqueio em período com consulta ativa do médico\n   * @resultadoEsperado com consulta agendada em 2026-10-20, bloqueio nesse período devolve 422 citando 1 consulta\n   */\n  test.skip('bloqueio sobre consulta ativa retorna 422', async () => {\n    const agendar = await request(app).post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenRecepcao}`)\n      .send({ pacienteId: 1, medicoId: 1, inicio: '2026-10-20 08:00' });\n    expect(agendar.status).toBe(201);\n    const r = await request(app).post('/api/medicos/1/bloqueios')\n      .set('Authorization', `Bearer ${tokenRecepcao}`)\n      .send({ dataInicio: '2026-10-20', dataFim: '2026-10-21', motivo: 'Reforma' });\n    expect(r.status).toBe(422);\n    expect(r.body.erro.mensagem).toContain('1 consulta');\n  });\n\n  /**\n   * @caso CT-API-052\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF06.1\n   * @objetivo Listar os bloqueios do médico\n   * @resultadoEsperado resposta 200 com os 2 bloqueios criados\n   */\n  test('lista bloqueios do médico', async () => {\n    const r = await request(app).get('/api/medicos/1/bloqueios')\n      .set('Authorization', `Bearer ${tokenRecepcao}`);\n    expect(r.status).toBe(200);\n    expect(r.body).toHaveLength(2);\n  });\n\n  /**\n   * @caso CT-API-053\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF06.2\n   * @objetivo Remover bloqueio existente\n   * @resultadoEsperado DELETE devolve 204 e a listagem passa a ter 1 bloqueio\n   */\n  test('remove bloqueio existente', async () => {\n    const lista = await request(app).get('/api/medicos/1/bloqueios')\n      .set('Authorization', `Bearer ${tokenRecepcao}`);\n    const id = lista.body.find((b) => b.motivo === 'Congresso').id;\n    const r = await request(app).delete(`/api/medicos/1/bloqueios/${id}`)\n      .set('Authorization', `Bearer ${tokenRecepcao}`);\n    expect(r.status).toBe(204);\n    const depois = await request(app).get('/api/medicos/1/bloqueios')\n      .set('Authorization', `Bearer ${tokenRecepcao}`);\n    expect(depois.body).toHaveLength(1);\n  });\n\n  /**\n   * @caso CT-API-054\n   * @nivel api\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RF06.2, RNF04\n   * @objetivo Retornar 404 ao remover bloqueio inexistente\n   * @resultadoEsperado DELETE de bloqueio 9999 devolve 404 NAO_ENCONTRADO\n   */\n  test('remover bloqueio inexistente retorna 404', async () => {\n    const r = await request(app).delete('/api/medicos/1/bloqueios/9999')\n      .set('Authorization', `Bearer ${tokenRecepcao}`);\n    expect(r.status).toBe(404);\n    expect(r.body.erro.codigo).toBe('NAO_ENCONTRADO');\n  });\n\n  /**\n   * @caso CT-API-055\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN15, RN12\n   * @objetivo Não devolver horários em data dentro de bloqueio\n   * @resultadoEsperado GET horários de 2026-10-26 (segunda com grade) devolve lista vazia por bloqueio\n   */\n  test('data bloqueada devolve lista vazia', async () => {\n    const r = await request(app)\n      .get('/api/medicos/1/horarios?data=2026-10-26')\n      .set('Authorization', `Bearer ${tokenPaciente}`);\n    expect(r.status).toBe(200);\n    expect(r.body.horarios).toEqual([]);\n  });\n});\n"},"backend/__testes__/integracao/cadastro-servicos.test.js":{"tests":[{"id":"123","name":"registrarPaciente (RF02, RN01–RN03, RN05, RN06) persiste paciente com CPF normalizado","location":{"start":{"column":9,"line":41}}},{"id":"124","name":"registrarPaciente (RF02, RN01–RN03, RN05, RN06) recusa CPF duplicado","location":{"start":{"column":4,"line":60}}},{"id":"125","name":"registrarPaciente (RF02, RN01–RN03, RN05, RN06) recusa e-mail duplicado ignorando caixa","location":{"start":{"column":4,"line":79}}},{"id":"126","name":"registrarPaciente (RF02, RN01–RN03, RN05, RN06) exige responsável para menor sem responsável","location":{"start":{"column":9,"line":96}}},{"id":"127","name":"registrarPaciente (RF02, RN01–RN03, RN05, RN06) grava o responsável do menor informado","location":{"start":{"column":9,"line":115}}},{"id":"128","name":"registrarPaciente (RF02, RN01–RN03, RN05, RN06) recusa senha fraca","location":{"start":{"column":4,"line":132}}},{"id":"129","name":"criarMedico (RF04, RN07, RN08) usa duração padrão de 30 minutos","location":{"start":{"column":4,"line":152}}},{"id":"130","name":"criarMedico (RF04, RN07, RN08) recusa CRM duplicado","location":{"start":{"column":4,"line":170}}},{"id":"131","name":"criarMedico (RF04, RN07, RN08) recusa especialidade inexistente","location":{"start":{"column":4,"line":188}}},{"id":"132","name":"criarMedico (RF04, RN07, RN08) recusa duração inválida","location":{"start":{"column":4,"line":206}}},{"id":"133","name":"criarEspecialidade (RF03, RN09) persiste especialidade com preço em centavos","location":{"start":{"column":4,"line":225}}},{"id":"134","name":"criarEspecialidade (RF03, RN09) recusa nome duplicado e preço zero","location":{"start":{"column":4,"line":240}}},{"id":"135","name":"contas de usuário (RN21, RNF01) alterna o usuário entre inativo e ativo","location":{"start":{"column":9,"line":259}}},{"id":"136","name":"contas de usuário (RN21, RNF01) armazena hash bcrypt e não a senha em claro","location":{"start":{"column":9,"line":276}}}],"source":"// Testes de integração do cadastro: serviços + repositórios + SQLite em memória (RF02, RN01–RN03, RN05–RN09, RNF01).\nconst clock = require('../../src/utils/clock');\nconst { abrirBanco } = require('../../src/db/connection');\nconst { semear, SENHA_PADRAO } = require('../../src/db/seed');\nconst { criarServicos } = require('../../src/services');\nconst bcrypt = require('bcryptjs');\n\nlet db, servicos;\n\nbeforeAll(() => {\n  // O relógio é fixado antes de semear: a idade do paciente menor depende dele.\n  clock.definirAgora(new Date(2026, 9, 19, 8, 0)); // 2026-10-19 08:00\n  db = abrirBanco(':memory:');\n  semear(db);\n  servicos = criarServicos(db);\n});\n\nafterAll(() => {\n  clock.definirAgora(null);\n  db.close();\n});\n\nconst capturar = (acao) => {\n  try {\n    return acao();\n  } catch (erro) {\n    return erro;\n  }\n};\n\ndescribe('registrarPaciente (RF02, RN01–RN03, RN05, RN06)', () => {\n  /**\n   * @caso CT-INT-001\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF02.2, RN03\n   * @objetivo Persistir paciente gravando o CPF apenas com dígitos\n   * @resultadoEsperado registrarPaciente retorna o paciente com cpf '12345678906' e o registro existe no banco\n   */\n  test.skip('persiste paciente com CPF normalizado', () => {\n    const paciente = servicos.cadastroService.registrarPaciente({\n      nome: 'Marina Silva', email: 'marina@email.com', senha: SENHA_PADRAO,\n      cpf: '123.456.789-06', dataNascimento: '1995-03-10', telefone: '(11) 91234-5678',\n    });\n    expect(paciente.id).toBe(4);\n    expect(paciente.cpf).toBe('12345678906');\n    expect(servicos.repos.pacientes.buscarPorId(paciente.id).nome).toBe('Marina Silva');\n  });\n\n  /**\n   * @caso CT-INT-002\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN03\n   * @objetivo Recusar cadastro com CPF já usado por outro paciente\n   * @resultadoEsperado registrarPaciente lança CONFLITO (409) com mensagem de CPF já cadastrado\n   */\n  test('recusa CPF duplicado', () => {\n    const erro = capturar(() => servicos.cadastroService.registrarPaciente({\n      nome: 'Outra Pessoa', email: 'outra@email.com', senha: SENHA_PADRAO,\n      cpf: '529.982.247-25', dataNascimento: '1992-01-01',\n    }));\n    expect(erro.status).toBe(409);\n    expect(erro.codigo).toBe('CONFLITO');\n    expect(erro.message).toBe('CPF já cadastrado.');\n  });\n\n  /**\n   * @caso CT-INT-003\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN01\n   * @objetivo Recusar cadastro com e-mail duplicado, inclusive em caixa diferente\n   * @resultadoEsperado registrarPaciente lança CONFLITO (409) para 'ana@email.com' e 'ANA@EMAIL.COM'\n   */\n  test('recusa e-mail duplicado ignorando caixa', () => {\n    const dadosBase = { nome: 'Cópia Ana', senha: SENHA_PADRAO, cpf: '987.654.321-00', dataNascimento: '1992-01-01' };\n    const erro = capturar(() => servicos.cadastroService.registrarPaciente({ ...dadosBase, email: 'ANA@EMAIL.COM' }));\n    expect(erro.status).toBe(409);\n    expect(erro.codigo).toBe('CONFLITO');\n    expect(erro.message).toBe('E-mail já cadastrado.');\n  });\n\n  /**\n   * @caso CT-INT-004\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN06\n   * @objetivo Recusar paciente menor de 18 anos sem nome do responsável\n   * @resultadoEsperado registrarPaciente lança VALIDACAO (400) exigindo o responsável\n   */\n  test.skip('exige responsável para menor sem responsável', () => {\n    const erro = capturar(() => servicos.cadastroService.registrarPaciente({\n      nome: 'Pedro Menor', email: 'pedro@email.com', senha: SENHA_PADRAO,\n      cpf: '390.533.447-06', dataNascimento: '2015-04-01',\n    }));\n    expect(erro.status).toBe(400);\n    expect(erro.codigo).toBe('VALIDACAO');\n    expect(erro.message).toBe('Paciente menor de 18 anos deve informar o nome do responsável.');\n  });\n\n  /**\n   * @caso CT-INT-005\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN06\n   * @objetivo Persistir o nome do responsável de um paciente menor\n   * @resultadoEsperado registrarPaciente grava responsavelNome 'Sandra Menor' no banco\n   */\n  test.skip('grava o responsável do menor informado', () => {\n    const menor = servicos.cadastroService.registrarPaciente({\n      nome: 'Lucia Menor', email: 'lucia@email.com', senha: SENHA_PADRAO,\n      cpf: '111.444.777-36', dataNascimento: '2018-07-20', responsavelNome: 'Sandra Menor',\n    });\n    expect(servicos.repos.pacientes.buscarPorId(menor.id).responsavelNome).toBe('Sandra Menor');\n  });\n\n  /**\n   * @caso CT-INT-006\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN02\n   * @objetivo Recusar senha que não tem 8 caracteres com letra e número\n   * @resultadoEsperado registrarPaciente lança VALIDACAO (400) com a mensagem de senha\n   */\n  test('recusa senha fraca', () => {\n    const erro = capturar(() => servicos.cadastroService.registrarPaciente({\n      nome: 'Senha Fraca', email: 'fraca@email.com', senha: 'abc',\n      cpf: '123.456.789-11', dataNascimento: '1990-01-01',\n    }));\n    expect(erro.status).toBe(400);\n    expect(erro.message).toBe('Senha deve ter no mínimo 8 caracteres, com letras e números.');\n  });\n});\n\ndescribe('criarMedico (RF04, RN07, RN08)', () => {\n  /**\n   * @caso CT-INT-007\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF04.1, RN08\n   * @objetivo Gravar médico com a duração padrão de 30 minutos quando não informada\n   * @resultadoEsperado criarMedico retorna duração 30 e o médico aparece no banco com a especialidade certa\n   */\n  test('usa duração padrão de 30 minutos', () => {\n    const medico = servicos.cadastroService.criarMedico({\n      nome: 'Dra. Helena Costa', email: 'helena@clinica.com', senha: SENHA_PADRAO,\n      crm: '5555/SE', especialidadeId: 1,\n    });\n    expect(medico.duracaoConsultaMin).toBe(30);\n    expect(servicos.repos.medicos.buscarPorId(medico.id).crm).toBe('5555/SE');\n  });\n\n  /**\n   * @caso CT-INT-008\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN07\n   * @objetivo Recusar CRM já cadastrado\n   * @resultadoEsperado criarMedico lança CONFLITO (409) para '123456/SP'\n   */\n  test('recusa CRM duplicado', () => {\n    const erro = capturar(() => servicos.cadastroService.criarMedico({\n      nome: 'Doutor Duplicado', email: 'duplicado@clinica.com', senha: SENHA_PADRAO,\n      crm: '123456/SP', especialidadeId: 1,\n    }));\n    expect(erro.status).toBe(409);\n    expect(erro.message).toBe('CRM já cadastrado.');\n  });\n\n  /**\n   * @caso CT-INT-009\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF04.1\n   * @objetivo Recusar médico com especialidade que não existe\n   * @resultadoEsperado criarMedico lança VALIDACAO (400) informando especialidade inexistente\n   */\n  test('recusa especialidade inexistente', () => {\n    const erro = capturar(() => servicos.cadastroService.criarMedico({\n      nome: 'Dr. Fantasma', email: 'fantasma@clinica.com', senha: SENHA_PADRAO,\n      crm: '7777/BA', especialidadeId: 999,\n    }));\n    expect(erro.status).toBe(400);\n    expect(erro.message).toBe('Especialidade inexistente.');\n  });\n\n  /**\n   * @caso CT-INT-010\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN08\n   * @objetivo Recusar duração fora de 15–60 minutos ou não múltipla de 15\n   * @resultadoEsperado criarMedico lança VALIDACAO (400) para 10 e 20 minutos\n   */\n  test('recusa duração inválida', () => {\n    const dados = { nome: 'Dr. Ritmo', email: 'ritmo@clinica.com', senha: SENHA_PADRAO, crm: '8888/GO', especialidadeId: 1 };\n    for (const duracao of [10, 20]) {\n      const erro = capturar(() => servicos.cadastroService.criarMedico({ ...dados, email: `ritmo${duracao}@clinica.com`, duracaoConsultaMin: duracao }));\n      expect(erro.message).toBe('Duração da consulta deve ser de 15 a 60 minutos, em múltiplos de 15.');\n    }\n  });\n});\n\ndescribe('criarEspecialidade (RF03, RN09)', () => {\n  /**\n   * @caso CT-INT-011\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF03.1, RN09\n   * @objetivo Persistir especialidade com nome e preço base em centavos\n   * @resultadoEsperado criarEspecialidade retorna a especialidade com precoCentavos 18000 e ela fica listável\n   */\n  test('persiste especialidade com preço em centavos', () => {\n    const especialidade = servicos.cadastroService.criarEspecialidade({ nome: 'Oftalmologia', precoCentavos: 18000 });\n    expect(especialidade.id).toBe(5);\n    expect(servicos.repos.especialidades.buscarPorNome('Oftalmologia').precoCentavos).toBe(18000);\n  });\n\n  /**\n   * @caso CT-INT-012\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN09\n   * @objetivo Recusar especialidade duplicada e preço não positivo\n   * @resultadoEsperado criarEspecialidade lança CONFLITO para nome repetido e VALIDACAO para preço zero\n   */\n  test('recusa nome duplicado e preço zero', () => {\n    const duplicada = capturar(() => servicos.cadastroService.criarEspecialidade({ nome: 'Oftalmologia', precoCentavos: 18000 }));\n    expect(duplicada.status).toBe(409);\n    const precoZero = capturar(() => servicos.cadastroService.criarEspecialidade({ nome: 'Nutrição', precoCentavos: 0 }));\n    expect(precoZero.status).toBe(400);\n    expect(precoZero.message).toBe('Preço deve ser um inteiro em centavos maior que zero.');\n  });\n});\n\ndescribe('contas de usuário (RN21, RNF01)', () => {\n  /**\n   * @caso CT-INT-013\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF02, RN21\n   * @objetivo Atualizar a situação ativo/inativo do usuário no banco\n   * @resultadoEsperado definirUsuarioAtivo persiste ativo false e depois true\n   */\n  test.skip('alterna o usuário entre inativo e ativo', () => {\n    const usuario = servicos.repos.usuarios.buscarPorEmail('marina@email.com');\n    servicos.cadastroService.definirUsuarioAtivo(usuario.id, false);\n    expect(servicos.repos.usuarios.buscarPorId(usuario.id).ativo).toBe(false);\n    servicos.cadastroService.definirUsuarioAtivo(usuario.id, true);\n    expect(servicos.repos.usuarios.buscarPorId(usuario.id).ativo).toBe(true);\n  });\n\n  /**\n   * @caso CT-INT-014\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo confidencialidade\n   * @requisito RNF01\n   * @objetivo Gravar a senha como hash bcrypt, nunca em texto puro\n   * @resultadoEsperado o campo senha_hash começa com '$2', difere do texto e valida com compareSync\n   */\n  test.skip('armazena hash bcrypt e não a senha em claro', () => {\n    const usuario = servicos.repos.usuarios.buscarPorEmail('marina@email.com');\n    expect(usuario.senhaHash).not.toBe(SENHA_PADRAO);\n    expect(usuario.senhaHash).toMatch(/^\\$2/);\n    expect(bcrypt.compareSync(SENHA_PADRAO, usuario.senhaHash)).toBe(true);\n  });\n});\n"},"backend/__testes__/api/auth-registro-api.test.js":{"tests":[{"id":"137","name":"POST /api/auth/login (RF01.1, RN04) login válido retorna 200 com token e usuário","location":{"start":{"column":4,"line":32}}},{"id":"138","name":"POST /api/auth/login (RF01.1, RN04) senha errada retorna 401 no formato de erro padronizado","location":{"start":{"column":4,"line":49}}},{"id":"139","name":"POST /api/auth/login (RF01.1, RN04) login sem campos retorna 400","location":{"start":{"column":4,"line":65}}},{"id":"140","name":"POST /api/auth/login (RF01.1, RN04) JSON malformado retorna 400 tratado","location":{"start":{"column":4,"line":81}}},{"id":"141","name":"POST /api/auth/login (RF01.1, RN04) quinta tentativa errada retorna 423","location":{"start":{"column":4,"line":100}}},{"id":"142","name":"POST /api/auth/login (RF01.1, RN04) senha correta durante bloqueio retorna 423","location":{"start":{"column":4,"line":120}}},{"id":"143","name":"GET /api/auth/me (RF01.2, RF01.3, RNF02) requisição sem token retorna 401","location":{"start":{"column":4,"line":137}}},{"id":"144","name":"GET /api/auth/me (RF01.2, RF01.3, RNF02) token inválido retorna 401","location":{"start":{"column":4,"line":153}}},{"id":"145","name":"GET /api/auth/me (RF01.2, RF01.3, RNF02) token válido retorna o usuário logado","location":{"start":{"column":4,"line":168}}},{"id":"146","name":"POST /api/auth/registro (RF02, RN01–RN03, RN06, RNF01) auto-cadastro cria paciente sem token","location":{"start":{"column":9,"line":187}}},{"id":"147","name":"POST /api/auth/registro (RF02, RN01–RN03, RN06, RNF01) menor sem responsável recebe 400","location":{"start":{"column":4,"line":208}}},{"id":"148","name":"POST /api/auth/registro (RF02, RN01–RN03, RN06, RNF01) menor com responsável é aceito","location":{"start":{"column":4,"line":226}}},{"id":"149","name":"POST /api/auth/registro (RF02, RN01–RN03, RN06, RNF01) e-mail duplicado retorna 409","location":{"start":{"column":4,"line":244}}},{"id":"150","name":"POST /api/auth/registro (RF02, RN01–RN03, RN06, RNF01) CPF inválido retorna 400","location":{"start":{"column":4,"line":263}}},{"id":"151","name":"POST /api/auth/registro (RF02, RN01–RN03, RN06, RNF01) senha fraca retorna 400","location":{"start":{"column":4,"line":281}}}],"source":"// Testes de API de autenticação e registro público (RF01, RF02, RN01–RN04, RNF02, RNF04).\nconst clock = require('../../src/utils/clock');\nconst request = require('supertest');\nconst { abrirBanco } = require('../../src/db/connection');\nconst { semear } = require('../../src/db/seed');\nconst { criarApp } = require('../../src/app');\n\nlet db, app;\n\nbeforeAll(async () => {\n  clock.definirAgora(new Date(2026, 9, 19, 8, 0)); // 2026-10-19 08:00, segunda-feira\n  db = abrirBanco(':memory:');\n  semear(db);\n  app = criarApp({ db });\n});\n\nafterAll(() => {\n  clock.definirAgora(null);\n  db.close();\n});\n\ndescribe('POST /api/auth/login (RF01.1, RN04)', () => {\n  /**\n   * @caso CT-API-001\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF01.1\n   * @objetivo Autenticar via POST /api/auth/login com credenciais válidas\n   * @resultadoEsperado resposta 200 com body.token e body.usuario.perfil 'PACIENTE'\n   */\n  test('login válido retorna 200 com token e usuário', async () => {\n    const r = await request(app).post('/api/auth/login').send({ email: 'ana@email.com', senha: 'Senha123' });\n    expect(r.status).toBe(200);\n    expect(typeof r.body.token).toBe('string');\n    expect(r.body.usuario.perfil).toBe('PACIENTE');\n    expect(r.body.usuario.email).toBe('ana@email.com');\n  });\n\n  /**\n   * @caso CT-API-002\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF01.1, RNF04\n   * @objetivo Recusar credenciais erradas com o contrato de erro da API\n   * @resultadoEsperado resposta 401 com body.erro.codigo 'NAO_AUTENTICADO' e mensagem genérica\n   */\n  test('senha errada retorna 401 no formato de erro padronizado', async () => {\n    const r = await request(app).post('/api/auth/login').send({ email: 'ana@email.com', senha: 'Errada123' });\n    expect(r.status).toBe(401);\n    expect(r.body.erro.codigo).toBe('NAO_AUTENTICADO');\n    expect(r.body.erro.mensagem).toBe('E-mail ou senha inválidos.');\n  });\n\n  /**\n   * @caso CT-API-003\n   * @nivel api\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RF01.1, RNF04\n   * @objetivo Tratar login sem e-mail ou senha no corpo\n   * @resultadoEsperado resposta 400 com codigo 'VALIDACAO' pedindo e-mail e senha\n   */\n  test('login sem campos retorna 400', async () => {\n    const r = await request(app).post('/api/auth/login').send({});\n    expect(r.status).toBe(400);\n    expect(r.body.erro.codigo).toBe('VALIDACAO');\n    expect(r.body.erro.mensagem).toBe('Informe e-mail e senha.');\n  });\n\n  /**\n   * @caso CT-API-004\n   * @nivel api\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RNF04\n   * @objetivo Tratar corpo com JSON malformado sem derrubar o serviço\n   * @resultadoEsperado resposta 400 com codigo 'VALIDACAO' e mensagem de JSON inválido\n   */\n  test('JSON malformado retorna 400 tratado', async () => {\n    const r = await request(app)\n      .post('/api/auth/login')\n      .set('Content-Type', 'application/json')\n      .send('{\"email\":');\n    expect(r.status).toBe(400);\n    expect(r.body.erro.codigo).toBe('VALIDACAO');\n    expect(r.body.erro.mensagem).toBe('Corpo da requisição não é um JSON válido.');\n  });\n\n  /**\n   * @caso CT-API-005\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN04\n   * @objetivo Bloquear a conta na quinta tentativa errada consecutiva pela API\n   * @resultadoEsperado 4 erros devolvem 401 e o 5º devolve 423 com codigo 'CONTA_BLOQUEADA'\n   */\n  test('quinta tentativa errada retorna 423', async () => {\n    for (let i = 0; i <"+" 4; i += 1) {\n      const r = await request(app).post('/api/auth/login').send({ email: 'joao@email.com', senha: 'Errada123' });\n      expect(r.status).toBe(401);\n    }\n    const r = await request(app).post('/api/auth/login').send({ email: 'joao@email.com', senha: 'Errada123' });\n    expect(r.status).toBe(423);\n    expect(r.body.erro.codigo).toBe('CONTA_BLOQUEADA');\n    expect(r.body.erro.mensagem).toContain('2026-10-19 08:15');\n  });\n\n  /**\n   * @caso CT-API-006\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN04\n   * @objetivo Recusar até a senha correta enquanto a conta estiver bloqueada\n   * @resultadoEsperado login correto durante o bloqueio devolve 423 CONTA_BLOQUEADA\n   */\n  test('senha correta durante bloqueio retorna 423', async () => {\n    const r = await request(app).post('/api/auth/login').send({ email: 'joao@email.com', senha: 'Senha123' });\n    expect(r.status).toBe(423);\n    expect(r.body.erro.codigo).toBe('CONTA_BLOQUEADA');\n  });\n});\n\ndescribe('GET /api/auth/me (RF01.2, RF01.3, RNF02)', () => {\n  /**\n   * @caso CT-API-007\n   * @nivel api\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RF01.2, RNF02\n   * @objetivo Exigir token Bearer na rota autenticada\n   * @resultadoEsperado requisição sem Authorization devolve 401 'Autenticação necessária.'\n   */\n  test('requisição sem token retorna 401', async () => {\n    const r = await request(app).get('/api/auth/me');\n    expect(r.status).toBe(401);\n    expect(r.body.erro.codigo).toBe('NAO_AUTENTICADO');\n    expect(r.body.erro.mensagem).toBe('Autenticação necessária.');\n  });\n\n  /**\n   * @caso CT-API-008\n   * @nivel api\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RNF02\n   * @objetivo Recusar token inválido na rota autenticada\n   * @resultadoEsperado Authorization com token falsificado devolve 401 'Token inválido ou expirado.'\n   */\n  test('token inválido retorna 401', async () => {\n    const r = await request(app).get('/api/auth/me').set('Authorization', 'Bearer abc.def.ghi');\n    expect(r.status).toBe(401);\n    expect(r.body.erro.mensagem).toBe('Token inválido ou expirado.');\n  });\n\n  /**\n   * @caso CT-API-009\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF01.3\n   * @objetivo Retornar os dados do usuário logado pelo token\n   * @resultadoEsperado GET /api/auth/me devolve 200 com e-mail e perfil do usuário do token\n   */\n  test('token válido retorna o usuário logado', async () => {\n    const login = await request(app).post('/api/auth/login').send({ email: 'recepcao@clinica.com', senha: 'Senha123' });\n    const r = await request(app).get('/api/auth/me').set('Authorization', `Bearer ${login.body.token}`);\n    expect(r.status).toBe(200);\n    expect(r.body.email).toBe('recepcao@clinica.com');\n    expect(r.body.perfil).toBe('RECEPCAO');\n  });\n});\n\ndescribe('POST /api/auth/registro (RF02, RN01–RN03, RN06, RNF01)', () => {\n  /**\n   * @caso CT-API-010\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF02.1, RN03\n   * @objetivo Permitir auto-cadastro público sem token, gravando CPF só com dígitos\n   * @resultadoEsperado resposta 201 com o paciente criado, cpf '12345678906' e sem senhaHash\n   */\n  test.skip('auto-cadastro cria paciente sem token', async () => {\n    const r = await request(app).post('/api/auth/registro').send({\n      nome: 'Mariana Costa', email: 'mariana@email.com', senha: 'Senha123',\n      cpf: '123.456.789-06', dataNascimento: '1992-08-15', telefone: '(11) 94444-1010',\n    });\n    expect(r.status).toBe(201);\n    expect(r.body.id).toBeGreaterThan(0);\n    expect(r.body.nome).toBe('Mariana Costa');\n    expect(r.body.cpf).toBe('12345678906');\n    expect(r.body.senhaHash).toBeUndefined();\n  });\n\n  /**\n   * @caso CT-API-011\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN06\n   * @objetivo Recusar cadastro de menor de 18 anos sem responsável\n   * @resultadoEsperado resposta 400 VALIDACAO com a mensagem da RN06\n   */\n  test('menor sem responsável recebe 400', async () => {\n    const r = await request(app).post('/api/auth/registro').send({\n      nome: 'Enzo Silva', email: 'enzo@email.com', senha: 'Senha123',\n      cpf: '168.995.350-09', dataNascimento: '2015-01-01',\n    });\n    expect(r.status).toBe(400);\n    expect(r.body.erro.mensagem).toBe('Paciente menor de 18 anos deve informar o nome do responsável.');\n  });\n\n  /**\n   * @caso CT-API-012\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN06\n   * @objetivo Aceitar cadastro de menor com o responsável informado\n   * @resultadoEsperado resposta 201 gravando responsavelNome 'Marta Oliveira'\n   */\n  test('menor com responsável é aceito', async () => {\n    const r = await request(app).post('/api/auth/registro').send({\n      nome: 'Enzo Silva', email: 'enzo@email.com', senha: 'Senha123',\n      cpf: '168.995.350-09', dataNascimento: '2015-01-01', responsavelNome: 'Marta Oliveira',\n    });\n    expect(r.status).toBe(201);\n    expect(r.body.responsavelNome).toBe('Marta Oliveira');\n  });\n\n  /**\n   * @caso CT-API-013\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN01\n   * @objetivo Recusar cadastro com e-mail já existente\n   * @resultadoEsperado resposta 409 CONFLITO com 'E-mail já cadastrado.'\n   */\n  test('e-mail duplicado retorna 409', async () => {\n    const r = await request(app).post('/api/auth/registro').send({\n      nome: 'Cópia Ana', email: 'ana@email.com', senha: 'Senha123',\n      cpf: '123.456.789-06', dataNascimento: '1992-08-15',\n    });\n    expect(r.status).toBe(409);\n    expect(r.body.erro.codigo).toBe('CONFLITO');\n    expect(r.body.erro.mensagem).toBe('E-mail já cadastrado.');\n  });\n\n  /**\n   * @caso CT-API-014\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN03\n   * @objetivo Recusar cadastro com CPF de dígito verificador inválido\n   * @resultadoEsperado resposta 400 VALIDACAO com 'CPF inválido.'\n   */\n  test('CPF inválido retorna 400', async () => {\n    const r = await request(app).post('/api/auth/registro').send({\n      nome: 'CPF Ruim', email: 'cpfruim@email.com', senha: 'Senha123',\n      cpf: '123.456.789-00', dataNascimento: '1992-08-15',\n    });\n    expect(r.status).toBe(400);\n    expect(r.body.erro.mensagem).toBe('CPF inválido.');\n  });\n\n  /**\n   * @caso CT-API-015\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN02\n   * @objetivo Recusar cadastro com senha sem 8 caracteres ou sem número\n   * @resultadoEsperado resposta 400 VALIDACAO com a mensagem da política de senha\n   */\n  test('senha fraca retorna 400', async () => {\n    const r = await request(app).post('/api/auth/registro').send({\n      nome: 'Senha Fraca', email: 'senhafraca@email.com', senha: 'abc',\n      cpf: '987.654.321-00', dataNascimento: '1992-08-15',\n    });\n    expect(r.status).toBe(400);\n    expect(r.body.erro.mensagem).toBe('Senha deve ter no mínimo 8 caracteres, com letras e números.');\n  });\n});\n"},"backend/__testes__/unitario/consultas-estados.test.js":{"tests":[{"id":"152","name":"máquina de estados (RN25–RN29) AGENDADA transiciona para CONFIRMADA, CANCELADA, REALIZADA e FALTA","location":{"start":{"column":4,"line":18}}},{"id":"153","name":"máquina de estados (RN25–RN29) CONFIRMADA não volta para AGENDADA","location":{"start":{"column":4,"line":34}}},{"id":"154","name":"máquina de estados (RN25–RN29) estados finais não transicionam","location":{"start":{"column":4,"line":47}}},{"id":"155","name":"máquina de estados (RN25–RN29) apenas AGENDADA e CONFIRMADA são ativas","location":{"start":{"column":4,"line":62}}},{"id":"156","name":"validarAntecedencia (RN16) aceita exatamente 2 horas de antecedência","location":{"start":{"column":4,"line":81}}},{"id":"157","name":"validarAntecedencia (RN16) rejeita antecedência de 1h59","location":{"start":{"column":4,"line":94}}},{"id":"158","name":"validarAntecedencia (RN16) rejeita horário no passado","location":{"start":{"column":4,"line":108}}},{"id":"159","name":"validarAntecedencia (RN16) aceita exatamente 60 dias de antecedência","location":{"start":{"column":4,"line":122}}},{"id":"160","name":"validarAntecedencia (RN16) rejeita mais de 60 dias de antecedência","location":{"start":{"column":4,"line":135}}},{"id":"161","name":"validarLimitesPaciente (RN19) aceita agendamento sem consultas ativas","location":{"start":{"column":4,"line":151}}},{"id":"162","name":"validarLimitesPaciente (RN19) aceita a terceira consulta ativa","location":{"start":{"column":4,"line":164}}},{"id":"163","name":"validarLimitesPaciente (RN19) rejeita a quarta consulta ativa","location":{"start":{"column":4,"line":178}}},{"id":"164","name":"validarLimitesPaciente (RN19) rejeita segunda consulta na mesma especialidade","location":{"start":{"column":4,"line":193}}},{"id":"165","name":"calcularSuspensao (RN20) suspende com 3 faltas na janela de 90 dias","location":{"start":{"column":4,"line":211}}},{"id":"166","name":"calcularSuspensao (RN20) não suspende com 2 faltas","location":{"start":{"column":4,"line":225}}},{"id":"167","name":"calcularSuspensao (RN20) ignora falta fora da janela de 90 dias","location":{"start":{"column":4,"line":238}}},{"id":"168","name":"calcularSuspensao (RN20) não suspende quando a suspensão já venceu","location":{"start":{"column":4,"line":252}}}],"source":"// Testes unitários da máquina de estados, antecedência, limites e suspensão (RN16, RN19, RN20, RN25–RN29).\nconst {\n  podeTransitar, estaAtiva, validarAntecedencia, validarLimitesPaciente, calcularSuspensao,\n} = require('../../src/domain/consultas');\n\nconst AGORA = new Date(2026, 9, 19, 8, 0); // 2026-10-19 08:00 (segunda-feira)\n\ndescribe('máquina de estados (RN25–RN29)', () => {\n  /**\n   * @caso CT-UNI-057\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN25, RN26, RN27, RN28, RN29\n   * @objetivo Permitir todas as transições previstas a partir de AGENDADA\n   * @resultadoEsperado podeTransitar aceita CONFIRMADA, CANCELADA, REALIZADA e FALTA a partir de AGENDADA\n   */\n  test('AGENDADA transiciona para CONFIRMADA, CANCELADA, REALIZADA e FALTA', () => {\n    expect(podeTransitar('AGENDADA', 'CONFIRMADA')).toBe(true);\n    expect(podeTransitar('AGENDADA', 'CANCELADA')).toBe(true);\n    expect(podeTransitar('AGENDADA', 'REALIZADA')).toBe(true);\n    expect(podeTransitar('AGENDADA', 'FALTA')).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-058\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN25\n   * @objetivo Proibir a volta de CONFIRMADA para AGENDADA\n   * @resultadoEsperado podeTransitar retorna false para CONFIRMADA → AGENDADA\n   */\n  test('CONFIRMADA não volta para AGENDADA', () => {\n    expect(podeTransitar('CONFIRMADA', 'AGENDADA')).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-059\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN25, RN26, RN27, RN28, RN29\n   * @objetivo Proibir qualquer transição a partir dos estados finais\n   * @resultadoEsperado podeTransitar retorna false para REALIZADA, FALTA e CANCELADA tentando voltar a AGENDADA\n   */\n  test('estados finais não transicionam', () => {\n    expect(podeTransitar('REALIZADA', 'AGENDADA')).toBe(false);\n    expect(podeTransitar('FALTA', 'AGENDADA')).toBe(false);\n    expect(podeTransitar('CANCELADA', 'AGENDADA')).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-060\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN25, RN19\n   * @objetivo Considerar apenas AGENDADA e CONFIRMADA como consultas ativas\n   * @resultadoEsperado estaAtiva retorna true para AGENDADA e CONFIRMADA, false para os demais status\n   */\n  test('apenas AGENDADA e CONFIRMADA são ativas', () => {\n    expect(estaAtiva('AGENDADA')).toBe(true);\n    expect(estaAtiva('CONFIRMADA')).toBe(true);\n    expect(estaAtiva('REALIZADA')).toBe(false);\n    expect(estaAtiva('FALTA')).toBe(false);\n    expect(estaAtiva('CANCELADA')).toBe(false);\n  });\n});\n\ndescribe('validarAntecedencia (RN16)', () => {\n  /**\n   * @caso CT-UNI-061\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN16\n   * @objetivo Aceitar agendamento com exatamente 2 horas de antecedência (valor-limite)\n   * @resultadoEsperado validarAntecedencia retorna null para início às 10:00 com agora às 08:00\n   */\n  test('aceita exatamente 2 horas de antecedência', () => {\n    expect(validarAntecedencia(new Date(2026, 9, 19, 10, 0), AGORA)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-062\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN16\n   * @objetivo Rejeitar agendamento com 1 minuto a menos que a antecedência mínima\n   * @resultadoEsperado validarAntecedencia retorna mensagem de antecedência mínima para início às 09:59\n   */\n  test('rejeita antecedência de 1h59', () => {\n    const mensagem = validarAntecedencia(new Date(2026, 9, 19, 9, 59), AGORA);\n    expect(mensagem).toBe('A consulta deve ser agendada com no mínimo 2 horas de antecedência.');\n  });\n\n  /**\n   * @caso CT-UNI-063\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN16\n   * @objetivo Rejeitar agendamento no passado\n   * @resultadoEsperado validarAntecedencia retorna mensagem de antecedência mínima para início às 07:00 do mesmo dia\n   */\n  test('rejeita horário no passado', () => {\n    const mensagem = validarAntecedencia(new Date(2026, 9, 19, 7, 0), AGORA);\n    expect(mensagem).toBe('A consulta deve ser agendada com no mínimo 2 horas de antecedência.');\n  });\n\n  /**\n   * @caso CT-UNI-064\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN16\n   * @objetivo Aceitar agendamento com exatamente 60 dias de antecedência (valor-limite)\n   * @resultadoEsperado validarAntecedencia retorna null para 2026-12-18 08:00\n   */\n  test('aceita exatamente 60 dias de antecedência', () => {\n    expect(validarAntecedencia(new Date(2026, 11, 18, 8, 0), AGORA)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-065\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN16\n   * @objetivo Rejeitar agendamento além de 60 dias\n   * @resultadoEsperado validarAntecedencia retorna mensagem de antecedência máxima para 2026-12-21 08:00\n   */\n  test('rejeita mais de 60 dias de antecedência', () => {\n    const mensagem = validarAntecedencia(new Date(2026, 11, 21, 8, 0), AGORA);\n    expect(mensagem).toBe('A consulta deve ser agendada com no máximo 60 dias de antecedência.');\n  });\n});\n\ndescribe('validarLimitesPaciente (RN19)', () => {\n  /**\n   * @caso CT-UNI-066\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN19\n   * @objetivo Aceitar nova consulta quando o paciente não tem nenhuma ativa\n   * @resultadoEsperado validarLimitesPaciente retorna null para lista vazia\n   */\n  test('aceita agendamento sem consultas ativas', () => {\n    expect(validarLimitesPaciente([], 1)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-067\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN19\n   * @objetivo Aceitar a terceira consulta ativa, no limite permitido (valor-limite)\n   * @resultadoEsperado validarLimitesPaciente retorna null com 2 consultas ativas de especialidades distintas\n   */\n  test('aceita a terceira consulta ativa', () => {\n    const ativas = [{ especialidadeId: 1 }, { especialidadeId: 2 }];\n    expect(validarLimitesPaciente(ativas, 3)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-068\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN19\n   * @objetivo Rejeitar a quarta consulta ativa futura do paciente\n   * @resultadoEsperado validarLimitesPaciente retorna mensagem de limite com 3 consultas ativas\n   */\n  test('rejeita a quarta consulta ativa', () => {\n    const ativas = [{ especialidadeId: 1 }, { especialidadeId: 2 }, { especialidadeId: 3 }];\n    const mensagem = validarLimitesPaciente(ativas, 4);\n    expect(mensagem).toBe('O paciente já possui 3 consultas agendadas, que é o limite.');\n  });\n\n  /**\n   * @caso CT-UNI-069\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN19\n   * @objetivo Rejeitar segunda consulta ativa na mesma especialidade\n   * @resultadoEsperado validarLimitesPaciente retorna mensagem de especialidade quando já existe ativa nela\n   */\n  test('rejeita segunda consulta na mesma especialidade', () => {\n    const ativas = [{ especialidadeId: 2 }];\n    expect(validarLimitesPaciente(ativas, 2)).toBe('O paciente já possui uma consulta agendada nesta especialidade.');\n  });\n});\n\ndescribe('calcularSuspensao (RN20)', () => {\n  const falta = (dia, mes) => new Date(2026, mes - 1, dia, 9, 0);\n\n  /**\n   * @caso CT-UNI-070\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN20\n   * @objetivo Suspender paciente com 3 faltas nos últimos 90 dias até 30 dias após a última\n   * @resultadoEsperado calcularSuspensao retorna 2026-11-14 (última falta 2026-10-15 + 30 dias)\n   */\n  test('suspende com 3 faltas na janela de 90 dias', () => {\n    const fim = calcularSuspensao([falta('05', 10), falta('10', 10), falta('15', 10)], AGORA);\n    expect(fim).toEqual(new Date(2026, 10, 14, 9, 0));\n  });\n\n  /**\n   * @caso CT-UNI-071\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN20\n   * @objetivo Não suspender paciente com apenas 2 faltas na janela (valor-limite)\n   * @resultadoEsperado calcularSuspensao retorna null com 2 faltas\n   */\n  test('não suspende com 2 faltas', () => {\n    expect(calcularSuspensao([falta('05', 10), falta('10', 10)], AGORA)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-072\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN20\n   * @objetivo Desconsiderar falta ocorrida há mais de 90 dias (fora da janela)\n   * @resultadoEsperado calcularSuspensao retorna null quando só 2 das 3 faltas estão na janela\n   */\n  test('ignora falta fora da janela de 90 dias', () => {\n    const faltas = [new Date(2026, 6, 1, 9, 0), falta('10', 10), falta('15', 10)];\n    expect(calcularSuspensao(faltas, AGORA)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-073\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN20\n   * @objetivo Encerrar a suspensão quando os 30 dias após a última falta já passaram\n   * @resultadoEsperado calcularSuspensao retorna null quando a última falta (08-01) venceu a suspensão\n   */\n  test('não suspende quando a suspensão já venceu', () => {\n    const faltas = [falta('25', 7), falta('30', 7), falta('01', 8)];\n    expect(calcularSuspensao(faltas, AGORA)).toBeNull();\n  });\n});\n"},"backend/__testes__/unitario/consultas-confirmacao-cancelamento.test.js":{"tests":[{"id":"169","name":"verificarConfirmacao (RN25) paciente dono confirma dentro das 48 horas","location":{"start":{"column":4,"line":21}}},{"id":"170","name":"verificarConfirmacao (RN25) aceita confirmação com exatamente 48 horas","location":{"start":{"column":4,"line":34}}},{"id":"171","name":"verificarConfirmacao (RN25) recusa confirmação antes das 48 horas","location":{"start":{"column":4,"line":47}}},{"id":"172","name":"verificarConfirmacao (RN25) recusa confirmação de consulta já confirmada","location":{"start":{"column":4,"line":63}}},{"id":"173","name":"verificarConfirmacao (RN25) recusa confirmação de consulta já iniciada","location":{"start":{"column":4,"line":78}}},{"id":"174","name":"verificarConfirmacao (RN25) recusa confirmação por terceiros","location":{"start":{"column":4,"line":93}}},{"id":"175","name":"verificarConfirmacao (RN25) recepção pode confirmar qualquer consulta","location":{"start":{"column":4,"line":109}}},{"id":"176","name":"verificarCancelamento (RN26) paciente cancela com mais de 24 horas","location":{"start":{"column":4,"line":124}}},{"id":"177","name":"verificarCancelamento (RN26) aceita cancelamento com exatamente 24 horas","location":{"start":{"column":4,"line":137}}},{"id":"178","name":"verificarCancelamento (RN26) recusa cancelamento do paciente com menos de 24 horas","location":{"start":{"column":4,"line":150}}},{"id":"179","name":"verificarCancelamento (RN26) recepção precisa informar motivo","location":{"start":{"column":4,"line":165}}},{"id":"180","name":"verificarCancelamento (RN26) paciente pode cancelar sem motivo","location":{"start":{"column":9,"line":181}}},{"id":"181","name":"verificarCancelamento (RN26) recusa cancelamento por terceiros","location":{"start":{"column":4,"line":194}}},{"id":"182","name":"verificarCancelamento (RN26) recusa cancelamento de estado final","location":{"start":{"column":4,"line":209}}},{"id":"183","name":"verificarCancelamento (RN26) recusa cancelamento de consulta já iniciada","location":{"start":{"column":4,"line":225}}}],"source":"// Testes unitários das verificações de confirmação e cancelamento (RN25, RN26).\nconst { verificarConfirmacao, verificarCancelamento } = require('../../src/domain/consultas');\n\nconst AGORA = new Date(2026, 9, 19, 8, 0); // 2026-10-19 08:00 (segunda-feira)\nconst pacienteDono = { perfil: 'PACIENTE', ehDono: true };\nconst outroPaciente = { perfil: 'PACIENTE', ehDono: false };\nconst recepcao = { perfil: 'RECEPCAO' };\nconst medicoDono = { perfil: 'MEDICO', ehDono: true };\nconst consulta = (dia, hora, status = 'AGENDADA') => ({ id: 1, status, inicio: new Date(2026, 9, dia, hora, 0) });\n\ndescribe('verificarConfirmacao (RN25)', () => {\n  /**\n   * @caso CT-UNI-086\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN25\n   * @objetivo Permitir que o próprio paciente confirme consulta AGENDADA dentro das 48 horas\n   * @resultadoEsperado verificarConfirmacao retorna null para paciente dono com consulta em 4 horas\n   */\n  test('paciente dono confirma dentro das 48 horas', () => {\n    expect(verificarConfirmacao(consulta(19, 12), pacienteDono, AGORA)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-087\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN25\n   * @objetivo Aceitar confirmação com exatamente 48 horas de antecedência (valor-limite)\n   * @resultadoEsperado verificarConfirmacao retorna null para consulta em 2026-10-21 08:00\n   */\n  test('aceita confirmação com exatamente 48 horas', () => {\n    expect(verificarConfirmacao(consulta(21, 8), pacienteDono, AGORA)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-088\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN25\n   * @o
