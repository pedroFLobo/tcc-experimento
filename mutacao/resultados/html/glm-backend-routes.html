bjetivo Recusar confirmação feita com mais de 48 horas de antecedência\n   * @resultadoEsperado verificarConfirmacao retorna erro de regra para consulta em 2026-10-21 08:01\n   */\n  test('recusa confirmação antes das 48 horas', () => {\n    const consultaTardia = { id: 1, status: 'AGENDADA', inicio: new Date(2026, 9, 21, 8, 1) };\n    const resultado = verificarConfirmacao(consultaTardia, pacienteDono, AGORA);\n    expect(resultado.tipo).toBe('REGRA');\n    expect(resultado.mensagem).toBe('A confirmação só é permitida nas 48 horas anteriores à consulta.');\n  });\n\n  /**\n   * @caso CT-UNI-089\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN25\n   * @objetivo Recusar confirmação de consulta que já não está AGENDADA\n   * @resultadoEsperado verificarConfirmacao retorna erro de regra para consulta CONFIRMADA\n   */\n  test('recusa confirmação de consulta já confirmada', () => {\n    const resultado = verificarConfirmacao(consulta(19, 12, 'CONFIRMADA'), pacienteDono, AGORA);\n    expect(resultado.tipo).toBe('REGRA');\n    expect(resultado.mensagem).toBe('Somente consultas agendadas podem ser confirmadas.');\n  });\n\n  /**\n   * @caso CT-UNI-090\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN25\n   * @objetivo Recusar confirmação de consulta que já começou\n   * @resultadoEsperado verificarConfirmacao retorna erro de regra para consulta iniciada às 07:00\n   */\n  test('recusa confirmação de consulta já iniciada', () => {\n    const resultado = verificarConfirmacao(consulta(19, 7), pacienteDono, AGORA);\n    expect(resultado.tipo).toBe('REGRA');\n    expect(resultado.mensagem).toBe('A consulta já começou.');\n  });\n\n  /**\n   * @caso CT-UNI-091\n   * @nivel unitario\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RN25, RN30\n   * @objetivo Impedir que outro paciente ou um médico confirmem a consulta\n   * @resultadoEsperado verificarConfirmacao retorna erro de permissão para paciente não dono e para médico\n   */\n  test('recusa confirmação por terceiros', () => {\n    const porPaciente = verificarConfirmacao(consulta(19, 12), outroPaciente, AGORA);\n    expect(porPaciente.tipo).toBe('PERMISSAO');\n    const porMedico = verificarConfirmacao(consulta(19, 12), medicoDono, AGORA);\n    expect(porMedico.tipo).toBe('PERMISSAO');\n  });\n\n  /**\n   * @caso CT-UNI-092\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN25, RF09.1\n   * @objetivo Permitir que a recepção confirme a consulta de qualquer paciente\n   * @resultadoEsperado verificarConfirmacao retorna null para ator RECEPCAO\n   */\n  test('recepção pode confirmar qualquer consulta', () => {\n    expect(verificarConfirmacao(consulta(19, 12), recepcao, AGORA)).toBeNull();\n  });\n});\n\ndescribe('verificarCancelamento (RN26)', () => {\n  /**\n   * @caso CT-UNI-093\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN26\n   * @objetivo Permitir cancelamento pelo paciente com mais de 24 horas de antecedência\n   * @resultadoEsperado verificarCancelamento retorna null para paciente dono 25 horas antes, sem motivo\n   */\n  test('paciente cancela com mais de 24 horas', () => {\n    expect(verificarCancelamento(consulta(20, 9), pacienteDono, AGORA, null)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-094\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN26\n   * @objetivo Aceitar cancelamento com exatamente 24 horas de antecedência (valor-limite)\n   * @resultadoEsperado verificarCancelamento retorna null para consulta em 2026-10-20 08:00\n   */\n  test('aceita cancelamento com exatamente 24 horas', () => {\n    expect(verificarCancelamento(consulta(20, 8), pacienteDono, AGORA, null)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-095\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN26\n   * @objetivo Recusar cancelamento pelo paciente com menos de 24 horas\n   * @resultadoEsperado verificarCancelamento retorna erro de regra orientando procurar a recepção\n   */\n  test('recusa cancelamento do paciente com menos de 24 horas', () => {\n    const resultado = verificarCancelamento(consulta(19, 20), pacienteDono, AGORA, null);\n    expect(resultado.tipo).toBe('REGRA');\n    expect(resultado.mensagem).toBe('O paciente só pode cancelar com no mínimo 24 horas de antecedência. Procure a recepção.');\n  });\n\n  /**\n   * @caso CT-UNI-096\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN26\n   * @objetivo Exigir motivo no cancelamento feito pela recepção\n   * @resultadoEsperado verificarCancelamento retorna erro de regra sem motivo e null com motivo preenchido\n   */\n  test('recepção precisa informar motivo', () => {\n    const semMotivo = verificarCancelamento(consulta(19, 12), recepcao, AGORA, '   ');\n    expect(semMotivo.tipo).toBe('REGRA');\n    expect(semMotivo.mensagem).toBe('Informe o motivo do cancelamento.');\n    expect(verificarCancelamento(consulta(19, 12), recepcao, AGORA, 'Remanejamento da clínica')).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-097\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN26\n   * @objetivo Não exigir motivo quando quem cancela é o próprio paciente\n   * @resultadoEsperado verificarCancelamento retorna null sem motivo para paciente dono\n   */\n  test.skip('paciente pode cancelar sem motivo', () => {\n    expect(verificarCancelamento(consulta(19, 12), pacienteDono, AGORA, null)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-098\n   * @nivel unitario\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RN26, RN30\n   * @objetivo Impedir cancelamento por quem não é dono nem recepção\n   * @resultadoEsperado verificarCancelamento retorna erro de permissão para paciente não dono e médico não dono\n   */\n  test('recusa cancelamento por terceiros', () => {\n    expect(verificarCancelamento(consulta(19, 12), outroPaciente, AGORA, 'x').tipo).toBe('PERMISSAO');\n    const outroMedico = { perfil: 'MEDICO', ehDono: false };\n    expect(verificarCancelamento(consulta(19, 12), outroMedico, AGORA, 'x').tipo).toBe('PERMISSAO');\n  });\n\n  /**\n   * @caso CT-UNI-099\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN26\n   * @objetivo Recusar cancelamento de consulta já cancelada ou realizada\n   * @resultadoEsperado verificarCancelamento retorna erro de regra para status CANCELADA e REALIZADA\n   */\n  test('recusa cancelamento de estado final', () => {\n    const cancelada = verificarCancelamento(consulta(19, 12, 'CANCELADA'), recepcao, AGORA, 'Motivo');\n    expect(cancelada.mensagem).toBe('Esta consulta não pode mais ser cancelada.');\n    const realizada = verificarCancelamento(consulta(19, 12, 'REALIZADA'), recepcao, AGORA, 'Motivo');\n    expect(realizada.tipo).toBe('REGRA');\n  });\n\n  /**\n   * @caso CT-UNI-100\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN26\n   * @objetivo Recusar cancelamento após o início da consulta, mesmo pela recepção\n   * @resultadoEsperado verificarCancelamento retorna erro de regra para consulta iniciada às 07:00\n   */\n  test('recusa cancelamento de consulta já iniciada', () => {\n    const resultado = verificarCancelamento(consulta(19, 7), recepcao, AGORA, 'Motivo');\n    expect(resultado.mensagem).toBe('A consulta já começou e não pode ser cancelada.');\n  });\n});\n"},"backend/__testes__/unitario/consultas-remarcacao-atendimento.test.js":{"tests":[{"id":"184","name":"verificarRemarcacao (RN27) paciente remarca com mais de 24 horas","location":{"start":{"column":4,"line":22}}},{"id":"185","name":"verificarRemarcacao (RN27) recusa remarcação com menos de 24 horas","location":{"start":{"column":4,"line":35}}},{"id":"186","name":"verificarRemarcacao (RN27) aplica limite de 2 remarcações","location":{"start":{"column":4,"line":50}}},{"id":"187","name":"verificarRemarcacao (RN27) recusa remarcação de consulta cancelada","location":{"start":{"column":4,"line":66}}},{"id":"188","name":"verificarRemarcacao (RN27) recusa remarcação por terceiros","location":{"start":{"column":4,"line":80}}},{"id":"189","name":"verificarRealizacao (RN28) médico dono registra no horário da consulta","location":{"start":{"column":4,"line":96}}},{"id":"190","name":"verificarRealizacao (RN28) recusa registro antes do início","location":{"start":{"column":4,"line":109}}},{"id":"191","name":"verificarRealizacao (RN28) só o médico da consulta registra o atendimento","location":{"start":{"column":4,"line":123}}},{"id":"192","name":"verificarRealizacao (RN28) recusa atendimento em consulta cancelada","location":{"start":{"column":4,"line":138}}},{"id":"193","name":"verificarFalta (RN29) aceita falta com exatamente 15 minutos de tolerância","location":{"start":{"column":4,"line":154}}},{"id":"194","name":"verificarFalta (RN29) recusa falta dentro da tolerância de 15 minutos","location":{"start":{"column":4,"line":168}}},{"id":"195","name":"verificarFalta (RN29) só médico da consulta ou recepção registram falta","location":{"start":{"column":4,"line":184}}},{"id":"196","name":"verificarFalta (RN29) recepção pode registrar falta após a tolerância","location":{"start":{"column":4,"line":199}}}],"source":"// Testes unitários das verificações de remarcação, atendimento realizado e falta (RN27, RN28, RN29).\nconst { verificarRemarcacao, verificarRealizacao, verificarFalta } = require('../../src/domain/consultas');\n\nconst AGORA = new Date(2026, 9, 19, 8, 0); // 2026-10-19 08:00 (segunda-feira)\nconst pacienteDono = { perfil: 'PACIENTE', ehDono: true };\nconst outroPaciente = { perfil: 'PACIENTE', ehDono: false };\nconst recepcao = { perfil: 'RECEPCAO' };\nconst medicoDono = { perfil: 'MEDICO', ehDono: true };\nconst outroMedico = { perfil: 'MEDICO', ehDono: false };\nconst consulta = (dia, hora, status = 'AGENDADA', remarcacoes = 0) => ({ id: 1, status, remarcacoes, inicio: new Date(2026, 9, dia, hora, 0) });\n\ndescribe('verificarRemarcacao (RN27)', () => {\n  /**\n   * @caso CT-UNI-101\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN27\n   * @objetivo Permitir remarcação pelo paciente com mais de 24 horas e sem remarcações anteriores\n   * @resultadoEsperado verificarRemarcacao retorna null para consulta ativa em 2026-10-20 10:00\n   */\n  test('paciente remarca com mais de 24 horas', () => {\n    expect(verificarRemarcacao(consulta(20, 10), pacienteDono, AGORA)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-102\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN27\n   * @objetivo Recusar remarcação com menos de 24 horas do início atual\n   * @resultadoEsperado verificarRemarcacao retorna erro de regra para consulta no mesmo dia às 12:00\n   */\n  test('recusa remarcação com menos de 24 horas', () => {\n    const resultado = verificarRemarcacao(consulta(19, 12), pacienteDono, AGORA);\n    expect(resultado.tipo).toBe('REGRA');\n    expect(resultado.mensagem).toBe('A remarcação só é permitida até 24 horas antes da consulta.');\n  });\n\n  /**\n   * @caso CT-UNI-103\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN27\n   * @objetivo Recusar a terceira remarcação da mesma consulta (limite de 2)\n   * @resultadoEsperado verificarRemarcacao retorna erro de regra com remarcacoes = 2 e aceita com 1\n   */\n  test('aplica limite de 2 remarcações', () => {\n    const comUma = verificarRemarcacao(consulta(20, 10, 'AGENDADA', 1), pacienteDono, AGORA);\n    expect(comUma).toBeNull();\n    const comDuas = verificarRemarcacao(consulta(20, 10, 'AGENDADA', 2), pacienteDono, AGORA);\n    expect(comDuas.mensagem).toBe('Esta consulta já atingiu o limite de 2 remarcações.');\n  });\n\n  /**\n   * @caso CT-UNI-104\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN27\n   * @objetivo Recusar remarcação de consulta em estado final\n   * @resultadoEsperado verificarRemarcacao retorna erro de regra para status CANCELADA\n   */\n  test('recusa remarcação de consulta cancelada', () => {\n    const resultado = verificarRemarcacao(consulta(20, 10, 'CANCELADA'), pacienteDono, AGORA);\n    expect(resultado.mensagem).toBe('Somente consultas agendadas ou confirmadas podem ser remarcadas.');\n  });\n\n  /**\n   * @caso CT-UNI-105\n   * @nivel unitario\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RN27, RN30\n   * @objetivo Impedir que terceiros remarquem a consulta\n   * @resultadoEsperado verificarRemarcacao retorna erro de permissão para paciente não dono e médico dono\n   */\n  test('recusa remarcação por terceiros', () => {\n    expect(verificarRemarcacao(consulta(20, 10), outroPaciente, AGORA).tipo).toBe('PERMISSAO');\n    expect(verificarRemarcacao(consulta(20, 10), medicoDono, AGORA).tipo).toBe('PERMISSAO');\n  });\n});\n\ndescribe('verificarRealizacao (RN28)', () => {\n  /**\n   * @caso CT-UNI-106\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN28\n   * @objetivo Permitir que o médico da consulta registre o atendimento a partir do horário de início\n   * @resultadoEsperado verificarRealizacao retorna null para médico dono com agora igual ao início\n   */\n  test('médico dono registra no horário da consulta', () => {\n    expect(verificarRealizacao(consulta(19, 8), medicoDono, AGORA)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-107\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN28\n   * @objetivo Recusar registro de atendimento antes do horário de início\n   * @resultadoEsperado verificarRealizacao retorna erro de regra para consulta futura\n   */\n  test('recusa registro antes do início', () => {\n    const resultado = verificarRealizacao(consulta(19, 10), medicoDono, AGORA);\n    expect(resultado.mensagem).toBe('O atendimento só pode ser registrado a partir do horário da consulta.');\n  });\n\n  /**\n   * @caso CT-UNI-108\n   * @nivel unitario\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RN28, RN30\n   * @objetivo Impedir a recepção, outro médico ou o paciente de registrarem o atendimento\n   * @resultadoEsperado verificarRealizacao retorna erro de permissão nos três casos\n   */\n  test('só o médico da consulta registra o atendimento', () => {\n    expect(verificarRealizacao(consulta(19, 8), recepcao, AGORA).tipo).toBe('PERMISSAO');\n    expect(verificarRealizacao(consulta(19, 8), outroMedico, AGORA).tipo).toBe('PERMISSAO');\n    expect(verificarRealizacao(consulta(19, 8), pacienteDono, AGORA).tipo).toBe('PERMISSAO');\n  });\n\n  /**\n   * @caso CT-UNI-109\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN28\n   * @objetivo Recusar registro de atendimento em consulta cancelada\n   * @resultadoEsperado verificarRealizacao retorna erro de regra para status CANCELADA\n   */\n  test('recusa atendimento em consulta cancelada', () => {\n    const resultado = verificarRealizacao(consulta(19, 8, 'CANCELADA'), medicoDono, AGORA);\n    expect(resultado.mensagem).toBe('Esta consulta não pode ser marcada como realizada.');\n  });\n});\n\ndescribe('verificarFalta (RN29)', () => {\n  /**\n   * @caso CT-UNI-110\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN29\n   * @objetivo Aceitar registro de falta com exatamente 15 minutos após o início (valor-limite)\n   * @resultadoEsperado verificarFalta retorna null para consulta iniciada às 07:45 registrada às 08:00\n   */\n  test('aceita falta com exatamente 15 minutos de tolerância', () => {\n    const consultaNoLimite = { id: 1, status: 'AGENDADA', inicio: new Date(2026, 9, 19, 7, 45) };\n    expect(verificarFalta(consultaNoLimite, medicoDono, AGORA)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-111\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN29\n   * @objetivo Recusar registro de falta dentro dos 15 minutos de tolerância\n   * @resultadoEsperado verificarFalta retorna erro de regra para consulta iniciada às 07:46\n   */\n  test('recusa falta dentro da tolerância de 15 minutos', () => {\n    const consultaRecente = { id: 1, status: 'AGENDADA', inicio: new Date(2026, 9, 19, 7, 46) };\n    const resultado = verificarFalta(consultaRecente, medicoDono, AGORA);\n    expect(resultado.tipo).toBe('REGRA');\n    expect(resultado.mensagem).toBe('A falta só pode ser registrada 15 minutos após o início da consulta.');\n  });\n\n  /**\n   * @caso CT-UNI-112\n   * @nivel unitario\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RN29, RN30\n   * @objetivo Impedir o paciente e um médico de fora de registrarem falta\n   * @resultadoEsperado verificarFalta retorna erro de permissão para paciente dono e médico não dono\n   */\n  test('só médico da consulta ou recepção registram falta', () => {\n    const consultaPassada = { id: 1, status: 'AGENDADA', inicio: new Date(2026, 9, 19, 7, 0) };\n    expect(verificarFalta(consultaPassada, pacienteDono, AGORA).tipo).toBe('PERMISSAO');\n    expect(verificarFalta(consultaPassada, outroMedico, AGORA).tipo).toBe('PERMISSAO');\n  });\n\n  /**\n   * @caso CT-UNI-113\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN29, RF09.5\n   * @objetivo Permitir que a recepção registre a falta após a tolerância\n   * @resultadoEsperado verificarFalta retorna null para ator RECEPCAO em consulta iniciada às 07:00\n   */\n  test('recepção pode registrar falta após a tolerância', () => {\n    const consultaPassada = { id: 1, status: 'AGENDADA', inicio: new Date(2026, 9, 19, 7, 0) };\n    expect(verificarFalta(consultaPassada, recepcao, AGORA)).toBeNull();\n  });\n});\n"},"backend/__testes__/unitario/agenda-blocos.test.js":{"tests":[{"id":"197","name":"intervalosSobrepoem (RN11) detecta sobreposição parcial","location":{"start":{"column":4,"line":14}}},{"id":"198","name":"intervalosSobrepoem (RN11) permite blocos encostados","location":{"start":{"column":4,"line":27}}},{"id":"199","name":"validarBloco (RN10) aceita bloco válido de segunda-feira","location":{"start":{"column":4,"line":42}}},{"id":"200","name":"validarBloco (RN10) aceita domingo, sábado e os extremos de 07:00 e 20:00","location":{"start":{"column":4,"line":55}}},{"id":"201","name":"validarBloco (RN10) rejeita dia da semana inválido","location":{"start":{"column":4,"line":69}}},{"id":"202","name":"validarBloco (RN10) rejeita horário malformado","location":{"start":{"column":4,"line":84}}},{"id":"203","name":"validarBloco (RN10) rejeita minutos que não são múltiplos de 15","location":{"start":{"column":4,"line":98}}},{"id":"204","name":"validarBloco (RN10) rejeita blocos fora da janela de 07:00 a 20:00","location":{"start":{"column":4,"line":111}}},{"id":"205","name":"validarBloco (RN10) rejeita início igual ou posterior ao fim","location":{"start":{"column":4,"line":126}}},{"id":"206","name":"validarGrade (RN10, RN11) rejeita entrada que não é lista","location":{"start":{"column":4,"line":143}}},{"id":"207","name":"validarGrade (RN10, RN11) aceita grade vazia","location":{"start":{"column":4,"line":157}}},{"id":"208","name":"validarGrade (RN10, RN11) detecta blocos sobrepostos no mesmo dia","location":{"start":{"column":4,"line":170}}},{"id":"209","name":"validarGrade (RN10, RN11) permite blocos encostados e dias diferentes","location":{"start":{"column":4,"line":187}}}],"source":"// Testes unitários das regras puras de grade de disponibilidade (RN10, RN11).\nconst { intervalosSobrepoem, validarBloco, validarGrade } = require('../../src/domain/agenda');\n\ndescribe('intervalosSobrepoem (RN11)', () => {\n  /**\n   * @caso CT-UNI-037\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN11\n   * @objetivo Detectar sobreposição parcial entre dois intervalos\n   * @resultadoEsperado intervalosSobrepoem retorna true para 08:00–12:00 e 11:00–13:00\n   */\n  test('detecta sobreposição parcial', () => {\n    expect(intervalosSobrepoem(480, 720, 660, 780)).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-038\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN11\n   * @objetivo Permitir blocos que apenas se encostam, sem sobrepor (valor-limite)\n   * @resultadoEsperado intervalosSobrepoem retorna false para 08:00–12:00 e 12:00–14:00\n   */\n  test('permite blocos encostados', () => {\n    expect(intervalosSobrepoem(480, 720, 720, 840)).toBe(false);\n  });\n});\n\ndescribe('validarBloco (RN10)', () => {\n  /**\n   * @caso CT-UNI-039\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN10\n   * @objetivo Aceitar um bloco de atendimento válido no meio da semana\n   * @resultadoEsperado validarBloco retorna null para { diaSemana: 1, horaInicio: '08:00', horaFim: '12:00' }\n   */\n  test('aceita bloco válido de segunda-feira', () => {\n    expect(validarBloco({ diaSemana: 1, horaInicio: '08:00', horaFim: '12:00' })).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-040\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN10\n   * @objetivo Aceitar blocos nos extremos do dia da semana e da janela de atendimento\n   * @resultadoEsperado validarBloco retorna null para domingo 07:00–20:00 e sábado 18:00–20:00\n   */\n  test('aceita domingo, sábado e os extremos de 07:00 e 20:00', () => {\n    expect(validarBloco({ diaSemana: 0, horaInicio: '07:00', horaFim: '20:00' })).toBeNull();\n    expect(validarBloco({ diaSemana: 6, horaInicio: '18:00', horaFim: '20:00' })).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-041\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN10\n   * @objetivo Rejeitar dia da semana fora do intervalo de 0 a 6\n   * @resultadoEsperado validarBloco retorna mensagem para dia -1 e dia 7\n   */\n  test('rejeita dia da semana inválido', () => {\n    const mensagem = validarBloco({ diaSemana: 7, horaInicio: '08:00', horaFim: '12:00' });\n    expect(mensagem).toBe('Dia da semana deve ser um inteiro de 0 (domingo) a 6 (sábado).');\n    expect(validarBloco({ diaSemana: -1, horaInicio: '08:00', horaFim: '12:00' })).toBe(mensagem);\n  });\n\n  /**\n   * @caso CT-UNI-042\n   * @nivel unitario\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN10\n   * @objetivo Rejeitar horários fora do formato HH:mm\n   * @resultadoEsperado validarBloco retorna mensagem de formato para '8:00' e '0800'\n   */\n  test('rejeita horário malformado', () => {\n    expect(validarBloco({ diaSemana: 1, horaInicio: '8:00', horaFim: '12:00' })).toBe('Horários devem estar no formato HH:mm.');\n    expect(validarBloco({ diaSemana: 1, horaInicio: '0800', horaFim: '12:00' })).toBe('Horários devem estar no formato HH:mm.');\n  });\n\n  /**\n   * @caso CT-UNI-043\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN10\n   * @objetivo Rejeitar horários que não são múltiplos de 15 minutos\n   * @resultadoEsperado validarBloco retorna mensagem de múltiplos para início 08:10\n   */\n  test('rejeita minutos que não são múltiplos de 15', () => {\n    expect(validarBloco({ diaSemana: 1, horaInicio: '08:10', horaFim: '12:00' })).toBe('Horários devem ser múltiplos de 15 minutos.');\n  });\n\n  /**\n   * @caso CT-UNI-044\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN10\n   * @objetivo Rejeitar blocos que começam antes das 07:00 ou terminam depois das 20:00\n   * @resultadoEsperado validarBloco retorna mensagem de janela para 06:45–12:00 e para 18:00–20:15\n   */\n  test('rejeita blocos fora da janela de 07:00 a 20:00', () => {\n    const mensagem = 'Horários devem estar entre 07:00 e 20:00.';\n    expect(validarBloco({ diaSemana: 1, horaInicio: '06:45', horaFim: '12:00' })).toBe(mensagem);\n    expect(validarBloco({ diaSemana: 1, horaInicio: '18:00', horaFim: '20:15' })).toBe(mensagem);\n  });\n\n  /**\n   * @caso CT-UNI-045\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN10\n   * @objetivo Rejeitar bloco cujo início não é anterior ao fim\n   * @resultadoEsperado validarBloco retorna mensagem de ordem para 12:00–12:00 e 12:00–08:00\n   */\n  test('rejeita início igual ou posterior ao fim', () => {\n    const mensagem = 'Hora de início deve ser anterior à hora de fim.';\n    expect(validarBloco({ diaSemana: 1, horaInicio: '12:00', horaFim: '12:00' })).toBe(mensagem);\n    expect(validarBloco({ diaSemana: 1, horaInicio: '12:00', horaFim: '08:00' })).toBe(mensagem);\n  });\n});\n\ndescribe('validarGrade (RN10, RN11)', () => {\n  /**\n   * @caso CT-UNI-046\n   * @nivel unitario\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN10\n   * @objetivo Rejeitar entrada que não é uma lista de blocos\n   * @resultadoEsperado validarGrade retorna mensagem para null e para uma string\n   */\n  test('rejeita entrada que não é lista', () => {\n    expect(validarGrade(null)).toBe('A grade deve ser uma lista de blocos.');\n    expect(validarGrade('segunda 08:00')).toBe('A grade deve ser uma lista de blocos.');\n  });\n\n  /**\n   * @caso CT-UNI-047\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN10, RF05.2\n   * @objetivo Aceitar grade vazia (médico pode limpar a própria grade)\n   * @resultadoEsperado validarGrade retorna null para []\n   */\n  test('aceita grade vazia', () => {\n    expect(validarGrade([])).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-048\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN11\n   * @objetivo Detectar sobreposição entre dois blocos do mesmo dia\n   * @resultadoEsperado validarGrade retorna mensagem citando o dia e os horários sobrepostos\n   */\n  test('detecta blocos sobrepostos no mesmo dia', () => {\n    const mensagem = validarGrade([\n      { diaSemana: 1, horaInicio: '08:00', horaFim: '12:00' },\n      { diaSemana: 1, horaInicio: '11:00', horaFim: '14:00' },\n    ]);\n    expect(mensagem).toBe('Blocos sobrepostos no dia 1: 08:00–12:00 e 11:00–14:00.');\n  });\n\n  /**\n   * @caso CT-UNI-049\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN11\n   * @objetivo Permitir blocos encostados no mesmo dia e blocos iguais em dias diferentes\n   * @resultadoEsperado validarGrade retorna null nos dois cenários\n   */\n  test('permite blocos encostados e dias diferentes', () => {\n    expect(validarGrade([\n      { diaSemana: 1, horaInicio: '08:00', horaFim: '12:00' },\n      { diaSemana: 1, horaInicio: '12:00', horaFim: '14:00' },\n    ])).toBeNull();\n    expect(validarGrade([\n      { diaSemana: 1, horaInicio: '08:00', horaFim: '12:00' },\n      { diaSemana: 3, horaInicio: '08:00', horaFim: '12:00' },\n    ])).toBeNull();\n  });\n});\n"},"backend/__testes__/unitario/validacoes-cpf-crm.test.js":{"tests":[{"id":"210","name":"CPF (RN03) normaliza o CPF para apenas dígitos","location":{"start":{"column":4,"line":14}}},{"id":"211","name":"CPF (RN03) aceita CPF válido com pontuação","location":{"start":{"column":4,"line":27}}},{"id":"212","name":"CPF (RN03) aceita CPF válido sem pontuação","location":{"start":{"column":4,"line":40}}},{"id":"213","name":"CPF (RN03) rejeita CPF com dígito verificador incorreto","location":{"start":{"column":4,"line":53}}},{"id":"214","name":"CPF (RN03) rejeita CPF com todos os dígitos iguais","location":{"start":{"column":4,"line":66}}},{"id":"215","name":"CPF (RN03) rejeita CPF com 10 ou 12 dígitos","location":{"start":{"column":4,"line":79}}},{"id":"216","name":"CPF (RN03) rejeita CPF vazio e nulo","location":{"start":{"column":4,"line":93}}},{"id":"217","name":"CRM (RN07) aceita CRM com 4 dígitos e UF válida","location":{"start":{"column":4,"line":109}}},{"id":"218","name":"CRM (RN07) aceita CRM com 6 dígitos e UF válida","location":{"start":{"column":4,"line":122}}},{"id":"219","name":"CRM (RN07) rejeita CRM com 3 ou 7 dígitos","location":{"start":{"column":4,"line":135}}},{"id":"220","name":"CRM (RN07) rejeita CRM com UF inexistente","location":{"start":{"column":4,"line":149}}},{"id":"221","name":"CRM (RN07) rejeita CRM sem barra ou em minúsculas","location":{"start":{"column":4,"line":162}}},{"id":"222","name":"duração da consulta (RN08) aceita 15, 30, 45 e 60 minutos","location":{"start":{"column":4,"line":178}}},{"id":"223","name":"duração da consulta (RN08) rejeita durações abaixo de 15 ou acima de 60 minutos","location":{"start":{"column":4,"line":194}}},{"id":"224","name":"duração da consulta (RN08) rejeita duração que não é múltiplo de 15","location":{"start":{"column":4,"line":208}}},{"id":"225","name":"duração da consulta (RN08) rejeita duração nula, zero e fracionária","location":{"start":{"column":4,"line":222}}}],"source":"// Testes unitários das validações de CPF, CRM e duração de consulta (RN03, RN07, RN08).\nconst { normalizarCpf, cpfValido, crmValido, duracaoConsultaValida } = require('../../src/domain/validacoes');\n\ndescribe('CPF (RN03)', () => {\n  /**\n   * @caso CT-UNI-012\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN03\n   * @objetivo Normalizar o CPF removendo pontuação e deixando apenas dígitos\n   * @resultadoEsperado normalizarCpf('529.982.247-25') retorna '52998224725'\n   */\n  test('normaliza o CPF para apenas dígitos', () => {\n    expect(normalizarCpf('529.982.247-25')).toBe('52998224725');\n  });\n\n  /**\n   * @caso CT-UNI-013\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN03\n   * @objetivo Aceitar CPF válido enviado com pontuação\n   * @resultadoEsperado cpfValido retorna true para '529.982.247-25'\n   */\n  test('aceita CPF válido com pontuação', () => {\n    expect(cpfValido('529.982.247-25')).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-014\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN03\n   * @objetivo Aceitar CPF válido enviado sem pontuação\n   * @resultadoEsperado cpfValido retorna true para '11144477735'\n   */\n  test('aceita CPF válido sem pontuação', () => {\n    expect(cpfValido('11144477735')).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-015\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN03\n   * @objetivo Rejeitar CPF com dígito verificador incorreto\n   * @resultadoEsperado cpfValido retorna false para '529.982.247-24' (último dígito alterado)\n   */\n  test('rejeita CPF com dígito verificador incorreto', () => {\n    expect(cpfValido('529.982.247-24')).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-016\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN03\n   * @objetivo Rejeitar CPF com todos os dígitos iguais, mesmo que passe na fórmula\n   * @resultadoEsperado cpfValido retorna false para '111.111.111-11'\n   */\n  test('rejeita CPF com todos os dígitos iguais', () => {\n    expect(cpfValido('111.111.111-11')).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-017\n   * @nivel unitario\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN03\n   * @objetivo Rejeitar CPF com quantidade de dígitos diferente de 11\n   * @resultadoEsperado cpfValido retorna false para CPF com 10 e com 12 dígitos\n   */\n  test('rejeita CPF com 10 ou 12 dígitos', () => {\n    expect(cpfValido('5299822472')).toBe(false);\n    expect(cpfValido('529982247256')).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-018\n   * @nivel unitario\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN03\n   * @objetivo Tratar sem erro CPF vazio ou nulo\n   * @resultadoEsperado cpfValido retorna false para '' e null sem lançar exceção\n   */\n  test('rejeita CPF vazio e nulo', () => {\n    expect(cpfValido('')).toBe(false);\n    expect(cpfValido(null)).toBe(false);\n  });\n});\n\ndescribe('CRM (RN07)', () => {\n  /**\n   * @caso CT-UNI-019\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN07\n   * @objetivo Aceitar CRM na forma mínima de 4 dígitos com UF válida (valor-limite inferior)\n   * @resultadoEsperado crmValido retorna true para '9876/PR'\n   */\n  test('aceita CRM com 4 dígitos e UF válida', () => {\n    expect(crmValido('9876/PR')).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-020\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN07\n   * @objetivo Aceitar CRM na forma máxima de 6 dígitos com UF válida (valor-limite superior)\n   * @resultadoEsperado crmValido retorna true para '123456/SP'\n   */\n  test('aceita CRM com 6 dígitos e UF válida', () => {\n    expect(crmValido('123456/SP')).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-021\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN07\n   * @objetivo Rejeitar CRM com 3 ou com 7 dígitos, fora do intervalo permitido\n   * @resultadoEsperado crmValido retorna false para '123/SP' e '1234567/SP'\n   */\n  test('rejeita CRM com 3 ou 7 dígitos', () => {\n    expect(crmValido('123/SP')).toBe(false);\n    expect(crmValido('1234567/SP')).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-022\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN07\n   * @objetivo Rejeitar CRM com sigla de UF inexistente\n   * @resultadoEsperado crmValido retorna false para '1234/XX'\n   */\n  test('rejeita CRM com UF inexistente', () => {\n    expect(crmValido('1234/XX')).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-023\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN07\n   * @objetivo Rejeitar CRM sem barra ou escrito em minúsculas\n   * @resultadoEsperado crmValido retorna false para '1234SP' e '1234/sp'\n   */\n  test('rejeita CRM sem barra ou em minúsculas', () => {\n    expect(crmValido('1234SP')).toBe(false);\n    expect(crmValido('1234/sp')).toBe(false);\n  });\n});\n\ndescribe('duração da consulta (RN08)', () => {\n  /**\n   * @caso CT-UNI-024\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN08\n   * @objetivo Aceitar as quatro durações válidas em múltiplos de 15 minutos\n   * @resultadoEsperado duracaoConsultaValida retorna true para 15, 30, 45 e 60\n   */\n  test('aceita 15, 30, 45 e 60 minutos', () => {\n    expect(duracaoConsultaValida(15)).toBe(true);\n    expect(duracaoConsultaValida(30)).toBe(true);\n    expect(duracaoConsultaValida(45)).toBe(true);\n    expect(duracaoConsultaValida(60)).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-025\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN08\n   * @objetivo Rejeitar durações fora dos limites de 15 e 60 minutos (valor-limite)\n   * @resultadoEsperado duracaoConsultaValida retorna false para 10 e 75\n   */\n  test('rejeita durações abaixo de 15 ou acima de 60 minutos', () => {\n    expect(duracaoConsultaValida(10)).toBe(false);\n    expect(duracaoConsultaValida(75)).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-026\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN08\n   * @objetivo Rejeitar duração que não é múltiplo de 15 minutos\n   * @resultadoEsperado duracaoConsultaValida retorna false para 20 e 50\n   */\n  test('rejeita duração que não é múltiplo de 15', () => {\n    expect(duracaoConsultaValida(20)).toBe(false);\n    expect(duracaoConsultaValida(50)).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-027\n   * @nivel unitario\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN08\n   * @objetivo Rejeitar duração nula, zero ou fracionária\n   * @resultadoEsperado duracaoConsultaValida retorna false para null, 0 e 30.5\n   */\n  test('rejeita duração nula, zero e fracionária', () => {\n    expect(duracaoConsultaValida(null)).toBe(false);\n    expect(duracaoConsultaValida(0)).toBe(false);\n    expect(duracaoConsultaValida(30.5)).toBe(false);\n  });\n});\n"},"backend/__testes__/unitario/consultas-valor.test.js":{"tests":[{"id":"226","name":"calcularValor (RN22, RN23, RN24) cobra preço base para adulto","location":{"start":{"column":4,"line":14}}},{"id":"227","name":"calcularValor (RN22, RN23, RN24) aplica 10% de desconto para idoso","location":{"start":{"column":4,"line":27}}},{"id":"228","name":"calcularValor (RN22, RN23, RN24) aplica desconto a partir de exatamente 60 anos","location":{"start":{"column":4,"line":40}}},{"id":"229","name":"calcularValor (RN22, RN23, RN24) não aplica desconto com 59 anos","location":{"start":{"column":4,"line":53}}},{"id":"230","name":"calcularValor (RN22, RN23, RN24) arredonda o desconto para o centavo mais próximo","location":{"start":{"column":4,"line":66}}},{"id":"231","name":"calcularValor (RN22, RN23, RN24) retorno gratuito custa zero","location":{"start":{"column":4,"line":80}}},{"id":"232","name":"calcularValor (RN22, RN23, RN24) retorno prevalece sobre o desconto de idade","location":{"start":{"column":4,"line":93}}},{"id":"233","name":"encontrarConsultaDeRetorno (RN24) escolhe a consulta realizada mais recente","location":{"start":{"column":4,"line":111}}},{"id":"234","name":"encontrarConsultaDeRetorno (RN24) aceita realizada com exatamente 30 dias","location":{"start":{"column":9,"line":125}}},{"id":"235","name":"encontrarConsultaDeRetorno (RN24) recusa realizada fora da janela de 30 dias","location":{"start":{"column":4,"line":139}}},{"id":"236","name":"encontrarConsultaDeRetorno (RN24) recusa consulta realizada já usada como retorno","location":{"start":{"column":4,"line":153}}},{"id":"237","name":"encontrarConsultaDeRetorno (RN24) ignora consultas que não são anteriores ao novo horário","location":{"start":{"column":4,"line":167}}}],"source":"// Testes unitários do cálculo de valor da consulta e do direito a retorno (RN22, RN23, RN24).\nconst { calcularValor, encontrarConsultaDeRetorno } = require('../../src/domain/consultas');\n\ndescribe('calcularValor (RN22, RN23, RN24)', () => {\n  /**\n   * @caso CT-UNI-074\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN22\n   * @objetivo Cobrar o preço base integral para paciente adulto sem direito a retorno\n   * @resultadoEsperado calcularValor retorna 15000 centavos para adulto de 36 anos\n   */\n  test('cobra preço base para adulto', () => {\n    expect(calcularValor({ precoBaseCentavos: 15000, idadePaciente: 36, ehRetorno: false })).toBe(15000);\n  });\n\n  /**\n   * @caso CT-UNI-075\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN23\n   * @objetivo Aplicar 10% de desconto para paciente com 68 anos na data da consulta\n   * @resultadoEsperado calcularValor retorna 13500 centavos (10% de desconto sobre 15000)\n   */\n  test('aplica 10% de desconto para idoso', () => {\n    expect(calcularValor({ precoBaseCentavos: 15000, idadePaciente: 68, ehRetorno: false })).toBe(13500);\n  });\n\n  /**\n   * @caso CT-UNI-076\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN23\n   * @objetivo Aplicar desconto no aniversário em que o paciente completa 60 anos (valor-limite)\n   * @resultadoEsperado calcularValor retorna valor com desconto para idade 60\n   */\n  test('aplica desconto a partir de exatamente 60 anos', () => {\n    expect(calcularValor({ precoBaseCentavos: 30000, idadePaciente: 60, ehRetorno: false })).toBe(27000);\n  });\n\n  /**\n   * @caso CT-UNI-077\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN23\n   * @objetivo Não aplicar desconto para paciente de 59 anos (valor-limite)\n   * @resultadoEsperado calcularValor retorna o preço integral para idade 59\n   */\n  test('não aplica desconto com 59 anos', () => {\n    expect(calcularValor({ precoBaseCentavos: 30000, idadePaciente: 59, ehRetorno: false })).toBe(30000);\n  });\n\n  /**\n   * @caso CT-UNI-078\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN23\n   * @objetivo Arredondar o desconto para o centavo mais próximo\n   * @resultadoEsperado calcularValor retorna 8999 para preço 9999 (8999,1 arredonda para baixo) e 13951 para 15501 (13950,9 arredonda para cima)\n   */\n  test('arredonda o desconto para o centavo mais próximo', () => {\n    expect(calcularValor({ precoBaseCentavos: 9999, idadePaciente: 70, ehRetorno: false })).toBe(8999);\n    expect(calcularValor({ precoBaseCentavos: 15501, idadePaciente: 70, ehRetorno: false })).toBe(13951);\n  });\n\n  /**\n   * @caso CT-UNI-079\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN24\n   * @objetivo Zerar o valor quando a consulta é retorno gratuito\n   * @resultadoEsperado calcularValor retorna 0 quando ehRetorno é true\n   */\n  test('retorno gratuito custa zero', () => {\n    expect(calcularValor({ precoBaseCentavos: 15000, idadePaciente: 36, ehRetorno: true })).toBe(0);\n  });\n\n  /**\n   * @caso CT-UNI-080\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN24, RN23\n   * @objetivo Fazer o retorno prevalecer sobre o desconto de idade, sem somar os dois\n   * @resultadoEsperado calcularValor retorna 0 para idoso com direito a retorno (e não valor negativo ou desconto duplo)\n   */\n  test('retorno prevalece sobre o desconto de idade', () => {\n    expect(calcularValor({ precoBaseCentavos: 15000, idadePaciente: 68, ehRetorno: true })).toBe(0);\n  });\n});\n\ndescribe('encontrarConsultaDeRetorno (RN24)', () => {\n  const NOVO_INICIO = new Date(2026, 9, 19, 10, 0); // 2026-10-19 10:00\n  const realizada = (id, dia, mes) => ({ id, inicio: new Date(2026, mes - 1, dia, 9, 0) });\n\n  /**\n   * @caso CT-UNI-081\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN24\n   * @objetivo Encontrar a consulta realizada mais recente dentro da janela de 30 dias\n   * @resultadoEsperado encontrarConsultaDeRetorno retorna o id 5 (realizada há 9 dias) entre duas candidatas\n   */\n  test('escolhe a consulta realizada mais recente', () => {\n    const realizadas = [realizada(3, 25, 9), realizada(5, 10, 10)];\n    expect(encontrarConsultaDeRetorno(realizadas, [], NOVO_INICIO)).toBe(5);\n  });\n\n  /**\n   * @caso CT-UNI-082\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN24\n   * @objetivo Incluir consulta realizada com exatamente 30 dias (valor-limite da janela)\n   * @resultadoEsperado encontrarConsultaDeRetorno retorna o id da consulta realizada em 2026-09-19\n   */\n  test.skip('aceita realizada com exatamente 30 dias', () => {\n    const realizadas = [realizada(7, 19, 9)];\n    expect(encontrarConsultaDeRetorno(realizadas, [], NOVO_INICIO)).toBe(7);\n  });\n\n  /**\n   * @caso CT-UNI-083\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN24\n   * @objetivo Excluir consulta realizada há mais de 30 dias do novo horário\n   * @resultadoEsperado encontrarConsultaDeRetorno retorna null para realizada em 2026-09-18 (31 dias)\n   */\n  test('recusa realizada fora da janela de 30 dias', () => {\n    const realizadas = [realizada(7, 18, 9)];\n    expect(encontrarConsultaDeRetorno(realizadas, [], NOVO_INICIO)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-084\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN24\n   * @objetivo Não conceder novo retorno com uma consulta realizada que já foi usada\n   * @resultadoEsperado encontrarConsultaDeRetorno retorna null quando o id já está em idsJaUsados\n   */\n  test('recusa consulta realizada já usada como retorno', () => {\n    const realizadas = [realizada(5, 10, 10)];\n    expect(encontrarConsultaDeRetorno(realizadas, [5], NOVO_INICIO)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-085\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN24\n   * @objetivo Não considerar consulta com início no futuro ou no próprio instante do novo horário\n   * @resultadoEsperado encontrarConsultaDeRetorno retorna null quando a realizada começa junto ou depois do novo início\n   */\n  test('ignora consultas que não são anteriores ao novo horário', () => {\n    const realizadas = [\n      { id: 9, inicio: new Date(2026, 9, 19, 10, 0) }, // mesma hora do novo início\n      { id: 10, inicio: new Date(2026, 9, 25, 9, 0) }, // futura\n    ];\n    expect(encontrarConsultaDeRetorno(realizadas, [], NOVO_INICIO)).toBeNull();\n  });\n});\n"},"backend/__testes__/unitario/validacoes-email-senha.test.js":{"tests":[{"id":"238","name":"emailValido (RN01) aceita e-mail simples válido","location":{"start":{"column":4,"line":14}}},{"id":"239","name":"emailValido (RN01) aceita e-mail com subdomínios","location":{"start":{"column":4,"line":27}}},{"id":"240","name":"emailValido (RN01) rejeita e-mail sem @","location":{"start":{"column":4,"line":40}}},{"id":"241","name":"emailValido (RN01) rejeita e-mail sem ponto no domínio","location":{"start":{"column":4,"line":53}}},{"id":"242","name":"emailValido (RN01) rejeita e-mail com espaço interno","location":{"start":{"column":4,"line":66}}},{"id":"243","name":"emailValido (RN01) rejeita entradas vazias, nulas e não textuais","location":{"start":{"column":4,"line":79}}},{"id":"244","name":"senhaValida (RN02) aceita senha de exatamente 8 caracteres com letra e número","location":{"start":{"column":4,"line":97}}},{"id":"245","name":"senhaValida (RN02) rejeita senha com 7 caracteres","location":{"start":{"column":4,"line":110}}},{"id":"246","name":"senhaValida (RN02) rejeita senha sem número","location":{"start":{"column":4,"line":123}}},{"id":"247","name":"senhaValida (RN02) rejeita senha sem letra","location":{"start":{"column":4,"line":136}}},{"id":"248","name":"senhaValida (RN02) rejeita senha nula, vazia e não textual","location":{"start":{"column":4,"line":149}}}],"source":"// Testes unitários das validações de e-mail e senha (RN01, RN02) — regras puras, sem banco nem HTTP.\nconst { emailValido, senhaValida } = require('../../src/domain/validacoes');\n\ndescribe('emailValido (RN01)', () => {\n  /**\n   * @caso CT-UNI-001\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN01\n   * @objetivo Aceitar um e-mail simples com formato válido\n   * @resultadoEsperado emailValido retorna true para 'ana.pereira@email.com'\n   */\n  test('aceita e-mail simples válido', () => {\n    expect(emailValido('ana.pereira@email.com')).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-002\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN01\n   * @objetivo Aceitar e-mail com vários pontos e subdomínios\n   * @resultadoEsperado emailValido retorna true para 'joao.santos@mail.sub.dominio.com.br'\n   */\n  test('aceita e-mail com subdomínios', () => {\n    expect(emailValido('joao.santos@mail.sub.dominio.com.br')).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-003\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN01\n   * @objetivo Rejeitar e-mail sem o símbolo @\n   * @resultadoEsperado emailValido retorna false para 'ana.email.com'\n   */\n  test('rejeita e-mail sem @', () => {\n    expect(emailValido('ana.email.com')).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-004\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN01\n   * @objetivo Rejeitar e-mail sem ponto no domínio depois do @\n   * @resultadoEsperado emailValido retorna false para 'ana@clinica'\n   */\n  test('rejeita e-mail sem ponto no domínio', () => {\n    expect(emailValido('ana@clinica')).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-005\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN01\n   * @objetivo Rejeitar e-mail com espaço em branco interno\n   * @resultadoEsperado emailValido retorna false para 'ana pereira@email.com'\n   */\n  test('rejeita e-mail com espaço interno', () => {\n    expect(emailValido('ana pereira@email.com')).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-006\n   * @nivel unitario\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN01, RNF04\n   * @objetivo Tratar sem erro entradas não textuais e vazias no e-mail\n   * @resultadoEsperado emailValido retorna false (e nunca lança exceção) para '', null, undefined e 42\n   */\n  test('rejeita entradas vazias, nulas e não textuais', () => {\n    expect(emailValido('')).toBe(false);\n    expect(emailValido(null)).toBe(false);\n    expect(emailValido(undefined)).toBe(false);\n    expect(emailValido(42)).toBe(false);\n  });\n});\n\ndescribe('senhaValida (RN02)', () => {\n  /**\n   * @caso CT-UNI-007\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN02\n   * @objetivo Aceitar senha com exatamente 8 caracteres contendo letras e números (valor-limite)\n   * @resultadoEsperado senhaValida retorna true para 'Senha123'\n   */\n  test('aceita senha de exatamente 8 caracteres com letra e número', () => {\n    expect(senhaValida('Senha123')).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-008\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN02\n   * @objetivo Rejeitar senha com 7 caracteres, um a menos que o mínimo (valor-limite)\n   * @resultadoEsperado senhaValida retorna false para 'Senha1' + um caractere a menos ('Senha1' tem 6; 'Senha12' tem 7)\n   */\n  test('rejeita senha com 7 caracteres', () => {\n    expect(senhaValida('Senha12')).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-009\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN02\n   * @objetivo Rejeitar senha longa sem nenhum número\n   * @resultadoEsperado senhaValida retorna false para 'senhasemnumero'\n   */\n  test('rejeita senha sem número', () => {\n    expect(senhaValida('senhasemnumero')).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-010\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN02\n   * @objetivo Rejeitar senha longa sem nenhuma letra\n   * @resultadoEsperado senhaValida retorna false para '123456789'\n   */\n  test('rejeita senha sem letra', () => {\n    expect(senhaValida('123456789')).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-011\n   * @nivel unitario\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN02\n   * @objetivo Tratar sem erro senha nula, vazia ou não textual\n   * @resultadoEsperado senhaValida retorna false para null, '' e 12345678 sem lançar exceção\n   */\n  test('rejeita senha nula, vazia e não textual', () => {\n    expect(senhaValida(null)).toBe(false);\n    expect(senhaValida('')).toBe(false);\n    expect(senhaValida(12345678)).toBe(false);\n  });\n});\n"},"backend/__testes__/unitario/validacoes-nascimento.test.js":{"tests":[{"id":"249","name":"calcularIdade (RN05, RN06) calcula idade quando o aniversário já passou","location":{"start":{"column":4,"line":16}}},{"id":"250","name":"calcularIdade (RN05, RN06) calcula idade quando o aniversário ainda não chegou","location":{"start":{"column":4,"line":29}}},{"id":"251","name":"calcularIdade (RN05, RN06) exige responsável para 17 anos","location":{"start":{"column":4,"line":42}}},{"id":"252","name":"calcularIdade (RN05, RN06) não exige responsável no aniversário de 18 anos","location":{"start":{"column":4,"line":55}}},{"id":"253","name":"validarDataNascimento (RN05) aceita data de nascimento passada e plausível","location":{"start":{"column":4,"line":70}}},{"id":"254","name":"validarDataNascimento (RN05) rejeita data de nascimento futura","location":{"start":{"column":4,"line":83}}},{"id":"255","name":"validarDataNascimento (RN05) rejeita idade acima de 130 anos","location":{"start":{"column":4,"line":97}}},{"id":"256","name":"validarDataNascimento (RN05) aceita idade de exatamente 130 anos","location":{"start":{"column":4,"line":111}}},{"id":"257","name":"validarDataNascimento (RN05) rejeita datas malformadas e inexistentes","location":{"start":{"column":4,"line":124}}}],"source":"// Testes unitários das validações de data de nascimento e responsável (RN05, RN06).\nconst { calcularIdade, validarDataNascimento, exigeResponsavel } = require('../../src/domain/validacoes');\n\nconst HOJE = new Date(2026, 9, 19); // 2026-10-19, relógio fixo de referência\n\ndescribe('calcularIdade (RN05, RN06)', () => {\n  /**\n   * @caso CT-UNI-028\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN05\n   * @objetivo Calcular a idade quando o aniversário do ano já passou\n   * @resultadoEsperado calcularIdade retorna 36 para nascimento em 1990-05-14 com referência em 2026-10-19\n   */\n  test('calcula idade quando o aniversário já passou', () => {\n    expect(calcularIdade(new Date(1990, 4, 14), HOJE)).toBe(36);\n  });\n\n  /**\n   * @caso CT-UNI-029\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN05\n   * @objetivo Calcular a idade quando o aniversário do ano ainda não chegou\n   * @resultadoEsperado calcularIdade retorna 35 para nascimento em 1990-12-01 com referência em 2026-10-19\n   */\n  test('calcula idade quando o aniversário ainda não chegou', () => {\n    expect(calcularIdade(new Date(1990, 11, 1), HOJE)).toBe(35);\n  });\n\n  /**\n   * @caso CT-UNI-030\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN06\n   * @objetivo Exigir responsável para paciente com 17 anos (valor-limite inferior da maioridade)\n   * @resultadoEsperado exigeResponsavel retorna true para nascimento em 2009-01-10\n   */\n  test('exige responsável para 17 anos', () => {\n    expect(exigeResponsavel(new Date(2009, 0, 10), HOJE)).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-031\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN06\n   * @objetivo Não exigir responsável no dia em que o paciente completa 18 anos (valor-limite)\n   * @resultadoEsperado exigeResponsavel retorna false para nascimento em 2008-10-19\n   */\n  test('não exige responsável no aniversário de 18 anos', () => {\n    expect(exigeResponsavel(new Date(2008, 9, 19), HOJE)).toBe(false);\n  });\n});\n\ndescribe('validarDataNascimento (RN05)', () => {\n  /**\n   * @caso CT-UNI-032\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN05\n   * @objetivo Aceitar data de nascimento passada e plausível\n   * @resultadoEsperado validarDataNascimento retorna null para '1990-05-14'\n   */\n  test('aceita data de nascimento passada e plausível', () => {\n    expect(validarDataNascimento('1990-05-14', HOJE)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-033\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN05\n   * @objetivo Rejeitar data de nascimento futura\n   * @resultadoEsperado validarDataNascimento retorna mensagem sobre data futura para '2027-01-10'\n   */\n  test('rejeita data de nascimento futura', () => {\n    const mensagem = validarDataNascimento('2027-01-10', HOJE);\n    expect(mensagem).toBe('Data de nascimento não pode ser futura.');\n  });\n\n  /**\n   * @caso CT-UNI-034\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN05\n   * @objetivo Rejeitar nascimento que indicaria idade acima de 130 anos\n   * @resultadoEsperado validarDataNascimento retorna mensagem de idade máxima para '1895-01-01' (131 anos)\n   */\n  test('rejeita idade acima de 130 anos', () => {\n    const mensagem = validarDataNascimento('1895-01-01', HOJE);\n    expect(mensagem).toBe('Idade não pode ser superior a 130 anos.');\n  });\n\n  /**\n   * @caso CT-UNI-035\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN05\n   * @objetivo Aceitar nascimento com exatamente 130 anos (valor-limite)\n   * @resultadoEsperado validarDataNascimento retorna null para '1896-01-01' (130 anos em 2026)\n   */\n  test('aceita idade de exatamente 130 anos', () => {\n    expect(validarDataNascimento('1896-01-01', HOJE)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-036\n   * @nivel unitario\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN05\n   * @objetivo Rejeitar texto que não é uma data válida, incluindo 30 de fevereiro\n   * @resultadoEsperado validarDataNascimento retorna mensagem orientando o formato para '31/02/2026' e '2026-02-30'\n   */\n  test('rejeita datas malformadas e inexistentes', () => {\n    expect(validarDataNascimento('31/02/2026', HOJE)).toBe('Data de nascimento inválida. Use o formato AAAA-MM-DD.');\n    expect(validarDataNascimento('2026-02-30', HOJE)).toBe('Data de nascimento inválida. Use o formato AAAA-MM-DD.');\n  });\n});\n"},"backend/__testes__/unitario/datas-utils.test.js":{"tests":[{"id":"258","name":"utilitários de datas (RNF07) parseData valida datas reais no formato AAAA-MM-DD","location":{"start":{"column":4,"line":17}}},{"id":"259","name":"utilitários de datas (RNF07) parseDataHora aceita os dois separadores e recusa horas inválidas","location":{"start":{"column":4,"line":32}}},{"id":"260","name":"utilitários de datas (RNF07) formata com zeros à esquerda","location":{"start":{"column":4,"line":49}}},{"id":"261","name":"utilitários de datas (RNF07) horaParaMinutos e minutosParaHora são simétricos","location":{"start":{"column":4,"line":63}}},{"id":"262","name":"utilitários de datas (RNF07) horaParaMinutos recusa texto inválido","location":{"start":{"column":4,"line":78}}},{"id":"263","name":"utilitários de datas (RNF07) somarDias atravessa o fim do mês","location":{"start":{"column":4,"line":93}}},{"id":"264","name":"utilitários de datas (RNF07) somarMinutos e minutosEntre calculam em minutos","location":{"start":{"column":4,"line":106}}},{"id":"265","name":"utilitários de datas (RNF07) inicioDoDia zera horas e minutos","location":{"start":{"column":4,"line":121}}}],"source":"// Testes unitários das funções puras de data/hora — base das regras de agenda (RNF07).\nconst {\n  parseData, parseDataHora, formatarData, formatarDataHora,\n  horaParaMinutos, minutosParaHora, somarMinutos, somarDias, minutosEntre, inicioDoDia,\n} = require('../../src/utils/datas');\n\ndescribe('utilitários de datas (RNF07)', () => {\n  /**\n   * @caso CT-UNI-114\n   * @nivel unitario\n   * @atributo manutenibilidade\n   * @subatributo testabilidade\n   * @requisito RNF07\n   * @objetivo Converter texto AAAA-MM-DD em Date local e recusar datas inexistentes\n   * @resultadoEsperado parseData retorna Date local para '2026-10-19' e null para '2026-02-30' e '19/10/2026'\n   */\n  test('parseData valida datas reais no formato AAAA-MM-DD', () => {\n    expect(parseData('2026-10-19')).toEqual(new Date(2026, 9, 19));\n    expect(parseData('2026-02-30')).toBeNull();\n    expect(parseData('19/10/2026')).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-115\n   * @nivel unitario\n   * @atributo manutenibilidade\n   * @subatributo testabilidade\n   * @requisito RNF07\n   * @objetivo Aceitar data e hora com espaço ou com 'T' e recusar horas inválidas\n   * @resultadoEsperado parseDataHora aceita '2026-10-19 08:30' e '2026-10-19T08:30'; retorna null para '2026-10-19 24:00' e '2026-10-19 08:60'\n   */\n  test('parseDataHora aceita os dois separadores e recusa horas inválidas', () => {\n    const esperado = new Date(2026, 9, 19, 8, 30);\n    expect(parseDataHora('2026-10-19 08:30')).toEqual(esperado);\n    expect(parseDataHora('2026-10-19T08:30')).toEqual(esperado);\n    expect(parseDataHora('2026-10-19 24:00')).toBeNull();\n    expect(parseDataHora('2026-10-19 08:60')).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-116\n   * @nivel unitario\n   * @atributo compatibilidade\n   * @subatributo interoperabilidade\n   * @requisito RNF07\n   * @objetivo Formatar datas e data-hora no padrão da clínica com zeros à esquerda\n   * @resultadoEsperado formatarDataHora retorna '2026-10-19 08:05' e formatarData '2026-10-19'\n   */\n  test('formata com zeros à esquerda', () => {\n    expect(formatarDataHora(new Date(2026, 9, 19, 8, 5))).toBe('2026-10-19 08:05');\n    expect(formatarData(new Date(2026, 9, 19, 8, 5))).toBe('2026-10-19');\n  });\n\n  /**\n   * @caso CT-UNI-117\n   * @nivel unitario\n   * @atributo manutenibilidade\n   * @subatributo modularidade\n   * @requisito RNF07, RN14\n   * @objetivo Converter horas em minutos e voltar, base da geração de slots\n   * @resultadoEsperado horaParaMinutos('08:30') é 510 e minutosParaHora(510) é '08:30'\n   */\n  test('horaParaMinutos e minutosParaHora são simétricos', () => {\n    expect(horaParaMinutos('08:30')).toBe(510);\n    expect(minutosParaHora(510)).toBe('08:30');\n    expect(horaParaMinutos('07:00')).toBe(420);\n  });\n\n  /**\n   * @caso CT-UNI-118\n   * @nivel unitario\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RNF07\n   * @objetivo Retornar null para hora malformada em vez de lançar erro\n   * @resultadoEsperado horaParaMinutos retorna null para '8h30', '' e null\n   */\n  test('horaParaMinutos recusa texto inválido', () => {\n    expect(horaParaMinutos('8h30')).toBeNull();\n    expect(horaParaMinutos('')).toBeNull();\n    expect(horaParaMinutos(null)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-119\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RNF07, RN16\n   * @objetivo Somar dias atravessando o fim do mês corretamente\n   * @resultadoEsperado somarDias de 2026-10-31 mais 1 dia é 2026-11-01\n   */\n  test('somarDias atravessa o fim do mês', () => {\n    expect(somarDias(new Date(2026, 9, 31), 1)).toEqual(new Date(2026, 10, 1));\n  });\n\n  /**\n   * @caso CT-UNI-120\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RNF07, RN29\n   * @objetivo Somar minutos para a tolerância de falta e medir intervalos em minutos\n   * @resultadoEsperado somarMinutos avança 15 minutos e minutosEntre retorna 150 para 08:00 até 10:30\n   */\n  test('somarMinutos e minutosEntre calculam em minutos', () => {\n    const inicio = new Date(2026, 9, 19, 8, 0);\n    expect(somarMinutos(inicio, 15)).toEqual(new Date(2026, 9, 19, 8, 15));\n    expect(minutosEntre(inicio, new Date(2026, 9, 19, 10, 30))).toBe(150);\n  });\n\n  /**\n   * @caso CT-UNI-121\n   * @nivel unitario\n   * @atributo manutenibilidade\n   * @subatributo testabilidade\n   * @requisito RNF07\n   * @objetivo Zerar o horário ao obter o início do dia\n   * @resultadoEsperado inicioDoDia retorna 2026-10-19 00:00 para 2026-10-19 08:37\n   */\n  test('inicioDoDia zera horas e minutos', () => {\n    expect(inicioDoDia(new Date(2026, 9, 19, 8, 37))).toEqual(new Date(2026, 9, 19, 0, 0));\n  });\n});\n"},"backend/__testes__/unitario/agenda-horarios.test.js":{"tests":[{"id":"266","name":"gerarSlots (RN14) gera slots de 30 minutos no bloco da manhã","location":{"start":{"column":4,"line":14}}},{"id":"267","name":"gerarSlots (RN14) só gera slots que cabem inteiros no bloco","location":{"start":{"column":4,"line":31}}},{"id":"268","name":"gerarSlots (RN14) retorna lista vazia quando a duração não cabe","location":{"start":{"column":4,"line":45}}},{"id":"269","name":"gerarSlots (RN14) ordena blocos fora de ordem e não gera slots no intervalo","location":{"start":{"column":4,"line":59}}},{"id":"270","name":"dataEmBloqueio (RN15) reconhece datas dentro do bloqueio, inclusive as bordas","location":{"start":{"column":4,"line":80}}},{"id":"271","name":"dataEmBloqueio (RN15) recusa datas fora do bloqueio","location":{"start":{"column":4,"line":95}}},{"id":"272","name":"dataEmBloqueio (RN15) verifica todos os bloqueios da lista","location":{"start":{"column":4,"line":109}}}],"source":"// Testes unitários da geração de horários e verificação de bloqueios (RN14, RN15).\nconst { gerarSlots, dataEmBloqueio } = require('../../src/domain/agenda');\n\ndescribe('gerarSlots (RN14)', () => {\n  /**\n   * @caso CT-UNI-050\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN14\n   * @objetivo Gerar horários em passos iguais à duração da consulta dentro do bloco\n   * @resultadoEsperado gerarSlots retorna 8 horários de 08:00 a 11:30 para bloco 08:00–12:00 com 30 minutos\n   */\n  test('gera slots de 30 minutos no bloco da manhã', () => {\n    const slots = gerarSlots([{ diaSemana: 1, horaInicio: '08:00', horaFim: '12:00' }], 30);\n    expect(slots).toHaveLength(8);\n    expect(slots[0]).toBe('08:00');\n    expect(slots[7]).toBe('11:30');\n    expect(slots).toEqual(['08:00', '08:30', '09:00', '09:30', '10:00', '10:30', '11:00', '11:30']);\n  });\n\n  /**\n   * @caso CT-UNI-051\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN14\n   * @objetivo Gerar apenas slots que cabem inteiros no bloco, descartando o resto\n   * @resultadoEsperado gerarSlots retorna apenas 08:00 e 08:45 para bloco 08:00–10:00 com 45 minutos\n   */\n  test('só gera slots que cabem inteiros no bloco', () => {\n    const slots = gerarSlots([{ diaSemana: 2, horaInicio: '08:00', horaFim: '10:00' }], 45);\n    expect(slots).toEqual(['08:00', '08:45']);\n  });\n\n  /**\n   * @caso CT-UNI-052\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN14\n   * @objetivo Retornar lista vazia quando a duração não cabe nem uma vez no bloco\n   * @resultadoEsperado gerarSlots retorna [] para bloco de 30 minutos com duração de 45 minutos\n   */\n  test('retorna lista vazia quando a duração não cabe', () => {\n    const slots = gerarSlots([{ diaSemana: 3, horaInicio: '08:00', horaFim: '08:30' }], 45);\n    expect(slots).toEqual([]);\n  });\n\n  /**\n   * @caso CT-UNI-053\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN14\n   * @objetivo Ordenar os slots cronologicamente mesmo com blocos informados fora de ordem\n   * @resultadoEsperado gerarSlots retorna manhã antes da tarde, sem slot no intervalo entre os blocos\n   */\n  test('ordena blocos fora de ordem e não gera slots no intervalo', () => {\n    const slots = gerarSlots([\n      { diaSemana: 1, horaInicio: '14:00', horaFim: '15:00' },\n      { diaSemana: 1, horaInicio: '08:00', horaFim: '09:00' },\n    ], 30);\n    expect(slots).toEqual(['08:00', '08:30', '14:00', '14:30']);\n  });\n});\n\ndescribe('dataEmBloqueio (RN15)', () => {\n  const bloqueios = [{ id: 1, medicoId: 1, dataInicio: '2026-11-02', dataFim: '2026-11-06', motivo: 'Férias' }];\n\n  /**\n   * @caso CT-UNI-054\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN15\n   * @objetivo Reconhecer datas dentro do período de bloqueio, inclusive nas bordas\n   * @resultadoEsperado dataEmBloqueio retorna true para 2026-11-02, 2026-11-04 e 2026-11-06\n   */\n  test('reconhece datas dentro do bloqueio, inclusive as bordas', () => {\n    expect(dataEmBloqueio('2026-11-02', bloqueios)).toBe(true);\n    expect(dataEmBloqueio('2026-11-04', bloqueios)).toBe(true);\n    expect(dataEmBloqueio('2026-11-06', bloqueios)).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-055\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN15\n   * @objetivo Recusar datas fora do período de bloqueio\n   * @resultadoEsperado dataEmBloqueio retorna false para 2026-11-01 e 2026-11-07\n   */\n  test('recusa datas fora do bloqueio', () => {\n    expect(dataEmBloqueio('2026-11-01', bloqueios)).toBe(false);\n    expect(dataEmBloqueio('2026-11-07', bloqueios)).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-056\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN15\n   * @objetivo Reconhecer qualquer uma das datas quando existem vários bloqueios cadastrados\n   * @resultadoEsperado dataEmBloqueio retorna true para uma data em cada bloqueio da lista\n   */\n  test('verifica todos os bloqueios da lista', () => {\n    const varios = [\n      ...bloqueios,\n      { id: 2, medicoId: 1, dataInicio: '2026-12-20', dataFim: '2026-12-22', motivo: 'Congresso' },\n    ];\n    expect(dataEmBloqueio('2026-12-21', varios)).toBe(true);\n    expect(dataEmBloqueio('2026-11-03', varios)).toBe(true);\n    expect(dataEmBloqueio('2026-12-15', varios)).toBe(false);\n  });\n});\n"},"backend/__testes__/api/desempenho-api.test.js":{"tests":[{"id":"273","name":"horários livres respondem em menos de 500 ms","location":{"start":{"column":2,"line":53}}},{"id":"274","name":"agendamento responde em menos de 500 ms","location":{"start":{"column":2,"line":73}}}],"source":"// Testes de desempenho da API com volume de dados (RNF05).\nconst clock = require('../../src/utils/clock');\nconst request = require('supertest');\nconst { abrirBanco } = require('../../src/db/connection');\nconst { semear } = require('../../src/db/seed');\nconst { criarApp } = require('../../src/app');\n\nlet db, app, tokenRecepcao, tokenPaciente;\nconst LIMITE_MS = 500;\n\nbeforeAll(async () => {\n  clock.definirAgora(new Date(2026, 9, 19, 8, 0)); // 2026-10-19 08:00, segunda-feira\n  db = abrirBanco(':memory:');\n  semear(db);\n  app = criarApp({ db });\n  const entrar = async (email) => {\n    const r = await request(app).post('/api/auth/login').send({ email, senha: 'Senha123' });\n    return r.body.token;\n  };\n  tokenRecepcao = await entrar('recepcao@clinica.com');\n  tokenPaciente = await entrar('ana@email.com');\n  popularDezMilConsultas();\n});\n\nafterAll(() => {\n  clock.definirAgora(null);\n  db.close();\n});\n\n// 10 mil consultas encerradas no passado (setembro/2026), fora dos dias usados nos testes.\nfunction popularDezMilConsultas() {\n  const inserir = db.prepare(`INSERT INTO consultas\n    (paciente_id, medico_id, inicio, fim, status, valor_centavos, criado_em, atualizado_em)\n    VALUES (?, ?, ?, ?, 'REALIZADA', 15000, '2026-10-19 08:00', '2026-10-19 08:00')`);\n  db.transaction(() => {\n    for (let i = 0; i <"+" 10000; i += 1) {\n      const dia = String(1 + (i % 18)).padStart(2, '0');\n      const hora = String(8 + (i % 10)).padStart(2, '0');\n      inserir.run(1, 1, `2026-09-${dia} ${hora}:00`, `2026-09-${dia} ${hora}:30`);\n    }\n  })();\n}\n\n/**\n * @caso CT-API-079\n * @nivel api\n * @atributo eficiencia-de-desempenho\n * @subatributo comportamento-no-tempo\n * @requisito RNF05\n * @objetivo Responder à listagem de horários livres em menos de 500 ms com 10 mil consultas na base\n * @resultadoEsperado GET /api/medicos/1/horarios devolve 200 com os 16 slots em menos de 500 ms\n */\ntest('horários livres respondem em menos de 500 ms', async () => {\n  const comeco = Date.now();\n  const r = await request(app)\n    .get('/api/medicos/1/horarios?data=2026-10-20')\n    .set('Authorization', `Bearer ${tokenPaciente}`);\n  const duracao = Date.now() - comeco;\n  expect(r.status).toBe(200);\n  expect(r.body.horarios).toHaveLength(16);\n  expect(duracao).toBeLessThan(LIMITE_MS);\n});\n\n/**\n * @caso CT-API-080\n * @nivel api\n * @atributo eficiencia-de-desempenho\n * @subatributo comportamento-no-tempo\n * @requisito RNF05, RN22\n * @objetivo Concluir o agendamento em menos de 500 ms com 10 mil consultas na base\n * @resultadoEsperado POST /api/consultas devolve 201 em menos de 500 ms com o valor correto\n */\ntest('agendamento responde em menos de 500 ms', async () => {\n  const comeco = Date.now();\n  const r = await request(app)\n    .post('/api/consultas')\n    .set('Authorization', `Bearer ${tokenRecepcao}`)\n    .send({ pacienteId: 2, medicoId: 1, inicio: '2026-10-20 08:00' });\n  const duracao = Date.now() - comeco;\n  expect(r.status).toBe(201);\n  expect(r.body.valorCentavos).toBe(13500); // João (68 anos): 10% de desconto na Clínica Geral\n  expect(duracao).toBeLessThan(LIMITE_MS);\n});\n"}},"projectRoot":"{trabalho}/mut/glm","config":{"$schema":"./node_modules/@stryker-mutator/core/schema/stryker-schema.json","testRunner":"jest","jest":{"configFile":"jest.config.cjs","enableFindRelatedTests":false,"projectType":"custom"},"mutate":["backend/src/routes/**/*.js"],"coverageAnalysis":"perTest","concurrency":4,"timeoutMS":5000,"reporters":["json","html","progress-append-only"],"jsonReporter":{"fileName":"reports/mutacao/backend-routes.json"},"htmlReporter":{"fileName":"reports/mutacao/backend-routes.html"},"tempDirName":".stryker-tmp-backend-routes","ignorePatterns":["frontend/__testes__","e2e",".jest.json",".vitest.json","reports"],"cleanTempDir":true,"disableBa
