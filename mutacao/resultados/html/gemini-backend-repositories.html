ou sem separador', () => {\n    expect(crmValido('123456/XX')).toBe(false);\n    expect(crmValido('123456-SP')).toBe(false);\n    expect(crmValido('123456')).toBe(false);\n  });\n\n  // --- RN08: Duração de Consulta ---\n  /**\n   * @caso CT-UNI-020\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN08\n   * @objetivo Aceitar durações válidas (15, 30, 45, 60 minutos)\n   * @resultadoEsperado duracaoConsultaValida retorna true\n   */\n  test('deve aceitar durações de consulta válidas múltiplas de 15 entre 15 e 60', () => {\n    expect(duracaoConsultaValida(15)).toBe(true);\n    expect(duracaoConsultaValida(30)).toBe(true);\n    expect(duracaoConsultaValida(45)).toBe(true);\n    expect(duracaoConsultaValida(60)).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-021\n   * @nivel unitario\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN08\n   * @objetivo Rejeitar durações menores que 15, maiores que 60 ou não múltiplas de 15\n   * @resultadoEsperado duracaoConsultaValida retorna false\n   */\n  test('deve rejeitar durações fora dos limites ou não múltiplas de 15', () => {\n    expect(duracaoConsultaValida(0)).toBe(false);\n    expect(duracaoConsultaValida(10)).toBe(false);\n    expect(duracaoConsultaValida(20)).toBe(false);\n    expect(duracaoConsultaValida(75)).toBe(false);\n    expect(duracaoConsultaValida(null)).toBe(false);\n  });\n\n  // --- RNF07: Manutenibilidade e Isolamento ---\n  /**\n   * @caso CT-UNI-022\n   * @nivel unitario\n   * @atributo manutenibilidade\n   * @subatributo modularidade\n   * @requisito RNF07\n   * @objetivo Garantir que UFS contém todas as 27 unidades federativas brasileiras\n   * @resultadoEsperado UFS possui 27 elementos incluindo estados e DF\n   */\n  test('deve conter as 27 UFs válidas brasileiras', () => {\n    expect(UFS).toHaveLength(27);\n    expect(UFS).toContain('SP');\n    expect(UFS).toContain('DF');\n    expect(UFS).toContain('AM');\n  });\n});\n"},"backend/__testes__/integracao/cadastro-service.test.js":{"tests":[{"id":"81","name":"Integração: CadastroService deve registrar paciente completo persistindo nas tabelas usuarios e pacientes","location":{"start":{"column":4,"line":30}}},{"id":"82","name":"Integração: CadastroService deve rejeitar cadastro de paciente com e-mail duplicado","location":{"start":{"column":4,"line":61}}},{"id":"83","name":"Integração: CadastroService deve rejeitar cadastro com CPF duplicado","location":{"start":{"column":4,"line":90}}},{"id":"84","name":"Integração: CadastroService deve exigir responsável para menor de 18 anos no cadastro de paciente","location":{"start":{"column":4,"line":117}}},{"id":"85","name":"Integração: CadastroService deve cadastrar especialidade com nome e preço base","location":{"start":{"column":4,"line":148}}},{"id":"86","name":"Integração: CadastroService deve rejeitar especialidade com preço não positivo ou nome duplicado","location":{"start":{"column":4,"line":167}}},{"id":"87","name":"Integração: CadastroService deve cadastrar médico associado a uma especialidade existente","location":{"start":{"column":4,"line":189}}},{"id":"88","name":"Integração: CadastroService deve rejeitar médico com especialidade inexistente ou CRM repetido","location":{"start":{"column":4,"line":215}}},{"id":"89","name":"Integração: CadastroService deve ativar e inativar usuário","location":{"start":{"column":9,"line":254}}},{"id":"90","name":"Integração: CadastroService deve persistir dados com caracteres especiais sem vulnerabilidade a SQL injection","location":{"start":{"column":4,"line":282}}},{"id":"91","name":"Integração: CadastroService deve reverter inserção de usuário se a transação do paciente falhar","location":{"start":{"column":9,"line":301}}}],"source":"const { abrirBanco } = require('../../src/db/connection');\nconst { criarServicos } = require('../../src/services');\nconst clock = require('../../src/utils/clock');\n\ndescribe('Integração: CadastroService', () => {\n  let db;\n  let servicos;\n  const agoraFixo = new Date('2026-10-19T08:00:00');\n\n  beforeEach(() => {\n    clock.definirAgora(agoraFixo);\n    db = abrirBanco(':memory:');\n    servicos = criarServicos(db);\n  });\n\n  afterEach(() => {\n    clock.definirAgora(null);\n    db.close();\n  });\n\n  /**\n   * @caso CT-INT-010\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF02.1, RF02.3, RN03\n   * @objetivo Cadastrar paciente com sucesso persistindo usuário e paciente em transação\n   * @resultadoEsperado Paciente criado com CPF gravado somente em dígitos e senha em hash\n   */\n  test('deve registrar paciente completo persistindo nas tabelas usuarios e pacientes', () => {\n    const dados = {\n      nome: 'Mariana Silva',\n      email: 'mariana@email.com',\n      senha: 'SenhaForte123',\n      cpf: '529.982.247-25',\n      dataNascimento: '1995-04-12',\n      telefone: '(11) 98765-4321',\n    };\n\n    const paciente = servicos.cadastroService.registrarPaciente(dados);\n    expect(paciente.id).toBeDefined();\n    expect(paciente.nome).toBe('Mariana Silva');\n    expect(paciente.cpf).toBe('52998224725'); // apenas dígitos\n    expect(paciente.email).toBe('mariana@email.com');\n\n    // Verifica que usuário foi inserido\n    const usuario = servicos.repos.usuarios.buscarPorEmail('mariana@email.com');\n    expect(usuario).toBeDefined();\n    expect(usuario.perfil).toBe('PACIENTE');\n  });\n\n  /**\n   * @caso CT-INT-011\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN01\n   * @objetivo Rejeitar cadastro com e-mail já existente\n   * @resultadoEsperado Lança erro CONFLITO informando e-mail já cadastrado\n   */\n  test('deve rejeitar cadastro de paciente com e-mail duplicado', () => {\n    const dados1 = {\n      nome: 'Primeiro Paciente',\n      email: 'duplicado@email.com',\n      senha: 'Senha123',\n      cpf: '529.982.247-25',\n      dataNascimento: '1990-01-01',\n    };\n    servicos.cadastroService.registrarPaciente(dados1);\n\n    const dados2 = {\n      nome: 'Segundo Paciente',\n      email: 'duplicado@email.com',\n      senha: 'Senha123',\n      cpf: '111.444.777-35',\n      dataNascimento: '1992-02-02',\n    };\n    expect(() => servicos.cadastroService.registrarPaciente(dados2)).toThrow(/E-mail já cadastrado/i);\n  });\n\n  /**\n   * @caso CT-INT-012\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN03\n   * @objetivo Rejeitar cadastro de paciente com CPF já registrado\n   * @resultadoEsperado Lança erro CONFLITO de CPF\n   */\n  test('deve rejeitar cadastro com CPF duplicado', () => {\n    servicos.cadastroService.registrarPaciente({\n      nome: 'Pessoa Um',\n      email: 'um@email.com',\n      senha: 'Senha123',\n      cpf: '529.982.247-25',\n      dataNascimento: '1990-01-01',\n    });\n\n    expect(() => servicos.cadastroService.registrarPaciente({\n      nome: 'Pessoa Dois',\n      email: 'dois@email.com',\n      senha: 'Senha123',\n      cpf: '529.982.247-25',\n      dataNascimento: '1992-02-02',\n    })).toThrow(/CPF já cadastrado/i);\n  });\n\n  /**\n   * @caso CT-INT-013\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN06\n   * @objetivo Exigir nome do responsável para paciente menor de 18 anos\n   * @resultadoEsperado Lança erro VALIDACAO se responsavelNome não for informado\n   */\n  test('deve exigir responsável para menor de 18 anos no cadastro de paciente', () => {\n    // 10 anos em 2026 -> 2016\n    expect(() => servicos.cadastroService.registrarPaciente({\n      nome: 'Criança Silva',\n      email: 'crianca@email.com',\n      senha: 'Senha123',\n      cpf: '390.533.447-05',\n      dataNascimento: '2016-05-10',\n    })).toThrow(/deve informar o nome do responsável/i);\n\n    // Com responsável\n    const paciente = servicos.cadastroService.registrarPaciente({\n      nome: 'Criança Silva',\n      email: 'crianca@email.com',\n      senha: 'Senha123',\n      cpf: '390.533.447-05',\n      dataNascimento: '2016-05-10',\n      responsavelNome: 'Mãe Silva',\n    });\n    expect(paciente.responsavelNome).toBe('Mãe Silva');\n  });\n\n  /**\n   * @caso CT-INT-014\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF03.1, RN09\n   * @objetivo Cadastrar especialidade com preço base em centavos\n   * @resultadoEsperado Especialidade cadastrada e recuperável com id gerado\n   */\n  test('deve cadastrar especialidade com nome e preço base', () => {\n    const esp = servicos.cadastroService.criarEspecialidade({\n      nome: 'Ortopedia',\n      precoCentavos: 28000,\n    });\n    expect(esp.id).toBeDefined();\n    expect(esp.nome).toBe('Ortopedia');\n    expect(esp.precoCentavos).toBe(28000);\n  });\n\n  /**\n   * @caso CT-INT-015\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN09\n   * @objetivo Impedir criação de especialidade com nome duplicado ou preço menor/igual a zero\n   * @resultadoEsperado Lança erro apropriado de conflito ou validação\n   */\n  test('deve rejeitar especialidade com preço não positivo ou nome duplicado', () => {\n    expect(() => servicos.cadastroService.criarEspecialidade({\n      nome: 'Fisioterapia',\n      precoCentavos: 0,\n    })).toThrow(/maior que zero/i);\n\n    servicos.cadastroService.criarEspecialidade({ nome: 'Fisioterapia', precoCentavos: 12000 });\n    expect(() => servicos.cadastroService.criarEspecialidade({\n      nome: 'Fisioterapia',\n      precoCentavos: 15000,\n    })).toThrow(/já cadastrada/i);\n  });\n\n  /**\n   * @caso CT-INT-016\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF04.1, RN07, RN08\n   * @objetivo Cadastrar médico com especialidade e duração de consulta\n   * @resultadoEsperado Médico persistido vinculado ao usuário com perfil MEDICO\n   */\n  test('deve cadastrar médico associado a uma especialidade existente', () => {\n    const esp = servicos.cadastroService.criarEspecialidade({ nome: 'Neurologia', precoCentavos: 35000 });\n    const medico = servicos.cadastroService.criarMedico({\n      nome: 'Dr. Roberto',\n      email: 'roberto@clinica.com',\n      senha: 'Senha123',\n      crm: '554433/SP',\n      especialidadeId: esp.id,\n      duracaoConsultaMin: 45,\n    });\n\n    expect(medico.id).toBeDefined();\n    expect(medico.crm).toBe('554433/SP');\n    expect(medico.duracaoConsultaMin).toBe(45);\n    expect(medico.especialidadeId).toBe(esp.id);\n  });\n\n  /**\n   * @caso CT-INT-017\n   * @nivel integracao\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RF04.1, RN07\n   * @objetivo Rejeitar cadastro de médico com CRM duplicado ou especialidade inexistente\n   * @resultadoEsperado Lança erro de conflito de CRM ou validação de especialidade\n   */\n  test('deve rejeitar médico com especialidade inexistente ou CRM repetido', () => {\n    const esp = servicos.cadastroService.criarEspecialidade({ nome: 'Oftalmologia', precoCentavos: 20000 });\n    servicos.cadastroService.criarMedico({\n      nome: 'Dra. Julia',\n      email: 'julia@clinica.com',\n      senha: 'Senha123',\n      crm: '998877/RJ',\n      especialidadeId: esp.id,\n      duracaoConsultaMin: 30,\n    });\n\n    // CRM repetido\n    expect(() => servicos.cadastroService.criarMedico({\n      nome: 'Dr. Marcos',\n      email: 'marcos@clinica.com',\n      senha: 'Senha123',\n      crm: '998877/RJ',\n      especialidadeId: esp.id,\n    })).toThrow(/CRM já cadastrado/i);\n\n    // Especialidade inexistente\n    expect(() => servicos.cadastroService.criarMedico({\n      nome: 'Dr. Marcos',\n      email: 'marcos@clinica.com',\n      senha: 'Senha123',\n      crm: '112233/RJ',\n      especialidadeId: 9999,\n    })).toThrow(/Especialidade inexistente/i);\n  });\n\n  /**\n   * @caso CT-INT-018\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN21\n   * @objetivo Ativar e inativar usuário no sistema\n   * @resultadoEsperado Flag ativo atualizada para false e true conforme solicitado\n   */\n  test.skip('deve ativar e inativar usuário', () => {\n    const esp = servicos.cadastroService.criarEspecialidade({ nome: 'Ginecologia', precoCentavos: 22000 });\n    const medico = servicos.cadastroService.criarMedico({\n      nome: 'Dra. Laura',\n      email: 'laura@clinica.com',\n      senha: 'Senha123',\n      crm: '334455/SP',\n      especialidadeId: esp.id,\n    });\n\n    servicos.cadastroService.definirUsuarioAtivo(medico.usuarioId, false);\n    let u = servicos.repos.usuarios.buscarPorId(medico.usuarioId);\n    expect(u.ativo).toBe(0);\n\n    servicos.cadastroService.definirUsuarioAtivo(medico.usuarioId, true);\n    u = servicos.repos.usuarios.buscarPorId(medico.usuarioId);\n    expect(u.ativo).toBe(1);\n  });\n\n  /**\n   * @caso CT-INT-019\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo integridade\n   * @requisito RNF03\n   * @objetivo Garantir segurança contra injeção SQL no cadastro\n   * @resultadoEsperado Trata strings com aspas e comandos SQL como literais sem quebrar o banco\n   */\n  test('deve persistir dados com caracteres especiais sem vulnerabilidade a SQL injection', () => {\n    const esp = servicos.cadastroService.criarEspecialidade({\n      nome: \"Especialidade' OR '1'='1\",\n      precoCentavos: 10000,\n    });\n    expect(esp.nome).toBe(\"Especialidade' OR '1'='1\");\n    const buscada = servicos.repos.especialidades.buscarPorId(esp.id);\n    expect(buscada.nome).toBe(\"Especialidade' OR '1'='1\");\n  });\n\n  /**\n   * @caso CT-INT-020\n   * @nivel integracao\n   * @atributo confiabilidade\n   * @subatributo recuperabilidade\n   * @requisito RNF04\n   * @objetivo Rollback automático de transação caso ocorra falha ao inserir paciente\n   * @resultadoEsperado Nenhum usuário órfão é deixado no banco se a criação de paciente falhar\n   */\n  test.skip('deve reverter inserção de usuário se a transação do paciente falhar', () => {\n    const totalUsuariosAntes = db.prepare('SELECT COUNT(*) AS n FROM usuarios').get().n;\n\n    // Força falha com CPF que passa no formato mas duplicado ou erro de banco\n    try {\n      servicos.cadastroService.registrarPaciente({\n        nome: 'Paciente Teste',\n        email: 'teste.falha@email.com',\n        senha: 'Senha123',\n        cpf: '529.982.247-25',\n        dataNascimento: '1990-01-01',\n      });\n    } catch {}\n\n    // Tentativa com mesmo e-mail ou erro\n    try {\n      servicos.cadastroService.registrarPaciente({\n        nome: 'Paciente Teste',\n        email: 'outro@email.com',\n        senha: 'Senha123',\n        cpf: '529.982.247-25', // CPF duplicado disparado após usuário\n        dataNascimento: '1990-01-01',\n      });\n    } catch {}\n\n    const usuarioOrfao = servicos.repos.usuarios.buscarPorEmail('outro@email.com');\n    expect(usuarioOrfao).toBeUndefined();\n  });\n});\n"},"backend/__testes__/unitario/agenda.test.js":{"tests":[{"id":"92","name":"Regras de Agenda (agenda.js) deve validar bloco com dia de 0 a 6 e horário múltiplo de 15 entre 07:00 e 20:00","location":{"start":{"column":4,"line":22}}},{"id":"93","name":"Regras de Agenda (agenda.js) deve rejeitar dia da semana menor que 0 ou maior que 6","location":{"start":{"column":4,"line":36}}},{"id":"94","name":"Regras de Agenda (agenda.js) deve rejeitar horários malformados","location":{"start":{"column":4,"line":51}}},{"id":"95","name":"Regras de Agenda (agenda.js) deve rejeitar minutos não múltiplos de 15","location":{"start":{"column":4,"line":65}}},{"id":"96","name":"Regras de Agenda (agenda.js) deve respeitar horários de abertura e fechamento da clínica","location":{"start":{"column":4,"line":79}}},{"id":"97","name":"Regras de Agenda (agenda.js) deve rejeitar início igual ou superior ao fim","location":{"start":{"column":4,"line":93}}},{"id":"98","name":"Regras de Agenda (agenda.js) deve permitir blocos encostados no mesmo dia","location":{"start":{"column":4,"line":108}}},{"id":"99","name":"Regras de Agenda (agenda.js) deve rejeitar blocos que se sobrepõem no mesmo dia","location":{"start":{"column":4,"line":125}}},{"id":"100","name":"Regras de Agenda (agenda.js) deve permitir mesmos horários em dias da semana diferentes","location":{"start":{"column":4,"line":142}}},{"id":"101","name":"Regras de Agenda (agenda.js) deve rejeitar entrada de grade não array","location":{"start":{"column":4,"line":159}}},{"id":"102","name":"Regras de Agenda (agenda.js) deve gerar slots de 30 minutos em bloco de 08:00 as 10:00","location":{"start":{"column":4,"line":174}}},{"id":"103","name":"Regras de Agenda (agenda.js) deve descartar minutos finais onde a consulta não cabe por inteiro","location":{"start":{"column":4,"line":189}}},{"id":"104","name":"Regras de Agenda (agenda.js) deve gerar slots ordenados independentemente da ordem dos blocos","location":{"start":{"column":4,"line":204}}},{"id":"105","name":"Regras de Agenda (agenda.js) deve detectar datas contidas dentro do período de bloqueio","location":{"start":{"column":4,"line":223}}},{"id":"106","name":"Regras de Agenda (agenda.js) deve testar lógica de sobreposição de intervalos","location":{"start":{"column":4,"line":244}}},{"id":"107","name":"Regras de Agenda (agenda.js) deve expor constantes de abertura e fechamento corretas em minutos","location":{"start":{"column":4,"line":260}}}],"source":"const {\n  ABERTURA,\n  FECHAMENTO,\n  intervalosSobrepoem,\n  validarBloco,\n  validarGrade,\n  gerarSlots,\n  dataEmBloqueio,\n} = require('../../src/domain/agenda');\n\ndescribe('Regras de Agenda (agenda.js)', () => {\n  // --- RN10: Blocos de Disponibilidade ---\n  /**\n   * @caso CT-UNI-023\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN10\n   * @objetivo Aceitar bloco de disponibilidade com dados válidos\n   * @resultadoEsperado validarBloco retorna null\n   */\n  test('deve validar bloco com dia de 0 a 6 e horário múltiplo de 15 entre 07:00 e 20:00', () => {\n    const bloco = { diaSemana: 1, horaInicio: '08:00', horaFim: '12:00' };\n    expect(validarBloco(bloco)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-024\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN10\n   * @objetivo Rejeitar bloco com dia da semana inválido (<"+" 0 ou > 6 ou não inteiro)\n   * @resultadoEsperado Retornar mensagem de erro sobre dia da semana\n   */\n  test('deve rejeitar dia da semana menor que 0 ou maior que 6', () => {\n    expect(validarBloco({ diaSemana: -1, horaInicio: '08:00', horaFim: '12:00' })).toMatch(/Dia da semana deve ser um inteiro/i);\n    expect(validarBloco({ diaSemana: 7, horaInicio: '08:00', horaFim: '12:00' })).toMatch(/Dia da semana deve ser um inteiro/i);\n    expect(validarBloco({ diaSemana: '1', horaInicio: '08:00', horaFim: '12:00' })).toMatch(/Dia da semana deve ser um inteiro/i);\n  });\n\n  /**\n   * @caso CT-UNI-025\n   * @nivel unitario\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN10\n   * @objetivo Rejeitar horários fora do formato HH:mm\n   * @resultadoEsperado Retornar erro de formato de horários\n   */\n  test('deve rejeitar horários malformados', () => {\n    expect(validarBloco({ diaSemana: 1, horaInicio: '8:00', horaFim: '12:00' })).toMatch(/formato HH:mm/i);\n    expect(validarBloco({ diaSemana: 1, horaInicio: '08:00', horaFim: 'tarde' })).toMatch(/formato HH:mm/i);\n  });\n\n  /**\n   * @caso CT-UNI-026\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN10\n   * @objetivo Rejeitar horários que não sejam múltiplos de 15 minutos\n   * @resultadoEsperado Retornar erro sobre múltiplos de 15 minutos\n   */\n  test('deve rejeitar minutos não múltiplos de 15', () => {\n    const bloco = { diaSemana: 2, horaInicio: '08:10', horaFim: '12:00' };\n    expect(validarBloco(bloco)).toMatch(/múltiplos de 15 minutos/i);\n  });\n\n  /**\n   * @caso CT-UNI-027\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN10\n   * @objetivo Rejeitar horários antes das 07:00 ou após as 20:00\n   * @resultadoEsperado Retornar erro de horários fora de 07:00 a 20:00\n   */\n  test('deve respeitar horários de abertura e fechamento da clínica', () => {\n    expect(validarBloco({ diaSemana: 3, horaInicio: '06:45', horaFim: '10:00' })).toMatch(/entre 07:00 e 20:00/i);\n    expect(validarBloco({ diaSemana: 3, horaInicio: '18:00', horaFim: '20:15' })).toMatch(/entre 07:00 e 20:00/i);\n  });\n\n  /**\n   * @caso CT-UNI-028\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN10\n   * @objetivo Rejeitar bloco onde hora de início seja igual ou posterior à hora de fim\n   * @resultadoEsperado Retornar erro informando que início deve ser anterior ao fim\n   */\n  test('deve rejeitar início igual ou superior ao fim', () => {\n    expect(validarBloco({ diaSemana: 4, horaInicio: '12:00', horaFim: '12:00' })).toMatch(/início deve ser anterior à hora de fim/i);\n    expect(validarBloco({ diaSemana: 4, horaInicio: '14:00', horaFim: '12:00' })).toMatch(/início deve ser anterior à hora de fim/i);\n  });\n\n  // --- RN11: Sobreposição de Blocos ---\n  /**\n   * @caso CT-UNI-029\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN11\n   * @objetivo Permitir blocos adjacentes no mesmo dia (encostar é permitido)\n   * @resultadoEsperado validarGrade retorna null para blocos contíguos\n   */\n  test('deve permitir blocos encostados no mesmo dia', () => {\n    const blocos = [\n      { diaSemana: 1, horaInicio: '08:00', horaFim: '12:00' },\n      { diaSemana: 1, horaInicio: '12:00', horaFim: '16:00' },\n    ];\n    expect(validarGrade(blocos)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-030\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN11\n   * @objetivo Rejeitar blocos que se sobreponham no mesmo dia\n   * @resultadoEsperado validarGrade retorna mensagem de sobreposição com os horários envolvidos\n   */\n  test('deve rejeitar blocos que se sobrepõem no mesmo dia', () => {\n    const blocos = [\n      { diaSemana: 1, horaInicio: '08:00', horaFim: '12:00' },\n      { diaSemana: 1, horaInicio: '11:00', horaFim: '14:00' },\n    ];\n    expect(validarGrade(blocos)).toMatch(/Blocos sobrepostos no dia 1/i);\n  });\n\n  /**\n   * @caso CT-UNI-031\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN11\n   * @objetivo Permitir horários coincidentes se forem em dias da semana diferentes\n   * @resultadoEsperado validarGrade retorna null\n   */\n  test('deve permitir mesmos horários em dias da semana diferentes', () => {\n    const blocos = [\n      { diaSemana: 1, horaInicio: '08:00', horaFim: '12:00' },\n      { diaSemana: 2, horaInicio: '08:00', horaFim: '12:00' },\n    ];\n    expect(validarGrade(blocos)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-032\n   * @nivel unitario\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN11\n   * @objetivo Rejeitar argumento de grade que não seja um array\n   * @resultadoEsperado validarGrade retorna erro informando que deve ser uma lista\n   */\n  test('deve rejeitar entrada de grade não array', () => {\n    expect(validarGrade(null)).toMatch(/A grade deve ser uma lista/i);\n    expect(validarGrade({})).toMatch(/A grade deve ser uma lista/i);\n  });\n\n  // --- RN14: Geração de Slots ---\n  /**\n   * @caso CT-UNI-033\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN14\n   * @objetivo Gerar slots sequenciais conforme a duração da consulta\n   * @resultadoEsperado Retornar lista de horários de início calculados corretamente\n   */\n  test('deve gerar slots de 30 minutos em bloco de 08:00 as 10:00', () => {\n    const blocos = [{ horaInicio: '08:00', horaFim: '10:00' }];\n    const slots = gerarSlots(blocos, 30);\n    expect(slots).toEqual(['08:00', '08:30', '09:00', '09:30']);\n  });\n\n  /**\n   * @caso CT-UNI-034\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN14\n   * @objetivo Descartar sobras de tempo onde uma consulta não cabe inteira\n   * @resultadoEsperado Se bloco for de 45 min e consulta durar 30, gera apenas 1 slot\n   */\n  test('deve descartar minutos finais onde a consulta não cabe por inteiro', () => {\n    const blocos = [{ horaInicio: '08:00', horaFim: '08:45' }];\n    const slots = gerarSlots(blocos, 30);\n    expect(slots).toEqual(['08:00']);\n  });\n\n  /**\n   * @caso CT-UNI-035\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN14\n   * @objetivo Ordenar slots cronologicamente mesmo se blocos forem passados fora de ordem\n   * @resultadoEsperado Slots ordenados do mais cedo para o mais tarde\n   */\n  test('deve gerar slots ordenados independentemente da ordem dos blocos', () => {\n    const blocos = [\n      { horaInicio: '14:00', horaFim: '15:00' },\n      { horaInicio: '08:00', horaFim: '09:00' },\n    ];\n    const slots = gerarSlots(blocos, 30);\n    expect(slots).toEqual(['08:00', '08:30', '14:00', '14:30']);\n  });\n\n  // --- RN15: Bloqueio de Agenda ---\n  /**\n   * @caso CT-UNI-036\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN15\n   * @objetivo Identificar se uma data está dentro de um período de bloqueio\n   * @resultadoEsperado dataEmBloqueio retorna true para datas no intervalo inclusive\n   */\n  test('deve detectar datas contidas dentro do período de bloqueio', () => {\n    const bloqueios = [\n      { dataInicio: '2026-11-01', dataFim: '2026-11-10' },\n    ];\n    expect(dataEmBloqueio('2026-11-01', bloqueios)).toBe(true);\n    expect(dataEmBloqueio('2026-11-05', bloqueios)).toBe(true);\n    expect(dataEmBloqueio('2026-11-10', bloqueios)).toBe(true);\n    expect(dataEmBloqueio('2026-11-11', bloqueios)).toBe(false);\n    expect(dataEmBloqueio('2026-10-31', bloqueios)).toBe(false);\n  });\n\n  // --- RNF07: Manutenibilidade e Modularidade ---\n  /**\n   * @caso CT-UNI-037\n   * @nivel unitario\n   * @atributo manutenibilidade\n   * @subatributo testabilidade\n   * @requisito RNF07\n   * @objetivo Testar função pura intervalosSobrepoem para casos limites\n   * @resultadoEsperado Retornar true apenas quando há sobreposição real de horários\n   */\n  test('deve testar lógica de sobreposição de intervalos', () => {\n    // 8h às 10h (480 a 600) e 9h às 11h (540 a 660) -> sobrepõe\n    expect(intervalosSobrepoem(480, 600, 540, 660)).toBe(true);\n    // 8h às 10h (480 a 600) e 10h às 12h (600 a 720) -> encosta, não sobrepõe\n    expect(intervalosSobrepoem(480, 600, 600, 720)).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-038\n   * @nivel unitario\n   * @atributo manutenibilidade\n   * @subatributo modularidade\n   * @requisito RNF07\n   * @objetivo Constantes de abertura e fechamento são puras e calculadas em minutos\n   * @resultadoEsperado ABERTURA = 420 (07:00) e FECHAMENTO = 1200 (20:00)\n   */\n  test('deve expor constantes de abertura e fechamento corretas em minutos', () => {\n    expect(ABERTURA).toBe(7 * 60);\n    expect(FECHAMENTO).toBe(20 * 60);\n  });\n});\n"},"backend/__testes__/integracao/agenda-service.test.js":{"tests":[{"id":"108","name":"Integração: AgendaService deve substituir por completo a grade anterior do médico","location":{"start":{"column":4,"line":33}}},{"id":"109","name":"Integração: AgendaService deve proibir médico de alterar a grade de outro médico","location":{"start":{"column":4,"line":59}}},{"id":"110","name":"Integração: AgendaService deve permitir que a recepção salve grade para qualquer médico","location":{"start":{"column":4,"line":80}}},{"id":"111","name":"Integração: AgendaService deve criar bloqueio de agenda válido com motivo","location":{"start":{"column":4,"line":99}}},{"id":"112","name":"Integração: AgendaService deve rejeitar bloqueio que inicia no passado","location":{"start":{"column":4,"line":125}}},{"id":"113","name":"Integração: AgendaService deve rejeitar bloqueio em período que contenha consulta ativa","location":{"start":{"column":4,"line":147}}},{"id":"114","name":"Integração: AgendaService deve remover bloqueio com sucesso","location":{"start":{"column":4,"line":180}}},{"id":"115","name":"Integração: AgendaService deve listar horários livres respeitando grade e antecedência em menos de 500ms","location":{"start":{"column":4,"line":203}}},{"id":"116","name":"Integração: AgendaService deve omitir horários já ocupados por consulta ativa","location":{"start":{"column":4,"line":226}}},{"id":"117","name":"Integração: AgendaService médico inativo não deve fornecer horários livres","location":{"start":{"column":4,"line":254}}}],"source":"const { abrirBanco } = require('../../src/db/connection');\nconst { semear } = require('../../src/db/seed');\nconst { criarServicos } = require('../../src/services');\nconst clock = require('../../src/utils/clock');\n\ndescribe('Integração: AgendaService', () => {\n  let db;\n  let servicos;\n  let dados;\n  const agoraFixo = new Date('2026-10-19T08:00:00'); // Segunda-feira\n\n  beforeEach(() => {\n    clock.definirAgora(agoraFixo);\n    db = abrirBanco(':memory:');\n    dados = semear(db);\n    servicos = criarServicos(db);\n  });\n\n  afterEach(() => {\n    clock.definirAgora(null);\n    db.close();\n  });\n\n  /**\n   * @caso CT-INT-021\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF05.1, RF05.2\n   * @objetivo Salvar grade semanal substituindo inteiramente a grade anterior\n   * @resultadoEsperado A nova grade reflete exatamente os blocos enviados\n   */\n  test('deve substituir por completo a grade anterior do médico', () => {\n    const medico = dados.medicos[0];\n    const atorMedico = { perfil: 'MEDICO', medicoId: medico.id };\n\n    const novaGrade = [\n      { diaSemana: 1, horaInicio: '09:00', horaFim: '13:00' },\n      { diaSemana: 3, horaInicio: '14:00', horaFim: '18:00' },\n    ];\n\n    const resultado = servicos.agendaService.salvarGrade(atorMedico, medico.id, novaGrade);\n    expect(resultado).toHaveLength(2);\n    expect(resultado[0].horaInicio).toBe('09:00');\n\n    const gradeSalva = servicos.agendaService.obterGrade(medico.id);\n    expect(gradeSalva).toHaveLength(2);\n  });\n\n  /**\n   * @caso CT-INT-022\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RN30, RF05.1\n   * @objetivo Impedir médico de alterar grade de outro médico\n   * @resultadoEsperado Lança erro SEM_PERMISSAO\n   */\n  test('deve proibir médico de alterar a grade de outro médico', () => {\n    const medico1 = dados.medicos[0];\n    const medico2 = dados.medicos[1];\n    const atorMedico1 = { perfil: 'MEDICO', medicoId: medico1.id };\n\n    expect(() => {\n      servicos.agendaService.salvarGrade(atorMedico1, medico2.id, [\n        { diaSemana: 1, horaInicio: '08:00', horaFim: '12:00' },\n      ]);\n    }).toThrow(/Você só pode gerenciar a sua própria agenda/i);\n  });\n\n  /**\n   * @caso CT-INT-023\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF05.1\n   * @objetivo Permitir que a recepção salve a grade de qualquer médico\n   * @resultadoEsperado Grade atualizada com sucesso pelo ator RECEPCAO\n   */\n  test('deve permitir que a recepção salve grade para qualquer médico', () => {\n    const medico = dados.medicos[0];\n    const atorRecepcao = { perfil: 'RECEPCAO' };\n\n    const blocos = [{ diaSemana: 2, horaInicio: '10:00', horaFim: '14:00' }];\n    const resultado = servicos.agendaService.salvarGrade(atorRecepcao, medico.id, blocos);\n    expect(resultado).toHaveLength(1);\n    expect(resultado[0].horaInicio).toBe('10:00');\n  });\n\n  /**\n   * @caso CT-INT-024\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF06.1, RN12\n   * @objetivo Criar bloqueio de agenda por período de datas futuras\n   * @resultadoEsperado Bloqueio inserido e retornado com id e datas\n   */\n  test('deve criar bloqueio de agenda válido com motivo', () => {\n    const medico = dados.medicos[0];\n    const atorMedico = { perfil: 'MEDICO', medicoId: medico.id };\n\n    const bloqueio = servicos.agendaService.criarBloqueio(atorMedico, medico.id, {\n      dataInicio: '2026-11-01',\n      dataFim: '2026-11-15',\n      motivo: 'Férias coletivas',\n    });\n\n    expect(bloqueio.id).toBeDefined();\n    expect(bloqueio.motivo).toBe('Férias coletivas');\n\n    const lista = servicos.agendaService.listarBloqueios(atorMedico, medico.id);\n    expect(lista.some((b) => b.id === bloqueio.id)).toBe(true);\n  });\n\n  /**\n   * @caso CT-INT-025\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN12\n   * @objetivo Impedir criação de bloqueio que se inicia no passado\n   * @resultadoEsperado Lança erro REGRA_NEGOCIO informando que bloqueio não pode começar no passado\n   */\n  test('deve rejeitar bloqueio que inicia no passado', () => {\n    const medico = dados.medicos[0];\n    const ator = { perfil: 'RECEPCAO' };\n\n    expect(() => {\n      servicos.agendaService.criarBloqueio(ator, medico.id, {\n        dataInicio: '2026-10-18', // ontem em relação a 2026-10-19\n        dataFim: '2026-10-25',\n        motivo: 'Folga',\n      });\n    }).toThrow(/não pode começar no passado/i);\n  });\n\n  /**\n   * @caso CT-INT-026\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN13\n   * @objetivo Impedir criação de bloqueio em período que contenha consulta ativa do médico\n   * @resultadoEsperado Lança erro REGRA_NEGOCIO indicando existência de consulta agendada\n   */\n  test('deve rejeitar bloqueio em período que contenha consulta ativa', () => {\n    const medico = dados.medicos[0];\n    const paciente = dados.pacientes[0];\n\n    // Cria consulta ativa em 2026-10-20 (terça-feira) às 09:00\n    servicos.repos.consultas.inserir({\n      pacienteId: paciente.id,\n      medicoId: medico.id,\n      inicio: '2026-10-20 09:00',\n      fim: '2026-10-20 09:30',\n      valorCentavos: 15000,\n      agora: '2026-10-19 08:00',\n    });\n\n    const ator = { perfil: 'RECEPCAO' };\n    expect(() => {\n      servicos.agendaService.criarBloqueio(ator, medico.id, {\n        dataInicio: '2026-10-20',\n        dataFim: '2026-10-22',\n        motivo: 'Congresso',\n      });\n    }).toThrow(/consulta\\(s\\) agendada\\(s\\) no período/i);\n  });\n\n  /**\n   * @caso CT-INT-027\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF06.2\n   * @objetivo Remover bloqueio de agenda existente\n   * @resultadoEsperado Bloqueio deixa de existir na listagem\n   */\n  test('deve remover bloqueio com sucesso', () => {\n    const medico = dados.medicos[0];\n    const ator = { perfil: 'RECEPCAO' };\n    const b = servicos.agendaService.criarBloqueio(ator, medico.id, {\n      dataInicio: '2026-11-20',\n      dataFim: '2026-11-22',\n      motivo: 'Folga pontual',\n    });\n\n    servicos.agendaService.removerBloqueio(ator, medico.id, b.id);\n    const lista = servicos.agendaService.listarBloqueios(ator, medico.id);\n    expect(lista.some((item) => item.id === b.id)).toBe(false);\n  });\n\n  /**\n   * @caso CT-INT-028\n   * @nivel integracao\n   * @atributo eficiencia-de-desempenho\n   * @subatributo comportamento-no-tempo\n   * @requisito RF07.1, RNF05\n   * @objetivo Listar horários livres respeitando a grade semanal em menos de 500 ms\n   * @resultadoEsperado Retorna horários válidos e tempo de execução inferior a 500ms\n   */\n  test('deve listar horários livres respeitando grade e antecedência em menos de 500ms', () => {\n    const inicioExec = Date.now();\n    const medico = dados.medicos[0]; // Dr Carlos, seg-sex 08-12 e 14-18\n    // Hoje é 2026-10-19 08:00. Antecedência mínima de 2 horas exclui 08:00, 08:30, 09:00, 09:30.\n    // Primeiro horário livre de hoje deve ser a partir das 10:00\n    const horarios = servicos.agendaService.horariosLivres(medico.id, '2026-10-19');\n    const duracao = Date.now() - inicioExec;\n\n    expect(duracao).toBeLessThan(500);\n    expect(horarios).toContain('2026-10-19 10:00');\n    expect(horarios).not.toContain('2026-10-19 08:00');\n    expect(horarios).not.toContain('2026-10-19 09:30');\n  });\n\n  /**\n   * @caso CT-INT-029\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF07.1, RN15\n   * @objetivo Omitir horários que já estejam ocupados por consulta ativa ou dentro de bloqueio\n   * @resultadoEsperado Horário ocupado não aparece na lista de livres\n   */\n  test('deve omitir horários já ocupados por consulta ativa', () => {\n    const medico = dados.medicos[0];\n    const paciente = dados.pacientes[0];\n\n    // Ocupa 2026-10-20 10:00\n    servicos.repos.consultas.inserir({\n      pacienteId: paciente.id,\n      medicoId: medico.id,\n      inicio: '2026-10-20 10:00',\n      fim: '2026-10-20 10:30',\n      valorCentavos: 15000,\n      agora: '2026-10-19 08:00',\n    });\n\n    const horarios = servicos.agendaService.horariosLivres(medico.id, '2026-10-20');\n    expect(horarios).not.toContain('2026-10-20 10:00');\n    expect(horarios).toContain('2026-10-20 10:30');\n  });\n\n  /**\n   * @caso CT-INT-030\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN21\n   * @objetivo Retornar lista vazia de horários livres quando o médico estiver inativo\n   * @resultadoEsperado Array vazio\n   */\n  test('médico inativo não deve fornecer horários livres', () => {\n    const medico = dados.medicos[0];\n    servicos.cadastroService.definirUsuarioAtivo(medico.usuarioId, false);\n\n    const horarios = servicos.agendaService.horariosLivres(medico.id, '2026-10-20');\n    expect(horarios).toEqual([]);\n  });\n});\n"},"backend/__testes__/api/medicos-api.test.js":{"tests":[{"id":"118","name":"API: Médicos (/api/medicos) GET /api/medicos - lista médicos cadastrados","location":{"start":{"column":4,"line":49}}},{"id":"119","name":"API: Médicos (/api/medicos) POST /api/medicos - recepção cadastra novo médico com CRM e duração","location":{"start":{"column":4,"line":69}}},{"id":"120","name":"API: Médicos (/api/medicos) POST /api/medicos - paciente recebe 403 ao tentar cadastrar médico","location":{"start":{"column":4,"line":96}}},{"id":"121","name":"API: Médicos (/api/medicos) GET /api/medicos/:id/disponibilidades - retorna blocos de disponibilidade","location":{"start":{"column":4,"line":121}}},{"id":"122","name":"API: Médicos (/api/medicos) PUT /api/medicos/:id/disponibilidades - médico dono atualiza grade","location":{"start":{"column":4,"line":140}}},{"id":"123","name":"API: Médicos (/api/medicos) PUT /api/medicos/:id/disponibilidades - médico recebe 403 ao tentar alterar grade alheia","location":{"start":{"column":4,"line":164}}},{"id":"124","name":"API: Médicos (/api/medicos) POST /api/medicos/:id/bloqueios - médico cria bloqueio de agenda","location":{"start":{"column":4,"line":183}}},{"id":"125","name":"API: Médicos (/api/medicos) POST /api/medicos/:id/bloqueios - retorna 400 se data fim for anterior a data inicio","location":{"start":{"column":4,"line":206}}},{"id":"126","name":"API: Médicos (/api/medicos) DELETE /api/medicos/:id/bloqueios/:bloqueioId - médico remove bloqueio","location":{"start":{"column":4,"line":228}}},{"id":"127","name":"API: Médicos (/api/medicos) GET /api/medicos/:id/horarios - retorna lista de horários livres","location":{"start":{"column":4,"line":251}}}],"source":"const request = require('supertest');\nconst { abrirBanco } = require('../../src/db/connection');\nconst { semear, SENHA_PADRAO } = require('../../src/db/seed');\nconst { criarApp } = require('../../src/app');\nconst clock = require('../../src/utils/clock');\n\ndescribe('API: Médicos (/api/medicos)', () => {\n  let db;\n  let app;\n  let tokenRecepcao;\n  let tokenMedico1;\n  let tokenMedico2;\n  let tokenPaciente;\n  const agoraFixo = new Date('2026-10-19T08:00:00');\n\n  beforeEach(async () => {\n    clock.definirAgora(agoraFixo);\n    db = abrirBanco(':memory:');\n    semear(db);\n    app = criarApp({ db });\n\n    const lRec = await request(app).post('/api/auth/login').send({ email: 'recepcao@clinica.com', senha: SENHA_PADRAO });\n    tokenRecepcao = lRec.body.token;\n\n    const lMed1 = await request(app).post('/api/auth/login').send({ email: 'carlos@clinica.com', senha: SENHA_PADRAO });\n    tokenMedico1 = lMed1.body.token; // Medico ID 1\n\n    const lMed2 = await request(app).post('/api/auth/login').send({ email: 'beatriz@clinica.com', senha: SENHA_PADRAO });\n    tokenMedico2 = lMed2.body.token; // Medico ID 2\n\n    const lPac = await request(app).post('/api/auth/login').send({ email: 'ana@email.com', senha: SENHA_PADRAO });\n    tokenPaciente = lPac.body.token;\n  });\n\n  afterEach(() => {\n    clock.definirAgora(null);\n    db.close();\n  });\n\n  /**\n   * @caso CT-API-015\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF04\n   * @objetivo Listar médicos cadastrados com possibilidade de filtrar por especialidade\n   * @resultadoEsperado Status 200 com lista de médicos\n   */\n  test('GET /api/medicos - lista médicos cadastrados', async () => {\n    const res = await request(app)\n      .get('/api/medicos')\n      .set('Authorization', `Bearer ${tokenPaciente}`);\n\n    expect(res.status).toBe(200);\n    expect(res.body.length).toBeGreaterThanOrEqual(4);\n    expect(res.body[0]).toHaveProperty('crm');\n    expect(res.body[0]).toHaveProperty('especialidadeNome');\n  });\n\n  /**\n   * @caso CT-API-016\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF04.1, RN07, RN08\n   * @objetivo Cadastrar médico quando autenticado como RECEPCAO\n   * @resultadoEsperado Status 201 com dados do médico cadastrado\n   */\n  test('POST /api/medicos - recepção cadastra novo médico com CRM e duração', async () => {\n    const res = await request(app)\n      .post('/api/medicos')\n      .set('Authorization', `Bearer ${tokenRecepcao}`)\n      .send({\n        nome: 'Dr. Fernando Dias',\n        email: 'fernando.dias@clinica.com',\n        senha: 'Senha123',\n        crm: '887766/SP',\n        especialidadeId: 1,\n        duracaoConsultaMin: 30,\n      });\n\n    expect(res.status).toBe(201);\n    expect(res.body.crm).toBe('887766/SP');\n    expect(res.body.duracaoConsultaMin).toBe(30);\n  });\n\n  /**\n   * @caso CT-API-017\n   * @nivel api\n   * @atributo seguranca\n   * @subatributo confidencialidade\n   * @requisito RF04.1, RN30\n   * @objetivo Proibir paciente ou médico de cadastrar médicos\n   * @resultadoEsperado Status 403 com erro.codigo = SEM_PERMISSAO\n   */\n  test('POST /api/medicos - paciente recebe 403 ao tentar cadastrar médico', async () => {\n    const res = await request(app)\n      .post('/api/medicos')\n      .set('Authorization', `Bearer ${tokenPaciente}`)\n      .send({\n        nome: 'Dr. Inválido',\n        email: 'invalido@clinica.com',\n        senha: 'Senha123',\n        crm: '123123/SP',\n        especialidadeId: 1,\n      });\n\n    expect(res.status).toBe(403);\n    expect(res.body.erro.codigo).toBe('SEM_PERMISSAO');\n  });\n\n  /**\n   * @caso CT-API-018\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF05.1\n   * @objetivo Obter a grade de disponibilidade do médico\n   * @resultadoEsperado Status 200 com array de blocos semanais\n   */\n  test('GET /api/medicos/:id/disponibilidades - retorna blocos de disponibilidade', async () => {\n    const res = await request(app)\n      .get('/api/medicos/1/disponibilidades')\n      .set('Authorization', `Bearer ${tokenPaciente}`);\n\n    expect(res.status).toBe(200);\n    expect(Array.isArray(res.body)).toBe(true);\n    expect(res.body[0]).toHaveProperty('diaSemana');\n  });\n\n  /**\n   * @caso CT-API-019\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF05.1, RF05.2\n   * @objetivo Atualizar grade de disponibilidade pelo médico dono\n   * @resultadoEsperado Status 200 com os novos blocos salvos\n   */\n  test('PUT /api/medicos/:id/disponibilidades - médico dono atualiza grade', async () => {\n    const novaGrade = [\n      { diaSemana: 1, horaInicio: '08:00', horaFim: '12:00' },\n      { diaSemana: 2, horaInicio: '14:00', horaFim: '18:00' },\n    ];\n\n    const res = await request(app)\n      .put('/api/medicos/1/disponibilidades')\n      .set('Authorization', `Bearer ${tokenMedico1}`)\n      .send({ blocos: novaGrade });\n\n    expect(res.status).toBe(200);\n    expect(res.body).toHaveLength(2);\n  });\n\n  /**\n   * @caso CT-API-020\n   * @nivel api\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RF05.1, RN30\n   * @objetivo Impedir médico de alterar grade de outro médico\n   * @resultadoEsperado Status 403 SEM_PERMISSAO\n   */\n  test('PUT /api/medicos/:id/disponibilidades - médico recebe 403 ao tentar alterar grade alheia', async () => {\n    const res = await request(app)\n      .put('/api/medicos/2/disponibilidades')\n      .set('Authorization', `Bearer ${tokenMedico1}`) // Médico 1 tentando alterar Médico 2\n      .send({ blocos: [{ diaSemana: 1, horaInicio: '08:00', horaFim: '12:00' }] });\n\n    expect(res.status).toBe(403);\n    expect(res.body.erro.codigo).toBe('SEM_PERMISSAO');\n  });\n\n  /**\n   * @caso CT-API-021\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF06.1, RN12\n   * @objetivo Criar bloqueio de agenda por médico dono\n   * @resultadoEsperado Status 201 com dados do bloqueio cadastrado\n   */\n  test('POST /api/medicos/:id/bloqueios - médico cria bloqueio de agenda', async () => {\n    const res = await request(app)\n      .post('/api/medicos/1/bloqueios')\n      .set('Authorization', `Bearer ${tokenMedico1}`)\n      .send({\n        dataInicio: '2026-11-10',\n        dataFim: '2026-11-12',\n        motivo: 'Curso de atualização',\n      });\n\n    expect(res.status).toBe(201);\n    expect(res.body.motivo).toBe('Curso de atualização');\n  });\n\n  /**\n   * @caso CT-API-022\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN12, RNF04\n   * @objetivo Rejeitar bloqueio onde data final é anterior à data inicial\n   * @resultadoEsperado Status 400 VALIDACAO\n   */\n  test('POST /api/medicos/:id/bloqueios - retorna 400 se data fim for anterior a data inicio', async () => {\n    const res = await request(app)\n      .post('/api/medicos/1/bloqueios')\n      .set('Authorization', `Bearer ${tokenMedico1}`)\n      .send({\n        dataInicio: '2026-11-15',\n        dataFim: '2026-11-10',\n      });\n\n    expect(res.status).toBe(400);\n    expect(res.body.erro.codigo).toBe('VALIDACAO');\n  });\n\n  /**\n   * @caso CT-API-023\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF06.2\n   * @objetivo Excluir bloqueio existente via DELETE /api/medicos/:id/bloqueios/:bloqueioId\n   * @resultadoEsperado Status 204 No Content\n   */\n  test('DELETE /api/medicos/:id/bloqueios/:bloqueioId - médico remove bloqueio', async () => {\n    // Cria bloqueio\n    const criaRes = await request(app)\n      .post('/api/medicos/1/bloqueios')\n      .set('Authorization', `Bearer ${tokenMedico1}`)\n      .send({ dataInicio: '2026-12-01', dataFim: '2026-12-05', motivo: 'Viagem' });\n\n    const res = await request(app)\n      .delete(`/api/medicos/1/bloqueios/${criaRes.body.id}`)\n      .set('Authorization', `Bearer ${tokenMedico1}`);\n\n    expect(res.status).toBe(204);\n  });\n\n  /**\n   * @caso CT-API-024\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF07.1, RN14, RN16\n   * @objetivo Consultar horários livres de um médico para determinada data\n   * @resultadoEsperado Status 200 com array de strings 'AAAA-MM-DD HH:mm'\n   */\n  test('GET /api/medicos/:id/horarios - retorna lista de horários livres', async () => {\n    const res = await request(app)\n      .get('/api/medicos/1/horarios?data=2026-10-20')\n      .set('Authorization', `Bearer ${tokenPaciente}`);\n\n    expect(res.status).toBe(200);\n    expect(res.body).toHaveProperty('horarios');\n    expect(Array.isArray(res.body.horarios)).toBe(true);\n    expect(res.body.horarios.length).toBeGreaterThan(0);\n  });\n});\n"},"backend/__testes__/integracao/auth-service.test.js":{"tests":[{"id":"128","name":"Integração: AuthService deve autenticar usuário com credenciais corretas","location":{"start":{"column":4,"line":40}}},{"id":"129","name":"Integração: AuthService não deve expor hash da senha no retorno do login","location":{"start":{"column":4,"line":57}}},{"id":"130","name":"Integração: AuthService deve bloquear a conta por 15 minutos na 5ª tentativa de senha errada","location":{"start":{"column":4,"line":72}}},{"id":"131","name":"Integração: AuthService deve recusar senha correta durante o período de bloqueio","location":{"start":{"column":4,"line":93}}},{"id":"132","name":"Integração: AuthService deve desbloquear a conta e permitir login após decorridos 15 minutos","location":{"start":{"column":4,"line":113}}},{"id":"133","name":"Integração: AuthService deve zerar contador de falhas após login bem-sucedido","location":{"start":{"column":4,"line":133}}},{"id":"134","name":"Integração: AuthService deve rejeitar login de usuário marcado como inativo","location":{"start":{"column":4,"line":156}}},{"id":"135","name":"Integração: AuthService deve validar token JWT válido gerado pelo sistema","location":{"start":{"column":4,"line":172}}},{"id":"136","name":"Integração: AuthService deve rejeitar token com assinatura violada","location":{"start":{"column":4,"line":188}}}],"source":"const { abrirBanco } = require('../../src/db/connection');\nconst { criarServicos } = require('../../src/services');\nconst clock = require('../../src/utils/clock');\nconst { somarMinutos } = require('../../src/utils/datas');\n\ndescribe('Integração: AuthService', () => {\n  let db;\n  let servicos;\n  const agoraFixo = new Date('2026-10-19T08:00:00');\n\n  beforeEach(() => {\n    clock.definirAgora(agoraFixo);\n    db = abrirBanco(':memory:');\n    servicos = criarServicos(db);\n\n    // Cria usuário de teste com hash\n    servicos.repos.usuarios.inserir({\n      nome: 'Teste Auth',\n      email: 'teste@auth.com',\n      senhaHash: servicos.authService.gerarHash('SenhaValida123'),\n      perfil: 'PACIENTE',\n      criadoEm: '2026-10-19 08:00',\n    });\n  });\n\n  afterEach(() => {\n    clock.definirAgora(null);\n    db.close();\n  });\n\n  /**\n   * @caso CT-INT-001\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RF01.1, RNF02\n   * @objetivo Autenticar usuário com e-mail e senha corretos e gerar JWT\n   * @resultadoEsperado Retorna token JWT válido e perfil público do usuário\n   */\n  test('deve autenticar usuário com credenciais corretas', () => {\n    const resposta = servicos.authService.login('teste@auth.com', 'SenhaValida123');\n    expect(resposta).toHaveProperty('token');\n    expect(resposta.usuario.email).toBe('teste@auth.com');\n    expect(resposta.usuario.perfil).toBe('PACIENTE');\n    expect(resposta.usuario).not.toHaveProperty('senhaHash');\n  });\n\n  /**\n   * @caso CT-INT-002\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo confidencialidade\n   * @requisito RNF01\n   * @objetivo Garantir que a senha nunca é exposta no perfil público ou retorno\n   * @resultadoEsperado Propriedades de senha ou hash estão ausentes no objeto do usuário\n   */\n  test('não deve expor hash da senha no retorno do login', () => {\n    const { usuario } = servicos.authService.login('teste@auth.com', 'SenhaValida123');\n    expect(usuario.senha).toBeUndefined();\n    expect(usuario.senhaHash).toBeUndefined();\n  });\n\n  /**\n   * @caso CT-INT-003\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RN04\n   * @objetivo Bloquear conta por 15 minutos após 5 tentativas de login consecutivas incorretas\n   * @resultadoEsperado Lança erro CONTA_BLOQUEADA na 5ª tentativa e persiste bloqueadoAte\n   */\n  test('deve bloquear a conta por 15 minutos na 5ª tentativa de senha errada', () => {\n    for (let i = 1; i <"+"= 4; i++) {\n      expect(() => servicos.authService.login('teste@auth.com', 'SenhaErrada')).toThrow(/E-mail ou senha inválidos/i);\n    }\n\n    // 5ª tentativa\n    expect(() => servicos.authService.login('teste@auth.com', 'SenhaErrada')).toThrow(/Conta bloqueada por excesso de tentativas/i);\n\n    const usuarioDb = servicos.repos.usuarios.buscarPorEmail('teste@auth.com');\n    expect(usuarioDb.bloqueadoAte).toBeTruthy();\n  });\n\n  /**\n   * @caso CT-INT-004\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RN04\n   * @objetivo Recusar até a senha correta enquanto a conta estiver dentro da janela de bloqueio\n   * @resultadoEsperado Lança erro CONTA_BLOQUEADA mesmo informando a senha correta\n   */\n  test('deve recusar senha correta durante o período de bloqueio', () => {\n    // Força 5 falhas\n    for (let i = 1; i <"+"= 5; i++) {\n      try { servicos.authService.login('teste@auth.com', 'SenhaErrada'); } catch {}\n    }\n\n    // Tenta senha correta 5 minutos após o bloqueio\n    clock.definirAgora(somarMinutos(agoraFixo, 5));\n    expect(() => servicos.authService.login('teste@auth.com', 'SenhaValida123')).toThrow(/Conta bloqueada por excesso de tentativas/i);\n  });\n\n  /**\n   * @caso CT-INT-005\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RN04\n   * @objetivo Permitir login após expirar o prazo de 15 minutos do bloqueio\n   * @resultadoEsperado Login aceito após 16 minutos com senha correta\n   */\n  test('deve desbloquear a conta e permitir login após decorridos 15 minutos', () => {\n    for (let i = 1; i <"+"= 5; i++) {\n      try { servicos.authService.login('teste@auth.com', 'SenhaErrada'); } catch {}\n    }\n\n    // Avança 16 minutos\n    clock.definirAgora(somarMinutos(agoraFixo, 16));\n    const resposta = servicos.authService.login('teste@auth.com', 'SenhaValida123');\n    expect(resposta.token).toBeTruthy();\n  });\n\n  /**\n   * @caso CT-INT-006\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RN04\n   * @objetivo Zerar o contador de falhas quando um login é realizado com sucesso\n   * @resultadoEsperado tentativasFalhas é resetado para 0 no banco\n   */\n  test('deve zerar contador de falhas após login bem-sucedido', () => {\n    // 2 tentativas falhas\n    try { servicos.authService.login('teste@auth.com', 'SenhaErrada'); } catch {}\n    try { servicos.authService.login('teste@auth.com', 'SenhaErrada'); } catch {}\n\n    let usuarioDb = servicos.repos.usuarios.buscarPorEmail('teste@auth.com');\n    expect(usuarioDb.tentativasFalhas).toBe(2);\n\n    // Login correto\n    servicos.authService.login('teste@auth.com', 'SenhaValida123');\n    usuarioDb = servicos.repos.usuarios.buscarPorEmail('teste@auth.com');\n    expect(usuarioDb.tentativasFalhas).toBe(0);\n  });\n\n  /**\n   * @caso CT-INT-007\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RN21\n   * @objetivo Bloquear autenticação de usuário inativo\n   * @resultadoEsperado Lança erro SEM_PERMISSAO informando conta inativa\n   */\n  test('deve rejeitar login de usuário marcado como inativo', () => {\n    const u = servicos.repos.usuarios.buscarPorEmail('teste@auth.com');\n    servicos.repos.usuarios.definirAtivo(u.id, false);\n\n    expect(() => servicos.authService.login('teste@auth.com', 'SenhaValida123')).toThrow(/Conta inativa/i);\n  });\n\n  /**\n   * @caso CT-INT-008\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RF01.2, RNF02\n   * @objetivo Validar e decodificar token JWT assinado\n   * @resultadoEsperado autenticar(token) retorna perfil do usuário correspondente\n   */\n  test('deve validar token JWT válido gerado pelo sistema', () => {\n    const { token } = servicos.authService.login('teste@auth.com', 'SenhaValida123');\n    const usuarioLogado = servicos.authService.autenticar(token);\n    expect(usuarioLogado.email).toBe('teste@auth.com');\n    expect(usuarioLogado.perfil).toBe('PACIENTE');\n  });\n\n  /**\n   * @caso CT-INT-009\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo integridade\n   * @requisito RF01.2, RNF02\n   * @objetivo Rejeitar token JWT adulterado ou com assinatura inválida\n   * @resultadoEsperado Lança erro NAO_AUTENTICADO\n   */\n  test('deve rejeitar token com assinatura violada', () => {\n    const tokenInvalido = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.invalidPayload.invalidSignature';\n    expect(() => servicos.authService.autenticar(tokenInvalido)).toThrow(/Token inválido ou expirado/i);\n  });\n});\n"},"backend/__testes__/api/auth-api.test.js":{"tests":[{"id":"137","name":"API: Autenticação (/api/auth) POST /api/auth/login - deve realizar login com sucesso","location":{"start":{"column":4,"line":33}}},{"id":"138","name":"API: Autenticação (/api/auth) POST /api/auth/login - deve retornar 401 para senha incorreta","location":{"start":{"column":4,"line":54}}},{"id":"139","name":"API: Autenticação (/api/auth) POST /api/auth/login - deve responder 423 CONTA_BLOQUEADA na 5ª falha consecutiva","location":{"start":{"column":4,"line":73}}},{"id":"140","name":"API: Autenticação (/api/auth) POST /api/auth/login - deve responder 400 se e-mail ou senha não forem enviados","location":{"start":{"column":4,"line":92}}},{"id":"141","name":"API: Autenticação (/api/auth) POST /api/auth/registro - auto-cadastro de paciente retorna 201","location":{"start":{"column":9,"line":107}}},{"id":"142","name":"API: Autenticação (/api/auth) POST /api/auth/registro - retorna 409 ao registrar e-mail já existente","location":{"start":{"column":4,"line":134}}},{"id":"143","name":"API: Autenticação (/api/auth) GET /api/auth/me - deve retornar dados do perfil do usuário autenticado","location":{"start":{"column":4,"line":158}}},{"id":"144","name":"API: Autenticação (/api/auth) GET /api/auth/me - deve retornar 401 quando cabeçalho Authorization estiver ausente","location":{"start":{"column":4,"line":183}}},{"id":"145","name":"API: Autenticação (/api/auth) POST /api/auth/login - deve tratar JSON malformado retornando 400 sem stack trace","location":{"start":{"column":4,"line":198}}}],"source":"const request = require('supertest');\nconst { abrirBanco } = require('../../src/db/connection');\nconst { semear, SENHA_PADRAO } = require('../../src/db/seed');\nconst { criarApp } = require('../../src/app');\nconst clock = require('../../src/utils/clock');\n\ndescribe('API: Autenticação (/api/auth)', () => {\n  let db;\n  let app;\n  const agoraFixo = new Date('2026-10-19T08:00:00');\n\n  beforeEach(() => {\n    clock.definirAgora(agoraFixo);\n    db = abrirBanco(':memory:');\n    semear(db);\n    app = criarApp({ db });\n  });\n\n  afterEach(() => {\n    clock.definirAgora(null);\n    db.close();\n  });\n\n  /**\n   * @caso CT-API-001\n   * @nivel api\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RF01.1, RNF02\n   * @objetivo Fazer login com credenciais válidas e receber token JWT\n   * @resultadoEsperado Status 200 com token JWT e dados públicos do usuário\n   */\n  test('POST /api/auth/login - deve realizar login com sucesso', async () => {\n    const res = await request(app)\n      .post('/api/auth/login')\n      .send({ email: 'ana@email.com', senha: SENHA_PADRAO });\n\n    expect(res.status).toBe(200);\n    expect(res.body).toHaveProperty('token');\n    expect(res.body.usuario.email).toBe('ana@email.com');\n    expect(res.body.usuario.perfil).toBe('PACIENTE');\n    expect(res.body.usuario.pacienteId).toBeDefined();\n  });\n\n  /**\n   * @caso CT-API-002\n   * @nivel api\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RF01.1, RNF04\n   * @objetivo Recusar credenciais inválidas com status 401 e código de erro\n   * @resultadoEsperado Status 401 com erro.codigo = NAO_AUTENTICADO\n   */\n  test('POST /api/auth/login - deve retornar 401 para senha incorreta', async () => {\n    const res = await request(app)\n      .post('/api/auth/login')\n      .send({ email: 'ana@email.com', senha: 'SenhaIncorreta' });\n\n    expect(res.status).toBe(401);\n    expect(res.body.erro.codigo).toBe('NAO_AUTENTICADO');\n    expect(res.body.erro.mensagem).toBeDefined();\n  });\n\n  /**\n   * @caso CT-API-003\n   * @nivel api\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RN04, RNF04\n   * @objetivo Bloquear requisições com 423 após 5 falhas seguidas de login\n   * @resultadoEsperado Status 423 com erro.codigo = CONTA_BLOQUEADA\n   */\n  test('POST /api/auth/login - deve responder 423 CONTA_BLOQUEADA na 5ª falha consecutiva', async () => {\n    for (let i = 1; i <"+"= 4; i++) {\n      await request(app).post('/api/auth/login').send({ email: 'ana@email.com', senha: 'Errada' });\n    }\n\n    const res5 = await request(app).post('/api/auth/login').send({ email: 'ana@email.com', senha: 'Errada' });\n    expect(res5.status).toBe(423);\n    expect(res5.body.erro.codigo).toBe('CONTA_BLOQUEADA');\n  });\n\n  /**\n   * @caso CT-API-004\n   * @nivel api\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RF01.1, RNF04\n   * @objetivo Rejeitar requisição com campos obrigatórios ausentes\n   * @resultadoEsperado Status 400 com erro.codigo = VALIDACAO\n   */\n  test('POST /api/auth/login - deve responder 400 se e-mail ou senha não forem enviados', async () => {\n    const res = await request(app).post('/api/auth/login').send({});\n    expect(res.status).toBe(400);\n    expect(res.body.erro.codigo).toBe('VALIDACAO');\n  });\n\n  /**\n   * @caso CT-API-005\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF02.1, RF02.3\n   * @objetivo Registrar paciente por rota pública com sucesso\n   * @resultadoEsperado Status 201 com dados do paciente cadastrado\n   */\n  test.skip('POST /api/auth/registro - auto-cadastro de paciente retorna 201', async () => {\n    const res = await request(app)\n      .post('/api/auth/registro')\n      .send({\n        nome: 'Juliana Paes',\n        email: 'juliana@email.com',\n        senha: 'Senha123',\n        cpf: '730.825.290-77',\n        dataNascimento: '1985-06-20',\n        telefone: '(11) 99999-8888',\n      });\n\n    expect(res.status).toBe(201);\n    expect(res.body.id).toBeDefined();\n    expect(res.body.nome).toBe('Juliana Paes');\n    expect(res.body.cpf).toBe('73082529077');\n  });\n\n  /**\n   * @caso CT-API-006\n   * @nivel api\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN01, RNF04\n   * @objetivo Retornar 409 CONFLITO em caso de duplicidade de e-mail no registro\n   * @resultadoEsperado Status 409 com erro.codigo = CONFLITO\n   */\n  test('POST /api/auth/registro - retorna 409 ao registrar e-mail já existente', async () => {\n    const res = await request(app)\n      .post('/api/auth/registro')\n
