sholds":{"high":80,"low":60,"break":null},"testFiles":{"backend/__testes__/integracao/ciclo-vida-consultas.test.js":{"tests":[{"id":"0","name":"confirmação (RF09, RN25, RN30) paciente confirma consulta dentro das 48 horas","location":{"start":{"column":4,"line":49}}},{"id":"1","name":"confirmação (RF09, RN25, RN30) recusa confirmação antes da janela de 48 horas","location":{"start":{"column":4,"line":68}}},{"id":"2","name":"confirmação (RF09, RN25, RN30) médico não confirma consultas","location":{"start":{"column":4,"line":88}}},{"id":"3","name":"confirmação (RF09, RN25, RN30) paciente não confirma consulta alheia","location":{"start":{"column":4,"line":103}}},{"id":"4","name":"cancelamento (RF09, RN26, RN30) paciente cancela com 24 horas ou mais de antecedência","location":{"start":{"column":4,"line":120}}},{"id":"5","name":"cancelamento (RF09, RN26, RN30) paciente não cancela com menos de 24 horas","location":{"start":{"column":4,"line":140}}},{"id":"6","name":"cancelamento (RF09, RN26, RN30) recepção cancela registrando motivo e autor","location":{"start":{"column":4,"line":155}}},{"id":"7","name":"cancelamento (RF09, RN26, RN30) recepção sem motivo recebe erro e a consulta segue ativa","location":{"start":{"column":4,"line":171}}},{"id":"8","name":"cancelamento (RF09, RN26, RN30) não cancela consulta que já começou","location":{"start":{"column":4,"line":187}}},{"id":"9","name":"remarcação (RF09, RN27, RN30) paciente remarca e a consulta volta a AGENDADA","location":{"start":{"column":4,"line":208}}},{"id":"10","name":"remarcação (RF09, RN27, RN30) remarcação para fora da janela de retorno cobra novamente","location":{"start":{"column":4,"line":225}}},{"id":"11","name":"remarcação (RF09, RN27, RN30) recusa a terceira remarcação","location":{"start":{"column":4,"line":251}}},{"id":"12","name":"remarcação (RF09, RN27, RN30) recusa remarcação a menos de 24 horas","location":{"start":{"column":4,"line":268}}},{"id":"13","name":"remarcação (RF09, RN27, RN30) não remarca consulta cancelada","location":{"start":{"column":4,"line":288}}},{"id":"14","name":"remarcação (RF09, RN27, RN30) médico não remarca consultas","location":{"start":{"column":4,"line":303}}},{"id":"15","name":"atendimento e falta (RF09, RN28, RN29, RN30) médico registra atendimento com observações","location":{"start":{"column":4,"line":320}}},{"id":"16","name":"atendimento e falta (RF09, RN28, RN29, RN30) não realiza consulta futura","location":{"start":{"column":4,"line":337}}},{"id":"17","name":"atendimento e falta (RF09, RN28, RN29, RN30) outro médico não registra o atendimento","location":{"start":{"column":4,"line":352}}},{"id":"18","name":"falta do paciente (RN29, RN30) recepção registra falta após a tolerância","location":{"start":{"column":4,"line":373}}},{"id":"19","name":"falta do paciente (RN29, RN30) não registra falta antes de 15 minutos do início","location":{"start":{"column":4,"line":391}}},{"id":"20","name":"falta do paciente (RN29, RN30) paciente não registra a própria falta","location":{"start":{"column":4,"line":409}}},{"id":"21","name":"listagem e acesso individual (RF10, RN30) paciente lista somente as próprias consultas","location":{"start":{"column":4,"line":427}}},{"id":"22","name":"listagem e acesso individual (RF10, RN30) médico lista somente as próprias consultas","location":{"start":{"column":4,"line":442}}},{"id":"23","name":"listagem e acesso individual (RF10, RN30) recepção filtra por status cancelada","location":{"start":{"column":4,"line":457}}},{"id":"24","name":"listagem e acesso individual (RF10, RN30) recepção filtra por período","location":{"start":{"column":4,"line":472}}},{"id":"25","name":"listagem e acesso individual (RF10, RN30) recusa status de filtro inválido","location":{"start":{"column":4,"line":487}}},{"id":"26","name":"listagem e acesso individual (RF10, RN30) paciente não acessa consulta alheia por id","location":{"start":{"column":4,"line":502}}}],"source":"// Testes de integração do ciclo de vida da consulta (RF09, RF10, RN25–RN30).\nconst clock = require('../../src/utils/clock');\nconst { abrirBanco } = require('../../src/db/connection');\nconst { semear } = require('../../src/db/seed');\nconst { criarServicos } = require('../../src/services');\n\nlet db, servicos, medicos, pacientes, rafael;\nlet cardioId, cgId, pediatriaId, passadaId;\nconst recepcao = { perfil: 'RECEPCAO' };\nconst pacienteAtor = (id) => ({ perfil: 'PACIENTE', pacienteId: id });\nconst medicoAtor = (id) => ({ perfil: 'MEDICO', medicoId: id });\nconst capturar = (acao) => { try { return acao(); } catch (erro) { return erro; } };\n\nbeforeAll(() => {\n  clock.definirAgora(new Date(2026, 9, 19, 8, 0)); // 2026-10-19 08:00, segunda-feira\n  db = abrirBanco(':memory:');\n  ({ medicos, pacientes } = semear(db));\n  servicos = criarServicos(db);\n  rafael = servicos.cadastroService.registrarPaciente({\n    nome: 'Rafael Nunes', email: 'rafael@email.com', cpf: '168.995.350-09',\n    dataNascimento: '1975-06-20', telefone: '(11) 95555-2020', senha: 'Senha123',\n  });\n});\n\nafterAll(() => {\n  clock.definirAgora(null);\n  db.close();\n});\n\n// Consulta gravada direto no repositório, para estados passados que o fluxo normal não cria com o relógio congelado.\nfunction inserirDireta({ pacienteId, medicoId, inicio, fim, status }) {\n  const id = servicos.repos.consultas.inserir({\n    pacienteId, medicoId, inicio, fim, valorCentavos: 15000, retornoDe: null, agora: '2026-10-19 08:00',\n  });\n  if (status && status !== 'AGENDADA') servicos.repos.consultas.atualizarStatus(id, status, '2026-10-19 08:00');\n  return id;\n}\n\ndescribe('confirmação (RF09, RN25, RN30)', () => {\n  /**\n   * @caso CT-INT-053\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF09.1, RN25\n   * @objetivo Confirmar consulta agendada pelo próprio paciente dentro das 48 horas\n   * @resultadoEsperado consulta sai de AGENDADA para CONFIRMADA com o horário de atualização preenchido\n   */\n  test('paciente confirma consulta dentro das 48 horas', () => {\n    const consulta = servicos.consultasService.agendar(recepcao, {\n      pacienteId: rafael.id, medicoId: medicos[1].id, inicio: '2026-10-19 10:30',\n    });\n    cardioId = consulta.id;\n    const confirmada = servicos.consultasService.confirmar(pacienteAtor(rafael.id), cardioId);\n    expect(confirmada.status).toBe('CONFIRMADA');\n    expect(confirmada.atualizadoEm).toBe('2026-10-19 08:00');\n  });\n\n  /**\n   * @caso CT-INT-054\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN25\n   * @objetivo Recusar confirmação fora da janela de 48 horas\n   * @resultadoEsperado confirmar consulta de 9 dias depois lança REGRA_NEGOCIO (422) e o status segue AGENDADA\n   */\n  test('recusa confirmação antes da janela de 48 horas', () => {\n    const consulta = servicos.consultasService.agendar(recepcao, {\n      pacienteId: rafael.id, medicoId: medicos[0].id, inicio: '2026-10-28 08:00',\n    });\n    cgId = consulta.id;\n    const erro = capturar(() => servicos.consultasService.confirmar(pacienteAtor(rafael.id), cgId));\n    expect(erro.status).toBe(422);\n    expect(erro.message).toBe('A confirmação só é permitida nas 48 horas anteriores à consulta.');\n    expect(servicos.repos.consultas.buscarPorId(cgId).status).toBe('AGENDADA');\n  });\n\n  /**\n   * @caso CT-INT-055\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RN25, RN30\n   * @objetivo Impedir que o médico confirme consultas, papel do paciente e da recepção\n   * @resultadoEsperado confirmar com ator médico lança SEM_PERMISSAO (403)\n   */\n  test('médico não confirma consultas', () => {\n    const erro = capturar(() => servicos.consultasService.confirmar(medicoAtor(medicos[0].id), cgId));\n    expect(erro.status).toBe(403);\n    expect(erro.message).toBe('Somente o paciente da consulta ou a recepção podem confirmar.');\n  });\n\n  /**\n   * @caso CT-INT-056\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo confidencialidade\n   * @requisito RN25, RN30\n   * @objetivo Impedir que um paciente confirme consulta de outro paciente\n   * @resultadoEsperado confirmar com paciente não dono lança SEM_PERMISSAO (403)\n   */\n  test('paciente não confirma consulta alheia', () => {\n    const erro = capturar(() => servicos.consultasService.confirmar(pacienteAtor(pacientes[0].id), cgId));\n    expect(erro.status).toBe(403);\n    expect(erro.codigo).toBe('SEM_PERMISSAO');\n  });\n});\n\ndescribe('cancelamento (RF09, RN26, RN30)', () => {\n  /**\n   * @caso CT-INT-057\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF09.2, RN26\n   * @objetivo Permitir o cancelamento pelo paciente com 24 horas ou mais de antecedência\n   * @resultadoEsperado consulta fica CANCELADA com canceladoPor 'PACIENTE' e sem motivo obrigatório\n   */\n  test('paciente cancela com 24 horas ou mais de antecedência', () => {\n    const consulta = servicos.consultasService.agendar(recepcao, {\n      pacienteId: rafael.id, medicoId: medicos[3].id, inicio: '2026-10-21 07:00',\n    });\n    pediatriaId = consulta.id;\n    const cancelada = servicos.consultasService.cancelar(pacienteAtor(rafael.id), pediatriaId);\n    expect(cancelada.status).toBe('CANCELADA');\n    expect(cancelada.canceladoPor).toBe('PACIENTE');\n    expect(cancelada.motivoCancelamento).toBeNull();\n  });\n\n  /**\n   * @caso CT-INT-058\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN26\n   * @objetivo Recusar cancelamento do paciente com menos de 24 horas\n   * @resultadoEsperado cancelar lança REGRA_NEGOCIO (422) orientando a procurar a recepção\n   */\n  test('paciente não cancela com menos de 24 horas', () => {\n    const erro = capturar(() => servicos.consultasService.cancelar(pacienteAtor(rafael.id), cardioId));\n    expect(erro.status).toBe(422);\n    expect(erro.message).toBe('O paciente só pode cancelar com no mínimo 24 horas de antecedência. Procure a recepção.');\n  });\n\n  /**\n   * @caso CT-INT-059\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RF09.2, RN26\n   * @objetivo Registrar o motivo e o autor quando a recepção cancela\n   * @resultadoEsperado consulta CANCELADA com canceladoPor 'RECEPCAO' e o motivo informado gravado\n   */\n  test('recepção cancela registrando motivo e autor', () => {\n    const cancelada = servicos.consultasService.cancelar(recepcao, cardioId, { motivo: 'Paciente solicitou por telefone' });\n    expect(cancelada.status).toBe('CANCELADA');\n    expect(cancelada.canceladoPor).toBe('RECEPCAO');\n    expect(cancelada.motivoCancelamento).toBe('Paciente solicitou por telefone');\n  });\n\n  /**\n   * @caso CT-INT-060\n   * @nivel integracao\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN26\n   * @objetivo Exigir motivo no cancelamento feito pela recepção\n   * @resultadoEsperado cancelar sem motivo lança REGRA_NEGOCIO (422) e a consulta segue ativa\n   */\n  test('recepção sem motivo recebe erro e a consulta segue ativa', () => {\n    const erro = capturar(() => servicos.consultasService.cancelar(recepcao, cgId));\n    expect(erro.status).toBe(422);\n    expect(erro.message).toBe('Informe o motivo do cancelamento.');\n    expect(servicos.repos.consultas.buscarPorId(cgId).status).toBe('AGENDADA');\n  });\n\n  /**\n   * @caso CT-INT-061\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN26\n   * @objetivo Impedir cancelamento de consulta cujo horário já passou\n   * @resultadoEsperado cancelar lança REGRA_NEGOCIO (422) de consulta já começada\n   */\n  test('não cancela consulta que já começou', () => {\n    passadaId = inserirDireta({\n      pacienteId: rafael.id, medicoId: medicos[0].id,\n      inicio: '2026-10-16 08:00', fim: '2026-10-16 08:30',\n    });\n    const erro = capturar(() => servicos.consultasService.cancelar(recepcao, passadaId, { motivo: 'Após o horário' }));\n    expect(erro.status).toBe(422);\n    expect(erro.message).toBe('A consulta já começou e não pode ser cancelada.');\n  });\n});\n\ndescribe('remarcação (RF09, RN27, RN30)', () => {\n  /**\n   * @caso CT-INT-062\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF09.3, RN27\n   * @objetivo Remarcar a consulta pelo paciente voltando ao status AGENDADA\n   * @resultadoEsperado nova data gravada, remarcacoes incrementado para 1 e valor recalculado\n   */\n  test('paciente remarca e a consulta volta a AGENDADA', () => {\n    const remarcada = servicos.consultasService.remarcar(pacienteAtor(rafael.id), cgId, { inicio: '2026-10-29 08:00' });\n    expect(remarcada.status).toBe('AGENDADA');\n    expect(remarcada.inicio).toBe('2026-10-29 08:00');\n    expect(remarcada.remarcacoes).toBe(1);\n    expect(remarcada.valorCentavos).toBe(15000);\n  });\n\n  /**\n   * @caso CT-INT-063\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN27, RN24\n   * @objetivo Recalcular o valor na remarcação, perdendo a gratuidade do retorno fora da janela\n   * @resultadoEsperado retorno de 2026-10-23 remarcado para 2026-11-10 passa a custar 15000 com retornoDe nulo\n   */\n  test('remarcação para fora da janela de retorno cobra novamente', () => {\n    const origem = inserirDireta({\n      pacienteId: pacientes[0].id, medicoId: medicos[0].id,\n      inicio: '2026-10-10 08:00', fim: '2026-10-10 08:30', status: 'REALIZADA',\n    });\n    const retorno = servicos.consultasService.agendar(recepcao, {\n      pacienteId: pacientes[0].id, medicoId: medicos[0].id, inicio: '2026-10-23 08:00',\n    });\n    expect(retorno.valorCentavos).toBe(0);\n    expect(retorno.retornoDe).toBe(origem);\n    const remarcada = servicos.consultasService.remarcar(recepcao, retorno.id, { inicio: '2026-11-10 08:00' });\n    expect(remarcada.status).toBe('AGENDADA');\n    expect(remarcada.remarcacoes).toBe(1);\n    expect(remarcada.valorCentavos).toBe(15000);\n    expect(remarcada.retornoDe).toBeNull();\n  });\n\n  /**\n   * @caso CT-INT-064\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN27\n   * @objetivo Bloquear a terceira remarcação da mesma consulta\n   * @resultadoEsperado segunda remarcação aceita (remarcacoes 2) e a terceira lança REGRA_NEGOCIO (422)\n   */\n  test('recusa a terceira remarcação', () => {\n    const segunda = servicos.consultasService.remarcar(recepcao, cgId, { inicio: '2026-11-03 08:00' });\n    expect(segunda.remarcacoes).toBe(2);\n    const erro = capturar(() => servicos.consultasService.remarcar(recepcao, cgId, { inicio: '2026-11-04 08:00' }));\n    expect(erro.status).toBe(422);\n    expect(erro.message).toBe('Esta consulta já atingiu o limite de 2 remarcações.');\n  });\n\n  /**\n   * @caso CT-INT-065\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN27\n   * @objetivo Recusar remarcação a menos de 24 horas do início\n   * @resultadoEsperado remarcar lança REGRA_NEGOCIO (422) com a mensagem do prazo\n   */\n  test('recusa remarcação a menos de 24 horas', () => {\n    const consulta = servicos.consultasService.agendar(recepcao, {\n      pacienteId: rafael.id, medicoId: medicos[1].id, inicio: '2026-10-19 11:15',\n    });\n    const erro = capturar(() => servicos.consultasService.remarcar(pacienteAtor(rafael.id), consulta.id, {\n      inicio: '2026-10-20 11:15',\n    }));\n    expect(erro.status).toBe(422);\n    expect(erro.message).toBe('A remarcação só é permitida até 24 horas antes da consulta.');\n  });\n\n  /**\n   * @caso CT-INT-066\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN27\n   * @objetivo Impedir remarcação de consulta cancelada\n   * @resultadoEsperado remarcar lança REGRA_NEGOCIO (422) de status não remarcável\n   */\n  test('não remarca consulta cancelada', () => {\n    const erro = capturar(() => servicos.consultasService.remarcar(recepcao, cardioId, { inicio: '2026-10-21 10:30' }));\n    expect(erro.status).toBe(422);\n    expect(erro.message).toBe('Somente consultas agendadas ou confirmadas podem ser remarcadas.');\n  });\n\n  /**\n   * @caso CT-INT-067\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RN27, RN30\n   * @objetivo Impedir que o médico remarque consultas\n   * @resultadoEsperado remarcar com ator médico lança SEM_PERMISSAO (403)\n   */\n  test('médico não remarca consultas', () => {\n    const erro = capturar(() => servicos.consultasService.remarcar(medicoAtor(medicos[0].id), cgId, { inicio: '2026-11-05 08:00' }));\n    expect(erro.status).toBe(403);\n    expect(erro.message).toBe('Somente o paciente da consulta ou a recepção podem remarcar.');\n  });\n});\n\ndescribe('atendimento e falta (RF09, RN28, RN29, RN30)', () => {\n  /**\n   * @caso CT-INT-068\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF09.4, RN28\n   * @objetivo Registrar o atendimento pelo médico dono a partir do horário da consulta\n   * @resultadoEsperado consulta fica REALIZADA com as observações informadas gravadas\n   */\n  test('médico registra atendimento com observações', () => {\n    const realizada = servicos.consultasService.registrarRealizada(medicoAtor(medicos[0].id), passadaId, {\n      observacoes: 'Paciente saudável.',\n    });\n    expect(realizada.status).toBe('REALIZADA');\n    expect(realizada.observacoes).toBe('Paciente saudável.');\n  });\n\n  /**\n   * @caso CT-INT-069\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN28\n   * @objetivo Recusar registro de atendimento antes do horário da consulta\n   * @resultadoEsperado registrarRealizada lança REGRA_NEGOCIO (422)\n   */\n  test('não realiza consulta futura', () => {\n    const erro = capturar(() => servicos.consultasService.registrarRealizada(medicoAtor(medicos[0].id), cgId, {}));\n    expect(erro.status).toBe(422);\n    expect(erro.message).toBe('O atendimento só pode ser registrado a partir do horário da consulta.');\n  });\n\n  /**\n   * @caso CT-INT-070\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RN28, RN30\n   * @objetivo Impedir que outro médico registre atendimento na consulta alheia\n   * @resultadoEsperado registrarRealizada por médico não dono lança SEM_PERMISSAO (403)\n   */\n  test('outro médico não registra o atendimento', () => {\n    const id = inserirDireta({\n      pacienteId: rafael.id, medicoId: medicos[0].id,\n      inicio: '2026-10-16 09:00', fim: '2026-10-16 09:30',\n    });\n    const erro = capturar(() => servicos.consultasService.registrarRealizada(medicoAtor(medicos[1].id), id, {}));\n    expect(erro.status).toBe(403);\n    expect(erro.message).toBe('Somente o médico da consulta pode registrar o atendimento.');\n  });\n});\n\ndescribe('falta do paciente (RN29, RN30)', () => {\n  /**\n   * @caso CT-INT-071\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN29\n   * @objetivo Registrar falta após a tolerância de 15 minutos do início\n   * @resultadoEsperado consulta passada fica com status FALTA ao registrar pela recepção\n   */\n  test('recepção registra falta após a tolerância', () => {\n    const id = inserirDireta({\n      pacienteId: pacientes[2].id, medicoId: medicos[3].id,\n      inicio: '2026-10-16 07:00', fim: '2026-10-16 07:15',\n    });\n    const falta = servicos.consultasService.registrarFalta(recepcao, id);\n    expect(falta.status).toBe('FALTA');\n  });\n\n  /**\n   * @caso CT-INT-072\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN29\n   * @objetivo Recusar registro de falta dentro da tolerância de 15 minutos\n   * @resultadoEsperado registrarFalta em consulta futura lança REGRA_NEGOCIO (422)\n   */\n  test('não registra falta antes de 15 minutos do início', () => {\n    const consulta = servicos.consultasService.agendar(recepcao, {\n      pacienteId: pacientes[2].id, medicoId: medicos[3].id, inicio: '2026-10-20 07:00',\n    });\n    const erro = capturar(() => servicos.consultasService.registrarFalta(medicoAtor(medicos[3].id), consulta.id));\n    expect(erro.status).toBe(422);\n    expect(erro.message).toBe('A falta só pode ser registrada 15 minutos após o início da consulta.');\n  });\n\n  /**\n   * @caso CT-INT-073\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RN29, RN30\n   * @objetivo Impedir o próprio paciente de registrar a própria falta\n   * @resultadoEsperado registrarFalta com ator paciente lança SEM_PERMISSAO (403)\n   */\n  test('paciente não registra a própria falta', () => {\n    const consulta = servicos.repos.consultas.listar({ pacienteId: pacientes[2].id, status: 'AGENDADA' })[0];\n    const erro = capturar(() => servicos.consultasService.registrarFalta(pacienteAtor(pacientes[2].id), consulta.id));\n    expect(erro.status).toBe(403);\n    expect(erro.message).toBe('Somente o médico da consulta ou a recepção podem registrar falta.');\n  });\n});\n\ndescribe('listagem e acesso individual (RF10, RN30)', () => {\n  /**\n   * @caso CT-INT-074\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo confidencialidade\n   * @requisito RF10.1, RN30\n   * @objetivo Restringir a listagem do paciente às próprias consultas\n   * @resultadoEsperado listar do paciente traz só consultas com o seu pacienteId\n   */\n  test('paciente lista somente as próprias consultas', () => {\n    const lista = servicos.consultasService.listar(pacienteAtor(pacientes[0].id));\n    expect(lista).toHaveLength(2);\n    expect(lista.every((c) => c.pacienteId === pacientes[0].id)).toBe(true);\n  });\n\n  /**\n   * @caso CT-INT-075\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo confidencialidade\n   * @requisito RF10.2, RN30\n   * @objetivo Restringir a listagem do médico às próprias consultas\n   * @resultadoEsperado listar do médico traz só consultas com o seu medicoId\n   */\n  test('médico lista somente as próprias consultas', () => {\n    const lista = servicos.consultasService.listar(medicoAtor(medicos[0].id));\n    expect(lista.length).toBeGreaterThanOrEqual(5);\n    expect(lista.every((c) => c.medicoId === medicos[0].id)).toBe(true);\n  });\n\n  /**\n   * @caso CT-INT-076\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RF10.3\n   * @objetivo Filtrar consultas por status na visão da recepção\n   * @resultadoEsperado listar com status CANCELADA traz apenas as 2 consultas canceladas do arquivo\n   */\n  test('recepção filtra por status cancelada', () => {\n    const lista = servicos.consultasService.listar(recepcao, { status: 'CANCELADA' });\n    expect(lista).toHaveLength(2);\n    expect(lista.every((c) => c.status === 'CANCELADA')).toBe(true);\n  });\n\n  /**\n   * @caso CT-INT-077\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RF10.3\n   * @objetivo Filtrar consultas por período na visão da recepção\n   * @resultadoEsperado listar entre 2026-10-20 e 2026-10-31 traz apenas consultas dentro do período\n   */\n  test('recepção filtra por período', () => {\n    const lista = servicos.consultasService.listar(recepcao, { dataInicio: '2026-10-20', dataFim: '2026-10-31' });\n    expect(lista).toHaveLength(2);\n    expect(lista.every((c) => c.inicio >= '2026-10-20 00:00' && c.inicio <"+"= '2026-10-31 23:59')).toBe(true);\n  });\n\n  /**\n   * @caso CT-INT-078\n   * @nivel integracao\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RF10.2\n   * @objetivo Recusar filtro de status desconhecido\n   * @resultadoEsperado listar lança VALIDACAO (400) com 'Status inválido.'\n   */\n  test('recusa status de filtro inválido', () => {\n    const erro = capturar(() => servicos.consultasService.listar(recepcao, { status: 'INEXISTENTE' }));\n    expect(erro.status).toBe(400);\n    expect(erro.message).toBe('Status inválido.');\n  });\n\n  /**\n   * @caso CT-INT-079\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo confidencialidade\n   * @requisito RF10.1, RN30\n   * @objetivo Bloquear o acesso individual de paciente a consulta alheia\n   * @resultadoEsperado obter consulta de outro paciente lança SEM_PERMISSAO (403)\n   */\n  test('paciente não acessa consulta alheia por id', () => {\n    const erro = capturar(() => servicos.consultasService.obter(pacienteAtor(pacientes[0].id), cgId));\n    expect(erro.status).toBe(403);\n    expect(erro.message).toBe('Você não tem acesso a esta consulta.');\n  });\n});\n"},"backend/__testes__/integracao/agendamento-consultas.test.js":{"tests":[{"id":"27","name":"agendar — valores e retorno (RF08.1, RN22, RN23) paciente adulto paga o valor cheio da especialidade","location":{"start":{"column":9,"line":57}}},{"id":"28","name":"agendar — valores e retorno (RF08.1, RN22, RN23) paciente idoso recebe o desconto de 10%","location":{"start":{"column":9,"line":75}}},{"id":"29","name":"agendar — valores e retorno (RF08.1, RN22, RN23) retorno dentro de 30 dias é gratuito e referencia a origem","location":{"start":{"column":9,"line":91}}},{"id":"30","name":"agendar — valores e retorno (RF08.1, RN22, RN23) realizada fora da janela de 30 dias não dá retorno","location":{"start":{"column":9,"line":112}}},{"id":"31","name":"agendar — valores e retorno (RF08.1, RN22, RN23) origem do retorno é a realizada mais recente","location":{"start":{"column":9,"line":133}}},{"id":"32","name":"agendar — valores e retorno (RF08.1, RN22, RN23) cancelamento do retorno libera a origem para reuso","location":{"start":{"column":9,"line":158}}},{"id":"33","name":"agendar — limites do paciente e da agenda (RN16, RN18–RN21) recusa dois horários sobrepostos para o mesmo paciente","location":{"start":{"column":9,"line":181}}},{"id":"34","name":"agendar — limites do paciente e da agenda (RN16, RN18–RN21) recusa segunda consulta ativa na mesma especialidade","location":{"start":{"column":9,"line":200}}},{"id":"35","name":"agendar — limites do paciente e da agenda (RN16, RN18–RN21) recusa o quarto agendamento ativo do paciente","location":{"start":{"column":9,"line":217}}},{"id":"36","name":"agendar — limites do paciente e da agenda (RN16, RN18–RN21) paciente com 3 faltas fica suspenso","location":{"start":{"column":9,"line":242}}},{"id":"37","name":"agendar — limites do paciente e da agenda (RN16, RN18–RN21) faltas fora da janela de 90 dias não suspendem","location":{"start":{"column":9,"line":265}}},{"id":"38","name":"agendar — limites do paciente e da agenda (RN16, RN18–RN21) paciente inativo não pode agendar","location":{"start":{"column":9,"line":294}}},{"id":"39","name":"agendar — limites do paciente e da agenda (RN16, RN18–RN21) médico inativo não recebe agendamentos","location":{"start":{"column":9,"line":314}}},{"id":"40","name":"agendar — antecedência e validação de entrada (RN16, RF08.1) recusa horário com menos de 2 horas de antecedência","location":{"start":{"column":9,"line":336}}},{"id":"41","name":"agendar — antecedência e validação de entrada (RN16, RF08.1) aceita exatamente 60 dias de antecedência","location":{"start":{"column":9,"line":353}}},{"id":"42","name":"agendar — antecedência e validação de entrada (RN16, RF08.1) recusa horário além de 60 dias","location":{"start":{"column":9,"line":370}}},{"id":"43","name":"agendar — antecedência e validação de entrada (RN16, RF08.1) recusa horário fora do formato AAAA-MM-DD HH:mm","location":{"start":{"column":9,"line":387}}},{"id":"44","name":"agendar — antecedência e validação de entrada (RN16, RF08.1) recepção sem paciente recebe erro de validação","location":{"start":{"column":9,"line":404}}},{"id":"45","name":"agendar — antecedência e validação de entrada (RN16, RF08.1) paciente inexistente retorna 404","location":{"start":{"column":9,"line":421}}},{"id":"46","name":"agendar — antecedência e validação de entrada (RN16, RF08.1) paciente não agenda para outra pessoa","location":{"start":{"column":9,"line":438}}},{"id":"47","name":"agendar — antecedência e validação de entrada (RN16, RF08.1) médico não agendra consultas","location":{"start":{"column":9,"line":455}}}],"source":"// Testes de integração do agendamento de consultas (RF08, RN16–RN24).\nconst clock = require('../../src/utils/clock');\nconst { abrirBanco } = require('../../src/db/connection');\nconst { semear } = require('../../src/db/seed');\nconst { criarServicos } = require('../../src/services');\n\nlet db, servicos, medicos, pacientes;\nlet paula, rafael, sandra;\nconst recepcao = { perfil: 'RECEPCAO' };\nconst pacienteAtor = (id) => ({ perfil: 'PACIENTE', pacienteId: id });\nconst capturar = (acao) => { try { return acao(); } catch (erro) { return erro; } };\n\nbeforeAll(() => {\n  clock.definirAgora(new Date(2026, 9, 19, 8, 0)); // 2026-10-19 08:00, segunda-feira\n  db = abrirBanco(':memory:');\n  ({ medicos, pacientes } = semear(db));\n  servicos = criarServicos(db);\n  paula = servicos.cadastroService.registrarPaciente({\n    nome: 'Paula Mendes', email: 'paula@email.com', cpf: '123.456.789-06',\n    dataNascimento: '1985-03-10', telefone: '(11) 95555-1010', senha: 'Senha123',\n  });\n  rafael = servicos.cadastroService.registrarPaciente({\n    nome: 'Rafael Nunes', email: 'rafael@email.com', cpf: '168.995.350-09',\n    dataNascimento: '1975-06-20', telefone: '(11) 95555-2020', senha: 'Senha123',\n  });\n  sandra = servicos.cadastroService.registrarPaciente({\n    nome: 'Sandra Lima', email: 'sandra@email.com', cpf: '987.654.321-00',\n    dataNascimento: '1980-01-01', telefone: '(11) 95555-3030', senha: 'Senha123',\n  });\n});\n\nafterAll(() => {\n  clock.definirAgora(null);\n  db.close();\n});\n\n// Consulta gravada direto no repositório, para estados passados (REALIZADA/FALTA)\n// que o fluxo normal não permite criar com o relógio congelado no presente.\nfunction inserirDireta({ pacienteId, medicoId, inicio, fim, status }) {\n  const id = servicos.repos.consultas.inserir({\n    pacienteId, medicoId, inicio, fim, valorCentavos: 15000, retornoDe: null, agora: '2026-10-19 08:00',\n  });\n  if (status && status !== 'AGENDADA') servicos.repos.consultas.atualizarStatus(id, status, '2026-10-19 08:00');\n  return id;\n}\n\ndescribe('agendar — valores e retorno (RF08.1, RN22, RN23)', () => {\n  /**\n   * @caso CT-INT-032\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF08.2, RN22\n   * @objetivo Gravar a consulta do adulto com o valor cheio da especialidade\n   * @resultadoEsperado consulta AGENDADA com valorCentavos 30000 (Cardiologia) e retornoDe nulo\n   */\n  test.skip('paciente adulto paga o valor cheio da especialidade', () => {\n    const consulta = servicos.consultasService.agendar(recepcao, {\n      pacienteId: paula.id, medicoId: medicos[1].id, inicio: '2026-10-21 09:45',\n    });\n    expect(consulta.status).toBe('AGENDADA');\n    expect(consulta.valorCentavos).toBe(30000);\n    expect(consulta.retornoDe).toBeNull();\n  });\n\n  /**\n   * @caso CT-INT-033\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF08.2, RN23\n   * @objetivo Aplicar 10% de desconto ao paciente com 60 anos ou mais\n   * @resultadoEsperado João (68 anos) paga 27000 em vez de 30000 na Cardiologia\n   */\n  test.skip('paciente idoso recebe o desconto de 10%', () => {\n    const consulta = servicos.consultasService.agendar(recepcao, {\n      pacienteId: pacientes[1].id, medicoId: medicos[1].id, inicio: '2026-10-21 09:00',\n    });\n    expect(consulta.valorCentavos).toBe(27000);\n  });\n\n  /**\n   * @caso CT-INT-034\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF08.2, RN24\n   * @objetivo Zerar o valor quando o paciente tem realizada com o médico nos últimos 30 dias\n   * @resultadoEsperado consulta gravada com valorCentavos 0 e retornoDe apontando para a consulta realizada\n   */\n  test.skip('retorno dentro de 30 dias é gratuito e referencia a origem', () => {\n    const origem = inserirDireta({\n      pacienteId: pacientes[0].id, medicoId: medicos[0].id,\n      inicio: '2026-10-10 08:00', fim: '2026-10-10 08:30', status: 'REALIZADA',\n    });\n    const retorno = servicos.consultasService.agendar(pacienteAtor(pacientes[0].id), {\n      medicoId: medicos[0].id, inicio: '2026-10-23 08:00',\n    });\n    expect(retorno.valorCentavos).toBe(0);\n    expect(retorno.retornoDe).toBe(origem);\n  });\n\n  /**\n   * @caso CT-INT-035\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN24, RN23\n   * @objetivo Cobrar normalmente quando a última realizada com o médico passou de 30 dias\n   * @resultadoEsperado retornoDe nulo e valor de idoso (22500) calculado sobre a Dermatologia\n   */\n  test.skip('realizada fora da janela de 30 dias não dá retorno', () => {\n    inserirDireta({\n      pacienteId: pacientes[1].id, medicoId: medicos[2].id,\n      inicio: '2026-09-10 13:00', fim: '2026-09-10 13:30', status: 'REALIZADA',\n    });\n    const consulta = servicos.consultasService.agendar(recepcao, {\n      pacienteId: pacientes[1].id, medicoId: medicos[2].id, inicio: '2026-10-22 13:00',\n    });\n    expect(consulta.retornoDe).toBeNull();\n    expect(consulta.valorCentavos).toBe(22500);\n  });\n\n  /**\n   * @caso CT-INT-036\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN24\n   * @objetivo Usar como origem do retorno a realizada mais recente do médico\n   * @resultadoEsperado retornoDe corresponde à realizada de 2026-10-15 e não à de 2026-10-01\n   */\n  test.skip('origem do retorno é a realizada mais recente', () => {\n    inserirDireta({\n      pacienteId: paula.id, medicoId: medicos[0].id,\n      inicio: '2026-10-01 08:00', fim: '2026-10-01 08:30', status: 'REALIZADA',\n    });\n    const recente = inserirDireta({\n      pacienteId: paula.id, medicoId: medicos[0].id,\n      inicio: '2026-10-15 08:00', fim: '2026-10-15 08:30', status: 'REALIZADA',\n    });\n    const retorno = servicos.consultasService.agendar(recepcao, {\n      pacienteId: paula.id, medicoId: medicos[0].id, inicio: '2026-10-26 08:00',\n    });\n    expect(retorno.valorCentavos).toBe(0);\n    expect(retorno.retornoDe).toBe(recente);\n  });\n\n  /**\n   * @caso CT-INT-037\n   * @nivel integracao\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN24\n   * @objetivo Reaproveitar a origem do retorno quando o retorno anterior é cancelado\n   * @resultadoEsperado após cancelar o retorno, o novo agendamento volta a sair gratuitamente da mesma realizada\n   */\n  test.skip('cancelamento do retorno libera a origem para reuso', () => {\n    const retornoAnterior = servicos.consultasService.agendar(recepcao, {\n      pacienteId: paula.id, medicoId: medicos[0].id, inicio: '2026-10-27 08:00',\n    });\n    servicos.consultasService.cancelar(recepcao, retornoAnterior.id, { motivo: 'Paciente desistiu' });\n    const novo = servicos.consultasService.agendar(recepcao, {\n      pacienteId: paula.id, medicoId: medicos[0].id, inicio: '2026-10-29 08:00',\n    });\n    expect(novo.valorCentavos).toBe(0);\n    expect(novo.retornoDe).toBe(retornoAnterior.retornoDe);\n  });\n});\n\ndescribe('agendar — limites do paciente e da agenda (RN16, RN18–RN21)', () => {\n  /**\n   * @caso CT-INT-038\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN18\n   * @objetivo Recusar agendamento que sobreponha outra consulta ativa do próprio paciente\n   * @resultadoEsperado agendar lança CONFLITO (409) com mensagem de horário já ocupado e não grava consulta\n   */\n  test.skip('recusa dois horários sobrepostos para o mesmo paciente', () => {\n    const antes = servicos.repos.consultas.listar({ pacienteId: pacientes[0].id }).length;\n    const erro = capturar(() => servicos.consultasService.agendar(recepcao, {\n      pacienteId: pacientes[0].id, medicoId: medicos[3].id, inicio: '2026-10-23 08:00',\n    }));\n    expect(erro.status).toBe(409);\n    expect(erro.message).toBe('O paciente já possui outra consulta neste horário.');\n    expect(servicos.repos.consultas.listar({ pacienteId: pacientes[0].id }).length).toBe(antes);\n  });\n\n  /**\n   * @caso CT-INT-039\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN19\n   * @objetivo Recusar segunda consulta ativa na mesma especialidade\n   * @resultadoEsperado agendar lança REGRA_NEGOCIO (422) com a mensagem da RN19\n   */\n  test.skip('recusa segunda consulta ativa na mesma especialidade', () => {\n    const erro = capturar(() => servicos.consultasService.agendar(recepcao, {\n      pacienteId: pacientes[0].id, medicoId: medicos[0].id, inicio: '2026-10-27 08:30',\n    }));\n    expect(erro.status).toBe(422);\n    expect(erro.message).toBe('O paciente já possui uma consulta agendada nesta especialidade.');\n  });\n\n  /**\n   * @caso CT-INT-040\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN19\n   * @objetivo Recusar o quarto agendamento ativo futuro do paciente\n   * @resultadoEsperado as duas consultas intermediárias são aceitas e a quarta lança REGRA_NEGOCIO (422) citando o limite de 3\n   */\n  test.skip('recusa o quarto agendamento ativo do paciente', () => {\n    const derma = servicos.consultasService.agendar(recepcao, {\n      pacienteId: pacientes[0].id, medicoId: medicos[2].id, inicio: '2026-10-20 13:00',\n    });\n    expect(derma.status).toBe('AGENDADA');\n    const pediatria = servicos.consultasService.agendar(recepcao, {\n      pacienteId: pacientes[0].id, medicoId: medicos[3].id, inicio: '2026-10-23 07:15',\n    });\n    expect(pediatria.status).toBe('AGENDADA');\n    const erro = capturar(() => servicos.consultasService.agendar(recepcao, {\n      pacienteId: pacientes[0].id, medicoId: medicos[0].id, inicio: '2026-11-05 08:00',\n    }));\n    expect(erro.status).toBe(422);\n    expect(erro.message).toBe('O paciente já possui 3 consultas agendadas, que é o limite.');\n  });\n\n  /**\n   * @caso CT-INT-041\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN20\n   * @objetivo Impedir agendamento do paciente com 3 faltas nos últimos 90 dias\n   * @resultadoEsperado agendar lança REGRA_NEGOCIO (422) informando a suspensão até 2026-11-06\n   */\n  test.skip('paciente com 3 faltas fica suspenso', () => {\n    for (const dia of ['2026-10-05', '2026-10-06', '2026-10-07']) {\n      inserirDireta({\n        pacienteId: sandra.id, medicoId: medicos[0].id,\n        inicio: `${dia} 08:00`, fim: `${dia} 08:30`, status: 'FALTA',\n      });\n    }\n    const erro = capturar(() => servicos.consultasService.agendar(recepcao, {\n      pacienteId: sandra.id, medicoId: medicos[0].id, inicio: '2026-10-30 08:00',\n    }));\n    expect(erro.status).toBe(422);\n    expect(erro.message).toBe('Paciente suspenso por faltas até 2026-11-06.');\n  });\n\n  /**\n   * @caso CT-INT-042\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN20\n   * @objetivo Permitir agendamento quando as faltas não somam 3 dentro da janela de 90 dias\n   * @resultadoEsperado com 2 faltas recentes e 1 antiga, o agendamento é aceito normalmente\n   */\n  test.skip('faltas fora da janela de 90 dias não suspendem', () => {\n    inserirDireta({\n      pacienteId: rafael.id, medicoId: medicos[0].id,\n      inicio: '2026-10-05 08:00', fim: '2026-10-05 08:30', status: 'FALTA',\n    });\n    inserirDireta({\n      pacienteId: rafael.id, medicoId: medicos[0].id,\n      inicio: '2026-10-06 08:00', fim: '2026-10-06 08:30', status: 'FALTA',\n    });\n    inserirDireta({\n      pacienteId: rafael.id, medicoId: medicos[0].id,\n      inicio: '2026-06-01 08:00', fim: '2026-06-01 08:30', status: 'FALTA',\n    });\n    const consulta = servicos.consultasService.agendar(recepcao, {\n      pacienteId: rafael.id, medicoId: medicos[0].id, inicio: '2026-10-28 08:00',\n    });\n    expect(consulta.status).toBe('AGENDADA');\n    expect(consulta.valorCentavos).toBe(15000);\n  });\n\n  /**\n   * @caso CT-INT-043\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN21\n   * @objetivo Impedir agendamento para paciente com usuário inativo\n   * @resultadoEsperado agendar lança REGRA_NEGOCIO (422) de paciente inativo e a reativação restaura o acesso\n   */\n  test.skip('paciente inativo não pode agendar', () => {\n    const usuario = servicos.repos.usuarios.buscarPorEmail('sandra@email.com');\n    servicos.cadastroService.definirUsuarioAtivo(usuario.id, false);\n    const erro = capturar(() => servicos.consultasService.agendar(recepcao, {\n      pacienteId: sandra.id, medicoId: medicos[3].id, inicio: '2026-10-21 07:00',\n    }));\n    expect(erro.status).toBe(422);\n    expect(erro.message).toBe('Paciente inativo não pode agendar consultas.');\n    servicos.cadastroService.definirUsuarioAtivo(usuario.id, true);\n  });\n\n  /**\n   * @caso CT-INT-044\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN21\n   * @objetivo Impedir agendamento com médico de usuário inativo\n   * @resultadoEsperado agendar lança REGRA_NEGOCIO (422) de médico inativo e a reativação restaura a agenda\n   */\n  test.skip('médico inativo não recebe agendamentos', () => {\n    const usuario = servicos.repos.usuarios.buscarPorEmail('carlos@clinica.com');\n    servicos.cadastroService.definirUsuarioAtivo(usuario.id, false);\n    const erro = capturar(() => servicos.consultasService.agendar(recepcao, {\n      pacienteId: rafael.id, medicoId: medicos[0].id, inicio: '2026-11-03 08:00',\n    }));\n    expect(erro.status).toBe(422);\n    expect(erro.message).toBe('Médico inativo não recebe agendamentos.');\n    servicos.cadastroService.definirUsuarioAtivo(usuario.id, true);\n  });\n});\n\ndescribe('agendar — antecedência e validação de entrada (RN16, RF08.1)', () => {\n  /**\n   * @caso CT-INT-045\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN16\n   * @objetivo Recusar horário com menos de 2 horas de antecedência\n   * @resultadoEsperado agendar pelo próprio paciente lança REGRA_NEGOCIO (422) com a mensagem da antecedência mínima\n   */\n  test.skip('recusa horário com menos de 2 horas de antecedência', () => {\n    const erro = capturar(() => servicos.consultasService.agendar(pacienteAtor(rafael.id), {\n      medicoId: medicos[0].id, inicio: '2026-10-19 09:30',\n    }));\n    expect(erro.status).toBe(422);\n    expect(erro.message).toBe('A consulta deve ser agendada com no mínimo 2 horas de antecedência.');\n  });\n\n  /**\n   * @caso CT-INT-046\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN16\n   * @objetivo Aceitar exatamente o limite de 60 dias de antecedência\n   * @resultadoEsperado agendamento em 2026-12-18 (60 dias depois) é gravado com sucesso\n   */\n  test.skip('aceita exatamente 60 dias de antecedência', () => {\n    const consulta = servicos.consultasService.agendar(recepcao, {\n      pacienteId: rafael.id, medicoId: medicos[3].id, inicio: '2026-12-18 07:00',\n    });\n    expect(consulta.status).toBe('AGENDADA');\n    expect(consulta.inicio).toBe('2026-12-18 07:00');\n  });\n\n  /**\n   * @caso CT-INT-047\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN16\n   * @objetivo Recusar horário além de 60 dias de antecedência\n   * @resultadoEsperado agendar em 2026-12-19 lança REGRA_NEGOCIO (422) com a mensagem do limite máximo\n   */\n  test.skip('recusa horário além de 60 dias', () => {\n    const erro = capturar(() => servicos.consultasService.agendar(recepcao, {\n      pacienteId: rafael.id, medicoId: medicos[3].id, inicio: '2026-12-19 08:00',\n    }));\n    expect(erro.status).toBe(422);\n    expect(erro.message).toBe('A consulta deve ser agendada com no máximo 60 dias de antecedência.');\n  });\n\n  /**\n   * @caso CT-INT-048\n   * @nivel integracao\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RF08.1\n   * @objetivo Tratar horário em formato inválido sem quebrar o serviço\n   * @resultadoEsperado agendar lança VALIDACAO (400) pedindo o formato AAAA-MM-DD HH:mm\n   */\n  test.skip('recusa horário fora do formato AAAA-MM-DD HH:mm', () => {\n    const erro = capturar(() => servicos.consultasService.agendar(recepcao, {\n      pacienteId: rafael.id, medicoId: medicos[0].id, inicio: '20/10/2026 08:00',\n    }));\n    expect(erro.status).toBe(400);\n    expect(erro.message).toBe('Horário inválido. Use o formato AAAA-MM-DD HH:mm.');\n  });\n\n  /**\n   * @caso CT-INT-049\n   * @nivel integracao\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RF08.1\n   * @objetivo Exigir o paciente quando quem agenda é a recepção\n   * @resultadoEsperado agendar sem pacienteId lança VALIDACAO (400) com 'Informe o paciente.'\n   */\n  test.skip('recepção sem paciente recebe erro de validação', () => {\n    const erro = capturar(() => servicos.consultasService.agendar(recepcao, {\n      medicoId: medicos[0].id, inicio: '2026-11-04 08:00',\n    }));\n    expect(erro.status).toBe(400);\n    expect(erro.message).toBe('Informe o paciente.');\n  });\n\n  /**\n   * @caso CT-INT-050\n   * @nivel integracao\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RF08.1\n   * @objetivo Tratar paciente inexistente com 404\n   * @resultadoEsperado agendar com pacienteId 9999 lança NAO_ENCONTRADO (404)\n   */\n  test.skip('paciente inexistente retorna 404', () => {\n    const erro = capturar(() => servicos.consultasService.agendar(recepcao, {\n      pacienteId: 9999, medicoId: medicos[0].id, inicio: '2026-11-04 08:00',\n    }));\n    expect(erro.status).toBe(404);\n    expect(erro.codigo).toBe('NAO_ENCONTRADO');\n  });\n\n  /**\n   * @caso CT-INT-051\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo confidencialidade\n   * @requisito RF08.1, RN30\n   * @objetivo Impedir que o paciente agende em nome de outro paciente\n   * @resultadoEsperado agendar informando pacienteId alheio lança SEM_PERMISSAO (403)\n   */\n  test.skip('paciente não agenda para outra pessoa', () => {\n    const erro = capturar(() => servicos.consultasService.agendar(pacienteAtor(pacientes[0].id), {\n      pacienteId: pacientes[1].id, medicoId: medicos[0].id, inicio: '2026-11-04 08:00',\n    }));\n    expect(erro.status).toBe(403);\n    expect(erro.codigo).toBe('SEM_PERMISSAO');\n  });\n\n  /**\n   * @caso CT-INT-052\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RF08.1, RN30\n   * @objetivo Bloquear médicos de criar consultas, papel exclusivo do paciente e da recepção\n   * @resultadoEsperado agendar com ator médico lança SEM_PERMISSAO (403) com orientação para procurar a recepção\n   */\n  test.skip('médico não agendra consultas', () => {\n    const erro = capturar(() => servicos.consultasService.agendar(\n      { perfil: 'MEDICO', medicoId: medicos[0].id },\n      { pacienteId: rafael.id, medicoId: medicos[0].id, inicio: '2026-11-04 08:00' },\n    ));\n    expect(erro.status).toBe(403);\n    expect(erro.message).toBe('Médicos não agendam consultas. Procure a recepção.');\n  });\n});\n"},"backend/__testes__/api/consultas-api.test.js":{"tests":[{"id":"48","name":"POST /api/consultas (RF08, RN16, RN17, RN30) paciente agenda consulta para si","location":{"start":{"column":4,"line":49}}},{"id":"49","name":"POST /api/consultas (RF08, RN16, RN17, RN30) agendamento sem token retorna 401","location":{"start":{"column":4,"line":68}}},{"id":"50","name":"POST /api/consultas (RF08, RN16, RN17, RN30) paciente não agenda para outro","location":{"start":{"column":4,"line":83}}},{"id":"51","name":"POST /api/consultas (RF08, RN16, RN17, RN30) horário já ocupado retorna 409","location":{"start":{"column":4,"line":100}}},{"id":"52","name":"POST /api/consultas (RF08, RN16, RN17, RN30) horário em formato inválido retorna 400","location":{"start":{"column":4,"line":117}}},{"id":"53","name":"POST /api/consultas (RF08, RN16, RN17, RN30) antecedência menor que 2 horas retorna 422","location":{"start":{"column":4,"line":134}}},{"id":"54","name":"GET /api/consultas e GET /:id (RF10, RN30) paciente lista só as próprias consultas","location":{"start":{"column":4,"line":153}}},{"id":"55","name":"GET /api/consultas e GET /:id (RF10, RN30) recepção filtra por status","location":{"start":{"column":4,"line":169}}},{"id":"56","name":"acesso individual, confirmação e cancelamento (RF09, RN25, RN26, RN30) dono consulta a própria consulta","location":{"start":{"column":4,"line":197}}},{"id":"57","name":"acesso individual, confirmação e cancelamento (RF09, RN25, RN26, RN30) paciente não acessa consulta alheia","location":{"start":{"column":4,"line":213}}},{"id":"58","name":"acesso individual, confirmação e cancelamento (RF09, RN25, RN26, RN30) consulta inexistente retorna 404","location":{"start":{"column":4,"line":228}}},{"id":"59","name":"acesso individual, confirmação e cancelamento (RF09, RN25, RN26, RN30) paciente confirma a própria consulta","location":{"start":{"column":4,"line":243}}},{"id":"60","name":"acesso individual, confirmação e cancelamento (RF09, RN25, RN26, RN30) segunda confirmação retorna 422","location":{"start":{"column":4,"line":259}}},{"id":"61","name":"acesso individual, confirmação e cancelamento (RF09, RN25, RN26, RN30) médico não confirma consultas","location":{"start":{"column":4,"line":275}}},{"id":"62","name":"acesso individual, confirmação e cancelamento (RF09, RN25, RN26, RN30) cancelamento da recepção sem motivo retorna 422","location":{"start":{"column":4,"line":291}}},{"id":"63","name":"acesso individual, confirmação e cancelamento (RF09, RN25, RN26, RN30) recepção cancela com motivo","location":{"start":{"column":4,"line":308}}},{"id":"64","name":"remarcação, realização e falta (RF09, RN26–RN29) paciente não cancela com menos de 24 horas","location":{"start":{"column":4,"line":331}}},{"id":"65","name":"remarcação, realização e falta (RF09, RN26–RN29) recepção remarca consulta","location":{"start":{"column":4,"line":352}}},{"id":"66","name":"remarcação, realização e falta (RF09, RN26–RN29) remarcar consulta cancelada retorna 422","location":{"start":{"column":4,"line":376}}},{"id":"67","name":"remarcação, realização e falta (RF09, RN26–RN29) médico registra atendimento via API","location":{"start":{"column":4,"line":393}}},{"id":"68","name":"remarcação, realização e falta (RF09, RN26–RN29) realizar consulta futura retorna 422","location":{"start":{"column":4,"line":414}}},{"id":"69","name":"remarcação, realização e falta (RF09, RN26–RN29) recepção registra falta via API","location":{"start":{"column":4,"line":431}}},{"id":"70","name":"remarcação, realização e falta (RF09, RN26–RN29) falta antes da tolerância retorna 422","location":{"start":{"column":4,"line":450}}}],"source":"// Testes de API do agendamento e ciclo de vida das consultas (RF08–RF10, RN16–RN30, RNF04).\nconst clock = require('../../src/utils/clock');\nconst request = require('supertest');\nconst { abrirBanco } = require('../../src/db/connection');\nconst { semear } = require('../../src/db/seed');\nconst { criarApp } = require('../../src/app');\n\nlet db, app, repos, tokenRecepcao, tokenPaciente, tokenMedico, tokenJoao;\n\nbeforeAll(async () => {\n  clock.definirAgora(new Date(2026, 9, 19, 8, 0)); // 2026-10-19 08:00, segunda-feira\n  db = abrirBanco(':memory:');\n  semear(db);\n  app = criarApp({ db });\n  repos = app.locals.servicos.repos;\n  const entrar = async (email) => {\n    const r = await request(app).post('/api/auth/login').send({ email, senha: 'Senha123' });\n    return r.body.token;\n  };\n  tokenRecepcao = await entrar('recepcao@clinica.com');\n  tokenPaciente = await entrar('ana@email.com');\n  tokenMedico = await entrar('carlos@clinica.com');\n  tokenJoao = await entrar('joao@email.com');\n});\n\nafterAll(() => {\n  clock.definirAgora(null);\n  db.close();\n});\n\nfunction inserirDireta({ pacienteId, medicoId, inicio, fim, status }) {\n  const id = repos.consultas.inserir({\n    pacienteId, medicoId, inicio, fim, valorCentavos: 15000, retornoDe: null, agora: '2026-10-19 08:00',\n  });\n  if (status && status !== 'AGENDADA') repos.consultas.atualizarStatus(id, status, '2026-10-19 08:00');\n  return id;\n}\n\ndescribe('POST /api/consultas (RF08, RN16, RN17, RN30)', () => {\n  /**\n   * @caso CT-API-056\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF08.1, RF08.2\n   * @objetivo Agendar consulta pelo próprio paciente via API\n   * @resultadoEsperado resposta 201 com status AGENDADA e valor gravado da especialidade\n   */\n  test('paciente agenda consulta para si', async () => {\n    const r = await request(app).post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenPaciente}`)\n      .send({ medicoId: 2, inicio: '2026-10-19 10:30' });\n    expect(r.status).toBe(201);\n    expect(r.body.status).toBe('AGENDADA');\n    expect(r.body.pacienteId).toBe(1);\n    expect(r.body.valorCentavos).toBe(30000); // preço base da Cardiologia, sem descontos para Ana\n  });\n\n  /**\n   * @caso CT-API-057\n   * @nivel api\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RF01.2\n   * @objetivo Exigir token para agendar\n   * @resultadoEsperado POST sem Authorization devolve 401 NAO_AUTENTICADO\n   */\n  test('agendamento sem token retorna 401', async () => {\n    const r = await request(app).post('/api/consultas').send({ medicoId: 1, inicio: '2026-10-20 08:00' });\n    expect(r.status).toBe(401);\n    expect(r.body.erro.codigo).toBe('NAO_AUTENTICADO');\n  });\n\n  /**\n   * @caso CT-API-058\n   * @nivel api\n   * @atributo seguranca\n   * @subatributo confidencialidade\n   * @requisito RN30\n   * @objetivo Impedir que o paciente agende informando outro paciente\n   * @resultadoEsperado resposta 403 SEM_PERMISSAO 'Você só pode agendar consultas para si mesmo.'\n   */\n  test('paciente não agenda para outro', async () => {\n    const r = await request(app).post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenJoao}`)\n      .send({ pacienteId: 1, medicoId: 1, inicio: '2026-10-20 08:00' });\n    expect(r.status).toBe(403);\n    expect(r.body.erro.mensagem).toBe('Você só pode agendar consultas para si mesmo.');\n  });\n\n  /**\n   * @caso CT-API-059\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN17\n   * @objetivo Recusar horário que não está entre os livres do médico\n   * @resultadoEsperado slot já ocupado de Beatriz devolve 409 CONFLITO 'Horário indisponível para este médico.'\n   */\n  test('horário já ocupado retorna 409', async () => {\n    const r = await request(app).post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenJoao}`)\n      .send({ medicoId: 2, inicio: '2026-10-19 10:30' });\n    expect(r.status).toBe(409);\n    expect(r.body.erro.mensagem).toBe('Horário indisponível para este médico.');\n  });\n\n  /**\n   * @caso CT-API-060\n   * @nivel api\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RF08.1, RNF04\n   * @objetivo Tratar horário fora do formato AAAA-MM-DD HH:mm\n   * @resultadoEsperado resposta 400 VALIDACAO com a orientação de formato\n   */\n  test('horário em formato inválido retorna 400', async () => {\n    const r = await request(app).post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenJoao}`)\n      .send({ medicoId: 1, inicio: '20/10/2026 08:00' });\n    expect(r.status).toBe(400);\n    expect(r.body.erro.mensagem).toBe('Horário inválido. Use o formato AAAA-MM-DD HH:mm.');\n  });\n\n  /**\n   * @caso CT-API-061\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN16\n   * @objetivo Recusar agendamento com menos de 2 horas de antecedência via API\n   * @resultadoEsperado resposta 422 REGRA_NEGOCIO com a mensagem da antecedência mínima\n   */\n  test('antecedência menor que 2 horas retorna 422', async () => {\n    const r = await request(app).post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenJoao}`)\n      .send({ medicoId: 1, inicio: '2026-10-19 09:30' });\n    expect(r.status).toBe(422);\n    expect(r.body.erro.mensagem).toBe('A consulta deve ser agendada com no mínimo 2 horas de antecedência.');\n  });\n});\n\ndescribe('GET /api/consultas e GET /:id (RF10, RN30)', () => {\n  /**\n   * @caso CT-API-062\n   * @nivel api\n   * @atributo seguranca\n   * @subatributo confidencialidade\n   * @requisito RF10.1\n   * @objetivo Restringir a listagem via API às consultas do próprio paciente\n   * @resultadoEsperado GET /api/consultas do paciente só traz consultas com o seu pacienteId\n   */\n  test('paciente lista só as próprias consultas', async () => {\n    const r = await request(app).get('/api/consultas').set('Authorization', `Bearer ${tokenPaciente}`);\n    expect(r.status).toBe(200);\n    expect(r.body.length).toBeGreaterThanOrEqual(1);\n    expect(r.body.every((c) => c.pacienteId === 1)).toBe(true);\n  });\n\n  /**\n   * @caso CT-API-063\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RF10.3\n   * @objetivo Filtrar consultas por status na visão da recepção\n   * @resultadoEsperado GET /api/consultas?status=AGENDADA devolve apenas agendadas\n   */\n  test('recepção filtra por status', async () => {\n    const r = await request(app)\n      .get('/api/consultas?status=AGENDADA')\n      .set('Authorization', `Bearer ${tokenRecepcao}`);\n    expect(r.status).toBe(200);\n    expect(r.body.length).toBeGreaterThanOrEqual(1);\n    expect(r.body.every((c) => c.status === 'AGENDADA')).toBe(true);\n  });\n});\n\ndescribe('acesso individual, confirmação e cancelamento (RF09, RN25, RN26, RN30)', () => {\n  let idAna;\n\n  beforeAll(async () => {\n    // Consulta de Ana criada em CT-API-056 é a primeira da listagem dela no período atual.\n    const r = await request(app).get('/api/consultas').set('Authorization', `Bearer ${tokenPaciente}`);\n    idAna = r.body[0].id;\n  });\n\n  /**\n   * @caso CT-API-064\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF10.1\n   * @objetivo Consultar uma consulta própria pelo id\n   * @resultadoEsperado GET /api/consultas/:id do dono devolve 200 com os dados completos\n   */\n  test('dono consulta a própria consulta', async () => {\n    const r = await request(app).get(`/api/consultas/${idAna}`).set('Authorization', `Bearer ${tokenPaciente}`);\n    expect(r.status).toBe(200);\n    expect(r.body.id).toBe(idAna);\n    expect(r.body.medicoNome).toBe('Dra. Beatriz Souza');\n  });\n\n  /**\n   * @caso CT-API-065\n   * @nivel api\n   * @atributo seguranca\n   * @subatributo confidencialidade\n   * @requisito RN30\n   * @objetivo Impedir que outro paciente acesse a consulta alheia\n   * @resultadoEsperado GET de João sobre consulta de Ana devolve 403 SEM_PERMISSAO\n   */\n  test('paciente não acessa consulta alheia', async () => {\n    const r = await request(app).get(`/api/consultas/${idAna}`).set('Authorization', `Bearer ${tokenJoao}`);\n    expect(r.status).toBe(403);\n    expect(r.body.erro.mensagem).toBe('Você não tem acesso a esta consulta.');\n  });\n\n  /**\n   * @caso CT-API-066\n   * @nivel api\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN30, RNF04\n   * @objetivo Retornar 404 para consulta inexistente\n   * @resultadoEsperado GET /api/consultas/9999 devolve 404 NAO_ENCONTRADO\n   */\n  test('consulta inexistente retorna 404', async () => {\n    const r = await request(app).get('/api/consultas/9999').set('Authorization', `Bearer ${tokenRecepcao}`);\n    expect(r.status).toBe(404);\n    expect(r.body.erro.codigo).toBe('NAO_ENCONTRADO');\n  });\n\n  /**\n   * @caso CT-API-067\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF09.1, RN25\n   * @objetivo Confirmar a própria consulta dentro das 48 horas via API\n   * @resultadoEsperado resposta 200 com status CONFIRMADA\n   */\n  test('paciente confirma a própria consulta', async () => {\n    const r = await request(app).post(`/api/consultas/${idAna}/confirmar`)\n      .set('Authorization', `Bearer ${tokenPaciente}`);\n    expect(r.status).toBe(200);\n    expect(r.body.status).toBe('CONFIRMADA');\n  });\n\n  /**\n   * @caso CT-API-068\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN25\n   * @objetivo Recusar segunda confirmação da mesma consulta\n   * @resultadoEsperado resposta 422 'Somente consultas agendadas podem ser confirmadas.'\n   */\n  test('segunda confirmação retorna 422', async () => {\n    const r = await request(app).post(`/api/consultas/${idAna}/confirmar`)\n      .set('Authorization', `Bearer ${tokenPaciente}`);\n    expect(r.status).toBe(422);\n    expect(r.body.erro.mensagem).toBe('Somente consultas agendadas podem ser confirmadas.');\n  });\n\n  /**\n   * @caso CT-API-069\n   * @nivel api\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RN25, RN30\n   * @objetivo Impedir que médico confirme consultas via API\n   * @resultadoEsperado resposta 403 SEM_PERMISSAO com a mensagem de papel\n   */\n  test('médico não confirma consultas', async () => {\n    const r = await request(app).post(`/api/consultas/${idAna}/confirmar`)\n      .set('Authorization', `Bearer ${tokenMedico}`);\n    expect(r.status).toBe(403);\n    expect(r.body.erro.mensagem).toBe('Somente o paciente da consulta ou a recepção podem confirmar.');\n  });\n\n  /**\n   * @caso CT-API-070\n   * @nivel api\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN26, RNF04\n   * @objetivo Exigir motivo no cancelamento pela recepção\n   * @resultadoEsperado POST /:id/cancelar sem motivo devolve 422 'Informe o motivo do cancelamento.'\n   */\n  test('cancelamento da recepção sem motivo retorna 422', async () => {\n    const r = await request(app).post(`/api/consultas/${idAna}/cancelar`)\n      .set('Authorization', `Bearer ${tokenRecepcao}`)\n      .send({});\n    expect(r.status).toBe(422);\n    expect(r.body.erro.mensagem).toBe('Informe o motivo do cancelamento.');\n  });\n\n  /**\n   * @caso CT-API-071\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF09.2, RN26\n   * @objetivo Cancelar pela recepção com motivo e registrar o autor\n   * @resultadoEsperado resposta 200 com status CANCELADA, canceladoPor 'RECEPCAO' e motivo gravado\n   */\n  test('recepção cancela com motivo', async () => {\n    const r = await request(app).post(`/api/consultas/${idAna}/cancelar`)\n      .set('Authorization', `Bearer ${tokenRecepcao}`)\n      .send({ motivo: 'Bloqueio da agenda' });\n    expect(r.status).toBe(200);\n    expect(r.body.status).toBe('CANCELADA');\n    expect(r.body.canceladoPor).toBe('RECEPCAO');\n    expect(r.body.motivoCancelamento).toBe('Bloqueio da agenda');\n  });\n});\n\ndescribe('remarcação, realização e falta (RF09, RN26–RN29)', () => {\n  let idRemarcada;\n\n  /**\n   * @caso CT-API-072\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN26\n   * @objetivo Recusar cancelamento do paciente com menos de 24 horas via API\n   * @resultadoEsperado consulta a 3 horas do início devolve 422 com a mensagem do prazo de 24 horas\n   */\n  test('paciente não cancela com menos de 24 horas', async () => {\n    const agendar = await request(app).post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenJoao}`)\n      .send({ medicoId: 2, inicio: '2026-10-19 11:15' });\n    expect(agendar.status).toBe(201);\n    const r = await request(app).post(`/api/consultas/${agendar.body.id}/cancelar`)\n      .set('Authorization', `Bearer ${tokenJoao}`)\n      .send({});\n    expect(r.status).toBe(422);\n    expect(r.body.erro.mensagem).toBe('O paciente só pode cancelar com no mínimo 24 horas de antecedência. Procure a recepção.');\n  });\n\n  /**\n   * @caso CT-API-073\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF09.3, RN27\n   * @objetivo Remarcar pela recepção com novo horário válido\n   * @resultadoEsperado resposta 200 com status AGENDADA, remarcacoes 1 e a nova data gravada\n   */\n  test('recepção remarca consulta', async () => {\n    const agendar = await request(app).post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenRecepcao}`)\n      .send({ pacienteId: 1, medicoId: 1, inicio: '2026-10-20 09:00' });\n    expect(agendar.status).toBe(201);\n    idRemarcada = agendar.body.id;\n    const r = await request(app).post(`/api/consultas/${idRemarcada}/remarcar`)\n      .set('Authorization', `Bearer ${tokenRecepcao}`)\n      .send({ inicio: '2026-10-21 08:00' });\n    expect(r.status).toBe(200);\n    expect(r.body.status).toBe('AGENDADA');\n    expect(r.body.inicio).toBe('2026-10-21 08:00');\n    expect(r.body.remarcacoes).toBe(1);\n  });\n\n  /**\n   * @caso CT-API-074\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN27\n   * @objetivo Impedir remarcação de consulta cancelada via API\n   * @resultadoEsperado resposta 422 'Somente consultas agendadas ou confirmadas podem ser remarcadas.'\n   */\n  test('remarcar consulta cancelada retorna 422', async () => {\n    const r = await request(app).post('/api/consultas/1/remarcar')\n      .set('Authorization', `Bearer ${tokenRecepcao}`)\n      .send({ inicio: '2026-10-22 08:00' });\n    expect(r.status).toBe(422);\n    expect(r.body.erro.mensagem).toBe('Somente consultas agendadas ou confirmadas podem ser remarcadas.');\n  });\n\n  /**\n   * @caso CT-API-075\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF09.4, RN28\n   * @objetivo Registrar atendimento pelo médico dono em consulta já iniciada\n   * @resultadoEsperado resposta 200 com status REALIZADA e observações gravadas\n   */\n  test('médico registra atendimento via API', async () => {\n    const id = inserirDireta({\n      pacienteId: 2, medicoId: 1, inicio: '2026-10-16 08:00', fim: '2026-10-16 08:30',\n    });\n    const r = await request(app).post(`/api/consultas/${id}/realizar`)\n      .set('Authorization', `Bearer ${tokenMedico}`)\n      .send({ observacoes: 'Paciente saudável.' });\n    expect(r.status).toBe(200);\n    expect(r.body.status).toBe('REALIZADA');\n    expect(r.body.observacoes).toBe('Paciente saudável.');\n  });\n\n  /**\n   * @caso CT-API-076\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN28\n   * @objetivo Recusar registro de atendimento em consulta futura\n   * @resultadoEsperado resposta 422 'O atendimento só pode ser registrado a partir do horário da consulta.'\n   */\n  test('realizar consulta futura retorna 422', async () => {\n    const r = await request(app).post(`/api/consultas/${idRemarcada}/realizar`)\n      .set('Authorization', `Bearer ${tokenMedico}`)\n      .send({});\n    expect(r.status).toBe(422);\n    expect(r.body.erro.mensagem).toBe('O atendimento só pode ser registrado a partir do horário da consulta.');\n  });\n\n  /**\n   * @caso CT-API-077\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF09.5, RN29\n   * @objetivo Registrar falta do paciente após a tolerância de 15 minutos\n   * @resultadoEsperado resposta 200 com status FALTA\n   */\n  test('recepção registra falta via API', async () => {\n    const id = inserirDireta({\n      pacienteId: 3, medicoId: 4, inicio: '2026-10-16 07:00', fim: '2026-10-16 07:15',\n    });\n    const r = await request(app).post(`/api/consultas/${id}/falta`)\n      .set('Authorization', `Bearer ${tokenRecepcao}`);\n    expect(r.status).toBe(200);\n    expect(r.body.status).toBe('FALTA');\n  });\n\n  /**\n   * @caso CT-API-078\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN29\n   * @objetivo Recusar registro de falta antes de 15 minutos do início\n   * @resultadoEsperado resposta 422 'A falta só pode ser registrada 15 minutos após o início da consulta.'\n   */\n  test('falta antes da tolerância retorna 422', async () => {\n    const r = await request(app).post(`/api/consultas/${idRemarcada}/falta`)\n      .set('Authorization', `Bearer ${tokenRecepcao}`);\n    expect(r.status).toBe(422);\n    expect(r.body.erro.mensagem).toBe('A falta só pode ser registrada 15 minutos após o início da consulta.');\n  });\n});\n"},"backend/__testes__/integracao/auth-relatorios-servicos.test.js":{"tests":[{"id":"71","name":"login (RF01.1, RN01, RN04) login válido do paciente retorna token e perfil","location":{"start":{"column":4,"line":36}}},{"id":"72","name":"login (RF01.1, RN01, RN04) token expira em 8 horas","location":{"start":{"column":4,"line":54}}},{"id":"73","name":"login (RF01.1, RN01, RN04) senha errada retorna 401 e conta a tentativa","location":{"start":{"column":4,"line":69}}},{"id":"74","name":"login (RF01.1, RN01, RN04) quinta tentativa errada bloqueia a conta por 15 minutos","location":{"start":{"column":9,"line":86}}},{"id":"75","name":"login (RF01.1, RN01, RN04) senha correta durante o bloqueio é recusada","location":{"start":{"column":9,"line":107}}},{"id":"76","name":"login (RF01.1, RN01, RN04) acerto zera o contador de tentativas","location":{"start":{"column":4,"line":122}}},{"id":"77","name":"login (RF01.1, RN01, RN04) e-mail inexistente retorna 401 genérico","location":{"start":{"column":4,"line":143}}},{"id":"78","name":"login (RF01.1, RN01, RN04) login sem e-mail ou senha recebe 400","location":{"start":{"column":4,"line":158}}},{"id":"79","name":"sessão e token (RF01.3) conta inativa não faz login","location":{"start":{"column":4,"line":175}}},{"id":"80","name":"sessão e token (RF01.3) autenticar devolve o perfil do token válido","location":{"start":{"column":4,"line":193}}},{"id":"81","name":"sessão e token (RF01.3) token inválido recebe 401","location":{"start":{"column":4,"line":210}}},{"id":"82","name":"sessão e token (RF01.3) token de usuário inexistente recebe 401","location":{"start":{"column":4,"line":225}}},{"id":"83","name":"sessão e token (RF01.3) senha é guardada apenas como hash bcrypt","location":{"start":{"column":4,"line":241}}},{"id":"84","name":"relatórios (RF11) resumo agrupa consultas por status","location":{"start":{"column":4,"line":291}}},{"id":"85","name":"relatórios (RF11) taxa de faltas do médico é calculada sobre as encerradas","location":{"start":{"column":4,"line":308}}},{"id":"86","name":"relatórios (RF11) faturamento soma só as realizadas","location":{"start":{"column":4,"line":325}}},{"id":"87","name":"relatórios (RF11) médico só com faltas tem taxa de 100%","location":{"start":{"column":4,"line":339}}},{"id":"88","name":"relatórios (RF11) recusa período invertido","location":{"start":{"column":4,"line":361}}},{"id":"89","name":"relatórios (RF11) recusa período sem datas informadas","location":{"start":{"column":4,"line":376}}}],"source":"// Testes de integração de autenticação e relatórios (RF01, RF11, RN01, RN04).\nconst clock = require('../../src/utils/clock');\nconst jwt = require('jsonwebtoken');\nconst bcrypt = require('bcryptjs');\nconst { abrirBanco } = require('../../src/db/connection');\nconst { semear } = require('../../src/db/seed');\nconst { criarServicos } = require('../../src/services');\nconst config = require('../../src/config');\n\nlet db, servicos, pacientes, ana;\nconst capturar = (acao) => { try { return acao(); } catch (erro) { return erro; } };\n\nbeforeAll(() => {\n  clock.definirAgora(new Date(2026, 9, 19, 8, 0)); // 2026-10-19 08:00, segunda-feira\n  db = abrirBanco(':memory:');\n  ({ pacientes } = semear(db));\n  servicos = criarServicos(db);\n  ana = pacientes[0];\n});\n\nafterAll(() => {\n  clock.definirAgora(null);\n  db.close();\n});\n\ndescribe('login (RF01.1, RN01, RN04)', () => {\n  /**\n   * @caso CT-INT-080\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF01.1, RN01\n   * @objetivo Autenticar paciente com credenciais válidas e devolver o perfil público\n   * @resultadoEsperado login retorna token e perfil com pacienteId, sem expor o hash da senha\n   */\n  test('login válido do paciente retorna token e perfil', () => {\n    const { token, usuario } = servicos.authService.login('ana@email.com', 'Senha123');\n    expect(typeof token).toBe('string');\n    expect(usuario.nome).toBe('Ana Pereira');\n    expect(usuario.perfil).toBe('PACIENTE');\n    expect(usuario.pacienteId).toBe(ana.id);\n    expect(usuario.senhaHash).toBeUndefined();\n  });\n\n  /**\n   * @caso CT-INT-081\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF01.1\n   * @objetivo Emitir token com validade de 8 horas\n   * @resultadoEsperado diferença entre exp e iat do token é exatamente 28800 segundos\n   */\n  test('token expira em 8 horas', () => {\n    const { token } = servicos.authService.login('ana@email.com', 'Senha123');\n    const payload = jwt.decode(token);\n    expect(payload.exp - payload.iat).toBe(28800);\n  });\n\n  /**\n   * @caso CT-INT-082\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF01.1, RN04\n   * @objetivo Recusar senha errada com mensagem genérica e contar a tentativa\n   * @resultadoEsperado login lança NAO_AUTENTICADO (401) e tentativasFalhas vai a 1\n   */\n  test('senha errada retorna 401 e conta a tentativa', () => {\n    const erro = capturar(() => servicos.authService.login('ana@email.com', 'Errada123'));\n    expect(erro.status).toBe(401);\n    expect(erro.message).toBe('E-mail ou senha inválidos.');\n    const usuario = servicos.repos.usuarios.buscarPorEmail('ana@email.com');\n    expect(usuario.tentativasFalhas).toBe(1);\n  });\n\n  /**\n   * @caso CT-INT-083\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN04\n   * @objetivo Bloquear a conta por 15 minutos na quinta tentativa errada\n   * @resultadoEsperado 5º erro lança CONTA_BLOQUEADA (423) e grava bloqueadoAte 2026-10-19 08:15\n   */\n  test.skip('quinta tentativa errada bloqueia a conta por 15 minutos', () => {\n    let erro;\n    for (let i = 0; i <"+" 4; i += 1) {\n      erro = capturar(() => servicos.authService.login('ana@email.com', 'Errada123'));\n      expect(erro.status).toBe(401);\n    }\n    erro = capturar(() => servicos.authService.login('ana@email.com', 'Errada123'));\n    expect(erro.status).toBe(423);\n    expect(erro.message).toBe('Conta bloqueada por excesso de tentativas. Tente novamente após 2026-10-19 08:15.');\n    expect(servicos.repos.usuarios.buscarPorEmail('ana@email.com').bloqueadoAte).toBe('2026-10-19 08:15');\n  });\n\n  /**\n   * @caso CT-INT-084\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN04\n   * @objetivo Manter o bloqueio mesmo com a senha correta dentro do período\n   * @resultadoEsperado login correto durante o bloqueio lança CONTA_BLOQUEADA (423)\n   */\n  test.skip('senha correta durante o bloqueio é recusada', () => {\n    const erro = capturar(() => servicos.authService.login('ana@email.com', 'Senha123'));\n    expect(erro.status).toBe(423);\n    expect(erro.message).toContain('Conta bloqueada');\n  });\n\n  /**\n   * @caso CT-INT-085\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN04\n   * @objetivo Zerar o contador de falhas quando o login é bem-sucedido\n   * @resultadoEsperado após 2 erros e um acerto, tentativasFalhas volta a 0 e bloqueadoAte fica nulo\n   */\n  test('acerto zera o contador de tentativas', () => {\n    const joao = pacientes[1].id;\n    expect(joao).toBeGreaterThan(0);\n    capturar(() => servicos.authService.login('joao@email.com', 'Errada123'));\n    capturar(() => servicos.authService.login('joao@email.com', 'Errada123'));\n    expect(servicos.repos.usuarios.buscarPorEmail('joao@email.com').tentativasFalhas).toBe(2);\n    servicos.authService.login('joao@email.com', 'Senha123');\n    const usuario = servicos.repos.usuarios.buscarPorEmail('joao@email.com');\n    expect(usuario.tentativasFalhas).toBe(0);\n    expect(usuario.bloqueadoAte).toBeNull();\n  });\n\n  /**\n   * @caso CT-INT-086\n   * @nivel integracao\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RF01.1\n   * @objetivo Responder com mensagem genérica para e-mail inexistente\n   * @resultadoEsperado login com e-mail desconhecido lança NAO_AUTENTICADO (401) sem revelar existência\n   */\n  test('e-mail inexistente retorna 401 genérico', () => {\n    const erro = capturar(() => servicos.authService.login('fantasma@email.com', 'Senha123'));\n    expect(erro.status).toBe(401);\n    expect(erro.message).toBe('E-mail ou senha inválidos.');\n  });\n\n  /**\n   * @caso CT-INT-087\n   * @nivel integracao\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RF01.1\n   * @objetivo Tratar login sem e-mail ou sem senha\n   * @resultadoEsperado login lança VALIDACAO (400) pedindo e-mail e senha\n   */\n  test('login sem e-mail ou senha recebe 400', () => {\n    const erro = capturar(() => servicos.authService.login('ana@email.com', ''));\n    expect(erro.status).toBe(400);\n    expect(erro.message).toBe('Informe e-mail e senha.');\n  });\n});\n\ndescribe('sessão e token (RF01.3)', () => {\n  /**\n   * @caso CT-INT-088\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RF01.1\n   * @objetivo Recusar login de conta desativada mesmo com a senha correta\n   * @resultadoEsperado login lança SEM_PERMISSAO (403) orientando a procurar a recepção\n   */\n  test('conta inativa não faz login', () => {\n    const usuarioLucas = servicos.repos.usuarios.buscarPorEmail('lucas@email.com');\n    servicos.cadastroService.definirUsuarioAtivo(usuarioLucas.id, false);\n    const erro = capturar(() => servicos.authService.login('lucas@email.com', 'Senha123'));\n    expect(erro.status).toBe(403);\n    expect(erro.message).toBe('Conta inativa. Procure a recepção.');\n    servicos.cadastroService.definirUsuarioAtivo(usuarioLucas.id, true);\n  });\n\n  /**\n   * @caso CT-INT-089\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF01.3\n   * @objetivo Recuperar o usuário autenticado a partir de um token válido\n   * @resultadoEsperado autenticar devolve o perfil público do paciente dono do token\n   */\n  test('autenticar devolve o perfil do token válido', () => {\n    const { token } = servicos.authService.login('recepcao@clinica.com', 'Senha123');\n    const usuario = servicos.authService.autenticar(token);\n    expect(usuario.email).toBe('recepcao@clinica.com');\n    expect(usuario.perfil).toBe('RECEPCAO');\n    expect(usuario.senhaHash).toBeUndefined();\n  });\n\n  /**\n   * @caso CT-INT-090\n   * @nive
