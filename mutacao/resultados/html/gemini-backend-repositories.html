m,\n    status: row.status,\n    valorCentavos: row.valor_centavos,\n    retornoDe: row.retorno_de,\n    remarcacoes: row.remarcacoes,\n    motivoCancelamento: row.motivo_cancelamento,\n    canceladoPor: row.cancelado_por,\n    observacoes: row.observacoes,\n    criadoEm: row.criado_em,\n    atualizadoEm: row.atualizado_em,\n  };\n}\n\nfunction criarConsultasRepository(db) {\n  return {\n    buscarPorId(id) {\n      return mapear(db.prepare(`${SELECT_BASE} WHERE c.id = ?`).get(id));\n    },\n\n    listar({ pacienteId, medicoId, status, dataInicio, dataFim } = {}) {\n      const condicoes = [];\n      const params = [];\n      if (pacienteId) { condicoes.push('c.paciente_id = ?'); params.push(pacienteId); }\n      if (medicoId) { condicoes.push('c.medico_id = ?'); params.push(medicoId); }\n      if (status) { condicoes.push('c.status = ?'); params.push(status); }\n      if (dataInicio) { condicoes.push('c.inicio >= ?'); params.push(`${dataInicio} 00:00`); }\n      if (dataFim) { condicoes.push('c.inicio <"+"= ?'); params.push(`${dataFim} 23:59`); }\n      const where = condicoes.length ? `WHERE ${condicoes.join(' AND ')}` : '';\n      return db.prepare(`${SELECT_BASE} ${where} ORDER BY c.inicio`).all(...params).map(mapear);\n    },\n\n    // Consultas ativas do médico que se sobrepõem ao intervalo [inicio, fim).\n    ativasDoMedicoNoIntervalo(medicoId, inicio, fim, ignorarId = 0) {\n      return db\n        .prepare(`${SELECT_BASE} WHERE c.medico_id = ? AND c.status IN ${ATIVAS} AND c.inicio <"+" ? AND c.fim > ? AND c.id <"+"> ?`)\n        .all(medicoId, fim, inicio, ignorarId)\n        .map(mapear);\n    },\n\n    ativasDoPacienteNoIntervalo(pacienteId, inicio, fim, ignorarId = 0) {\n      return db\n        .prepare(`${SELECT_BASE} WHERE c.paciente_id = ? AND c.status IN ${ATIVAS} AND c.inicio <"+" ? AND c.fim > ? AND c.id <"+"> ?`)\n        .all(pacienteId, fim, inicio, ignorarId)\n        .map(mapear);\n    },\n\n    ativasFuturasDoPaciente(pacienteId, agora, ignorarId = 0) {\n      return db\n        .prepare(`${SELECT_BASE} WHERE c.paciente_id = ? AND c.status IN ${ATIVAS} AND c.inicio > ? AND c.id <"+"> ?`)\n        .all(pacienteId, agora, ignorarId)\n        .map(mapear);\n    },\n\n    ativasDoMedicoEntreDatas(medicoId, dataInicio, dataFim) {\n      return db\n        .prepare(`${SELECT_BASE} WHERE c.medico_id = ? AND c.status IN ${ATIVAS} AND c.inicio >= ? AND c.inicio <"+"= ?`)\n        .all(medicoId, `${dataInicio} 00:00`, `${dataFim} 23:59`)\n        .map(mapear);\n    },\n\n    datasDeFaltaDoPaciente(pacienteId) {\n      return db.prepare(\"SELECT inicio FROM consultas WHERE paciente_id = ? AND status = 'FALTA'\").all(pacienteId).map((r) => r.inicio);\n    },\n\n    realizadasComMedico(pacienteId, medicoId) {\n      return db\n        .prepare(\"SELECT id, inicio FROM consultas WHERE paciente_id = ? AND medico_id = ? AND status = 'REALIZADA'\")\n        .all(pacienteId, medicoId);\n    },\n\n    // Ids de consultas já usadas como origem de retorno por consultas não canceladas.\n    retornosJaUsados(pacienteId, ignorarId = 0) {\n      return db\n        .prepare(\"SELECT retorno_de FROM consultas WHERE paciente_id = ? AND retorno_de IS NOT NULL AND status <"+"> 'CANCELADA' AND id <"+"> ?\")\n        .all(pacienteId, ignorarId)\n        .map((r) => r.retorno_de);\n    },\n\n    inserir(c) {\n      const r = db\n        .prepare(`INSERT INTO consultas (paciente_id, medico_id, inicio, fim, status, valor_centavos, retorno_de, criado_em, atualizado_em)\n                  VALUES (?, ?, ?, ?, 'AGENDADA', ?, ?, ?, ?)`)\n        .run(c.pacienteId, c.medicoId, c.inicio, c.fim, c.valorCentavos, c.retornoDe || null, c.agora, c.agora);\n      return Number(r.lastInsertRowid);\n    },\n\n    atualizarStatus(id, status, agora, extras = {}) {\n      db.prepare(`UPDATE consultas\n                  SET status = ?, motivo_cancelamento = COALESCE(?, motivo_cancelamento),\n                      cancelado_por = COALESCE(?, cancelado_por), observacoes = COALESCE(?, observacoes), atualizado_em = ?\n                  WHERE id = ?`)\n        .run(status, extras.motivoCancelamento || null, extras.canceladoPor || null, extras.observacoes || null, agora, id);\n    },\n\n    remarcar(id, { inicio, fim, valorCentavos, retornoDe, agora }) {\n      db.prepare(`UPDATE consultas\n                  SET inicio = ?, fim = ?, valor_centavos = ?, retorno_de = ?, status = 'AGENDADA',\n                      remarcacoes = remarcacoes + 1, atualizado_em = ?\n                  WHERE id = ?`)\n        .run(inicio, fim, valorCentavos, retornoDe || null, agora, id);\n    },\n\n    resumoPorStatus(dataInicio, dataFim) {\n      return db\n        .prepare('SELECT status, COUNT(*) AS total FROM consultas WHERE inicio >= ? AND inicio <"+"= ? GROUP BY status')\n        .all(`${dataInicio} 00:00`, `${dataFim} 23:59`);\n    },\n\n    faltasPorMedico(dataInicio, dataFim) {\n      return db\n        .prepare(`SELECT c.medico_id, u.nome AS medico_nome,\n                         SUM(CASE WHEN c.status = 'FALTA' THEN 1 ELSE 0 END) AS faltas,\n                         SUM(CASE WHEN c.status IN ('FALTA', 'REALIZADA') THEN 1 ELSE 0 END) AS encerradas\n                  FROM consultas c\n                  JOIN medicos m ON m.id = c.medico_id\n                  JOIN usuarios u ON u.id = m.usuario_id\n                  WHERE c.inicio >= ? AND c.inicio <"+"= ?\n                  GROUP BY c.medico_id, u.nome\n                  ORDER BY u.nome`)\n        .all(`${dataInicio} 00:00`, `${dataFim} 23:59`);\n    },\n\n    faturamento(dataInicio, dataFim) {\n      return db\n        .prepare(\"SELECT COALESCE(SUM(valor_centavos), 0) AS total FROM consultas WHERE status = 'REALIZADA' AND inicio >= ? AND inicio <"+"= ?\")\n        .get(`${dataInicio} 00:00`, `${dataFim} 23:59`).total;\n    },\n  };\n}\n\nmodule.exports = { criarConsultasRepository };\n"},"backend/src/repositories/medicosRepository.js":{"language":"javascript","mutants":[{"id":"147","m oId, dataInicio, dataFim, motivo }) {\n      const r = db\n        .prepare('INSERT INTO bloqueios (medico_id, data_inicio, data_fim, motivo) VALUES (?, ?, ?, ?)')\n        .run(medicoId, dataInicio, dataFim, motivo || null);\n      return Number(r.lastInsertRowid);\n    },\n    removerBloqueio(id) {\n      db.prepare('DELETE FROM bloqueios WHERE id = ?').run(id);\n    },\n  };\n}\n\nmodule.exports = { criarMedicosRepository };\n"},"backend/src/repositories/pacientesRepository.js":{"language":"javascript","mutants":[{"id":"194","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":8,"line":40},"start":{"column":18,"line":34}}},{"id":"195","mutatorName":"StringLiteral","replacement":"``","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":35,"line":35},"start":{"column":23,"line":35}}},{"id":"196","mutatorName":"StringLiteral","replacement":"``","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":106,"line":37},"start":{"column":20,"line":37}}},{"id":"176","mutatorName":"BooleanLiteral","replacement":"row","statusReason":"TypeError: Cannot read properties of undefined (reading 'id')\n    at id ({trabalho}/mut/gemini/.stryker-tmp-backend-repositories/sandbox-HGguYc/backend/src/repositories/pacientesRepository.js:60:15)\n    at Object.mapear [as buscarPorCpf] ({trabalho}/mut/gemini/.stryker-tmp-backend-repositories/sandbox-HGguYc/backend/src/repositories/pacientesRepository.js:99:18)\n    at Object.buscarPorCpf [as registrarPaciente] ({trabalho}/mut/gemini/.stryker-tmp-backend-repositories/sandbox-HGguYc/backend/src/services/cadastroService.js:34:19)\n    at registrarPaciente ({trabalho}/mut/gemini/.stryker-tmp-backend-repositories/sandbox-HGguYc/backend/src/db/seed.js:54:32)\n    at Array.map (<"+"anonymous>)\n    at map ({trabalho}/mut/gemini/.stryker-tmp-backend-repositories/sandbox-HGguYc/backend/src/db/seed.js:54:5)\n    at Object.sem   },\n    inserir({ nome, email, senhaHash, perfil, criadoEm }) {\n      const r = db\n        .prepare('INSERT INTO usuarios (nome, email, senha_hash, perfil, criado_em) VALUES (?, ?, ?, ?, ?)')\n        .run(nome, email, senhaHash, perfil, criadoEm);\n      return Number(r.lastInsertRowid);\n    },\n    registrarFalhaLogin(id, tentativas, bloqueadoAte) {\n      db.prepare('UPDATE usuarios SET tentativas_falhas = ?, bloqueado_ate = ? WHERE id = ?').run(tentativas, bloqueadoAte, id);\n    },\n    zerarFalhasLogin(id) {\n      db.prepare('UPDATE usuarios SET tentativas_falhas = 0, bloqueado_ate = NULL WHERE id = ?').run(id);\n    },\n    definirAtivo(id, ativo) {\n      db.prepare('UPDATE usuarios SET ativo = ? WHERE id = ?').run(ativo ? 1 : 0, id);\n    },\n  };\n}\n\nmodule.exports = { criarUsuariosRepository };\n"}},"schemaVersion":"1.0","thresholds":{"high":80,"low":60,"break":null},"testFiles":{"backend/__testes__/unitario/consultas.test.js":{"tests":[{"id":"0","name":"Regras de Consultas e Ciclo de Vida (consultas.js) deve permitir transições válidas de AGENDADA","location":{"start":{"column":4,"line":33}}},{"id":"1","name":"Regras de Consultas e Ciclo de Vida (consultas.js) deve proibir transições a partir de estados terminais","location":{"start":{"column":4,"line":49}}},{"id":"2","name":"Regras de Consultas e Ciclo de Vida (consultas.js) deve identificar status ativos corretamente","location":{"start":{"column":4,"line":64}}},{"id":"3","name":"Regras de Consultas e Ciclo de Vida (consultas.js) deve aceitar horário com exatamente 2 horas de antecedência ou mais até 60 dias","location":{"start":{"column":4,"line":82}}},{"id":"4","name":"Regras de Consultas e Ciclo de Vida (consultas.js) deve rejeitar agendamento com 119 minutos de antecedência","location":{"start":{"column":4,"line":99}}},{"id":"5","name":"Regras de Consultas e Ciclo de Vida (consultas.js) deve rejeitar agendamento além de 60 dias","location":{"start":{"column":4,"line":113}}},{"id":"6","name" as e Ciclo de Vida (consultas.js) deve permitir registro de falta após 15 minutos do início","location":{"start":{"column":4,"line":495}}},{"id":"29","name":"Regras de Consultas e Ciclo de Vida (consultas.js) deve impedir registro de falta antes de 15 minutos do início","location":{"start":{"column":4,"line":510}}},{"id":"30","name":"Regras de Consultas e Ciclo de Vida (consultas.js) deve impedir paciente de registrar falta","location":{"start":{"column":4,"line":526}}},{"id":"31","name":"Regras de Consultas e Ciclo de Vida (consultas.js) deve manter objeto REGRAS imutável com os parâmetros do sistema","location":{"start":{"column":4,"line":542}}}],"source":"const {\n  STATUS,\n  STATUS_ATIVOS,\n  REGRAS,\n  podeTransitar,\n  estaAtiva,\n  validarAntecedencia,\n  validarLimitesPaciente,\n  calcularSuspensao,\n  calcularValor,\n  encontrarConsultaDeRetorno,\n  verificarConfirmacao,\n  verificarCancelamento,\n  verificarRemarcacao,\n  verificarRealizacao,\n  verificarFalta,\n} = require('../../src/domain/consultas');\nconst { somarDias, somarMinutos } = require('../../src/utils/datas');\n\ndescribe('Regras de Consultas e Ciclo de Vida (consultas.js)', () => {\n  const agoraPadrao = new Date('2026-10-19T08:00:00');\n\n  // --- Máquina de Estados (RN25 a RN29) ---\n  /**\n   * @caso CT-UNI-039\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF09\n   * @objetivo Permitir transições válidas a partir de AGENDADA\n   * @resultadoEsperado podeTransitar retorna true para CONFIRMADA, CANCELADA, REALIZADA, FALTA\n   */\n  test('deve permitir transições válidas de AGENDADA', () => {\n    expect(podeTransitar(STATUS.AGENDADA, STATUS.CONFIRMADA)).toBe(true);\n    expect(podeTransitar(STATUS.AGENDADA, STATUS.CANCELADA)).toBe(true);\n    expect(podeTransitar(STATUS.AGENDADA, STATUS.REALIZADA)).toBe(true);\n    expect(podeTransitar(STATUS.AGENDADA, STATUS.FALTA)).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-040\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF09\n   * @objetivo Proibir transições a partir de estados finais\n   * @resultadoEsperado podeTransitar retorna false para REALIZADA, FALTA e CANCELADA\n   */\n  test('deve proibir transições a partir de estados terminais', () => {\n    expect(podeTransitar(STATUS.REALIZADA, STATUS.CANCELADA)).toBe(false);\n    expect(podeTransitar(STATUS.FALTA, STATUS.CONFIRMADA)).toBe(false);\n    expect(podeTransitar(STATUS.CANCELADA, STATUS.AGENDADA)).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-041\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RF09\n   * @objetivo Identificar corretamente se uma consulta é ativa\n   * @resultadoEsperado estaAtiva retorna true apenas para AGENDADA e CONFIRMADA\n   */\n  test('deve identificar status ativos corretamente', () => {\n    expect(estaAtiva(STATUS.AGENDADA)).toBe(true);\n    expect(estaAtiva(STATUS.CONFIRMADA)).toBe(true);\n    expect(estaAtiva(STATUS.REALIZADA)).toBe(false);\n    expect(estaAtiva(STATUS.FALTA)).toBe(false);\n    expect(estaAtiva(STATUS.CANCELADA)).toBe(false);\n  });\n\n  // --- RN16: Antecedência mínima e máxima ---\n  /**\n   * @caso CT-UNI-042\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN16\n   * @objetivo Aceitar agendamento com antecedência entre 2 horas e 60 dias\n   * @resultadoEsperado validarAntecedencia retorna null\n   */\n  test('deve aceitar horário com exatamente 2 horas de antecedência ou mais até 60 dias', () => {\n    const inicioValido = somarMinutos(agoraPadrao, 120); // 2h\n    expect(validarAntecedencia(inicioValido, agoraPadrao)).toBeNull();\n\n    const inicio60Dias = somarDias(agoraPadrao, 60);\n    expect(validarAntecedencia(inicio60Dias, agoraPadrao)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-043\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN16\n   * @objetivo Rejeitar agendamento com menos de 2 horas de antecedência\n   * @resultadoEsperado validarAntecedencia retorna erro de 2 horas mínimas\n   */\n  test('deve rejeitar agendamento com 119 minutos de antecedência', () => {\n    const inicioLimite = somarMinutos(agoraPadrao, 119);\n    expect(validarAntecedencia(inicioLimite, agoraPadrao)).toMatch(/mínimo 2 horas de antecedência/i);\n  });\n\n  /**\n   * @caso CT-UNI-044\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN16\n   * @objetivo Rejeitar agendamento com mais de 60 dias de antecedência\n   * @resultadoEsperado validarAntecedencia retorna erro de 60 dias máximos\n   */\n  test('deve rejeitar agendamento além de 60 dias', () => {\n    const inicioDistante = somarDias(agoraPadrao, 61);\n    expect(validarAntecedencia(inicioDistante, agoraPadrao)).toMatch(/máximo 60 dias de antecedência/i);\n  });\n\n  // --- RN19: Limites do paciente ---\n  /**\n   * @caso CT-UNI-045\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN19\n   * @objetivo Permitir agendamento quando paciente tem menos de 3 consultas e nenhuma na especialidade\n   * @resultadoEsperado validarLimitesPaciente retorna null\n   */\n  test('deve permitir agendamento dentro dos limites de consultas ativas futuras', () => {\n    const ativas = [{ especialidadeId: 1 }, { especialidadeId: 2 }];\n    expect(validarLimitesPaciente(ativas, 3)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-046\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN19\n   * @objetivo Rejeitar agendamento quando paciente já possui 3 consultas ativas futuras\n   * @resultadoEsperado Retornar erro do limite de 3 consultas\n   */\n  test('deve bloquear agendamento ao atingir 3 consultas ativas futuras', () => {\n    const ativas = [{ especialidadeId: 1 }, { especialidadeId: 2 }, { especialidadeId: 3 }];\n    expect(validarLimitesPaciente(ativas, 4)).toMatch(/limite/i);\n  });\n\n  /**\n   * @caso CT-UNI-047\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN19\n   * @objetivo Rejeitar agendamento quando paciente já possui 1 consulta ativa na mesma especialidade\n   * @resultadoEsperado Retornar erro de consulta agendada na especialidade\n   */\n  test('deve bloquear agendamento repetido na mesma especialidade', () => {\n    const ativas = [{ especialidadeId: 1 }];\n    expect(validarLimitesPaciente(ativas, 1)).toMatch(/já possui uma consulta agendada nesta especialidade/i);\n  });\n\n  // --- RN20: Suspensão por faltas ---\n  /**\n   * @caso CT-UNI-048\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN20\n   * @objetivo Não suspender paciente com menos de 3 faltas nos últimos 90 dias\n   * @resultadoEsperado calcularSuspensao retorna null\n   */\n  test('não deve suspender paciente com 2 faltas recentes', () => {\n    const faltas = [\n      somarDias(agoraPadrao, -10),\n      somarDias(agoraPadrao, -5),\n    ];\n    expect(calcularSuspensao(faltas, agoraPadrao)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-049\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN20\n   * @objetivo Suspender paciente com 3 ou mais faltas nos últimos 90 dias até 30 dias após a última falta\n   * @resultadoEsperado calcularSuspensao retorna a data final da suspensão (última falta + 30 dias)\n   */\n  test('deve suspender paciente com 3 faltas nos últimos 90 dias por 30 dias após a última', () => {\n    const ultimaFalta = somarDias(agoraPadrao, -5);\n    const faltas = [\n      somarDias(agoraPadrao, -50),\n      somarDias(agoraPadrao, -20),\n      ultimaFalta,\n    ];\n    const dataFim = calcularSuspensao(faltas, agoraPadrao);\n    expect(dataFim).toEqual(somarDias(ultimaFalta, 30));\n  });\n\n  /**\n   * @caso CT-UNI-050\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN20\n   * @objetivo Ignorar faltas ocorridas há mais de 90 dias\n   * @resultadoEsperado calcularSuspensao retorna null se apenas 2 estiverem na janela\n   */\n  test('não deve considerar faltas ocorridas além de 90 dias', () => {\n    const faltas = [\n      somarDias(agoraPadrao, -95), // fora da janela\n      somarDias(agoraPadrao, -40),\n      somarDias(agoraPadrao, -10),\n    ];\n    expect(calcularSuspensao(faltas, agoraPadrao)).toBeNull();\n  });\n\n  // --- RN22, RN23 e RN24: Valor da consulta ---\n  /**\n   * @caso CT-UNI-051\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN22\n   * @objetivo Cobrar preço integral para paciente comum (<"+" 60 anos, sem retorno)\n   * @resultadoEsperado Retornar o precoBaseCentavos sem modificação\n   */\n  test('deve cobrar preço integral para paciente adulto sem direito a retorno', () => {\n    const valor = calcularValor({ precoBaseCentavos: 15000, idadePaciente: 35, ehRetorno: false });\n    expect(valor).toBe(15000);\n  });\n\n  /**\n   * @caso CT-UNI-052\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN23\n   * @objetivo Aplicar 10% de desconto para paciente com 60 anos ou mais\n   * @resultadoEsperado Retornar 90% do valor arredondado ao centavo mais próximo\n   */\n  test('deve aplicar 10% de desconto para idoso de 60 anos ou mais', () => {\n    // 15000 * 0.9 = 13500\n    expect(calcularValor({ precoBaseCentavos: 15000, idadePaciente: 60, ehRetorno: false })).toBe(13500);\n    // 25000 * 0.9 = 22500\n    expect(calcularValor({ precoBaseCentavos: 25000, idadePaciente: 75, ehRetorno: false })).toBe(22500);\n  });\n\n  /**\n   * @caso CT-UNI-053\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN24\n   * @objetivo Retorno gratuito tem custo zero e prevalece sobre desconto de idade\n   * @resultadoEsperado Retornar 0 mesmo se paciente for idoso\n   */\n  test('deve retornar 0 quando for retorno gratuito mesmo para idoso', () => {\n    expect(calcularValor({ precoBaseCentavos: 30000, idadePaciente: 68, ehRetorno: true })).toBe(0);\n    expect(calcularValor({ precoBaseCentavos: 20000, idadePaciente: 25, ehRetorno: true })).toBe(0);\n  });\n\n  /**\n   * @caso CT-UNI-054\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN24\n   * @objetivo Encontrar consulta realizada dentro dos 30 dias para conceder retorno gratuito\n   * @resultadoEsperado Retornar o id da consulta realizada mais recente elegível\n   */\n  test('deve identificar consulta elegível para retorno dentro de 30 dias', () => {\n    const novoInicio = new Date('2026-10-19T09:00:00');\n    const realizadas = [\n      { id: 10, inicio: new Date('2026-10-01T09:00:00') }, // 18 dias atrás\n      { id: 5, inicio: new Date('2026-09-01T09:00:00') },  // mais de 30 dias atrás\n    ];\n    const idRetorno = encontrarConsultaDeRetorno(realizadas, [], novoInicio);\n    expect(idRetorno).toBe(10);\n  });\n\n  /**\n   * @caso CT-UNI-055\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN24\n   * @objetivo Não conceder retorno se consulta realizada já foi utilizada em outro retorno\n   * @resultadoEsperado encontrarConsultaDeRetorno retorna null\n   */\n  test('deve ignorar consulta já utilizada anteriormente como retorno', () => {\n    const novoInicio = new Date('2026-10-19T09:00:00');\n    const realizadas = [{ id: 10, inicio: new Date('2026-10-01T09:00:00') }];\n    const idRetorno = encontrarConsultaDeRetorno(realizadas, [10], novoInicio);\n    expect(idRetorno).toBeNull();\n  });\n\n  // --- RN25: Confirmação ---\n  /**\n   * @caso CT-UNI-056\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN25\n   * @objetivo Permitir confirmação pelo paciente dono nas 48h anteriores à consulta\n   * @resultadoEsperado verificarConfirmacao retorna null\n   */\n  test('deve permitir confirmação nas 48 horas anteriores à consulta pelo paciente', () => {\n    const consulta = { status: STATUS.AGENDADA, inicio: somarMinutos(agoraPadrao, 24 * 60) }; // em 24h\n    const ator = { perfil: 'PACIENTE', ehDono: true };\n    expect(verificarConfirmacao(consulta, ator, agoraPadrao)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-057\n   * @nivel unitario\n   * @atributo seguranca\n   * @subatributo confidencialidade\n   * @requisito RN25\n   * @objetivo Proibir confirmação por paciente que não é dono da consulta\n   * @resultadoEsperado verificarConfirmacao retorna erro de PERMISSAO\n   */\n  test('deve impedir que outro paciente confirme a consulta', () => {\n    const consulta = { status: STATUS.AGENDADA, inicio: somarMinutos(agoraPadrao, 24 * 60) };\n    const ator = { perfil: 'PACIENTE', ehDono: false };\n    const res = verificarConfirmacao(consulta, ator, agoraPadrao);\n    expect(res).toEqual({ tipo: 'PERMISSAO', mensagem: expect.stringMatching(/Somente o paciente da consulta ou a recepção/i) });\n  });\n\n  /**\n   * @caso CT-UNI-058\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN25\n   * @objetivo Proibir confirmação com mais de 48 horas de antecedência\n   * @resultadoEsperado Retornar erro informando o prazo de 48 horas\n   */\n  test('deve impedir confirmação antes da janela de 48 horas', () => {\n    const consulta = { status: STATUS.AGENDADA, inicio: somarMinutos(agoraPadrao, 50 * 60) }; // em 50h\n    const ator = { perfil: 'PACIENTE', ehDono: true };\n    const res = verificarConfirmacao(consulta, ator, agoraPadrao);\n    expect(res.tipo).toBe('REGRA');\n    expect(res.mensagem).toMatch(/48 horas anteriores/i);\n  });\n\n  // --- RN26: Cancelamento ---\n  /**\n   * @caso CT-UNI-059\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN26\n   * @objetivo Permitir cancelamento pelo paciente com mais de 24 horas de antecedência\n   * @resultadoEsperado verificarCancelamento retorna null\n   */\n  test('deve permitir cancelamento pelo paciente com antecedência de 24 horas', () => {\n    const consulta = { status: STATUS.AGENDADA, inicio: somarMinutos(agoraPadrao, 25 * 60) };\n    const ator = { perfil: 'PACIENTE', ehDono: true };\n    expect(verificarCancelamento(consulta, ator, agoraPadrao, '')).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-060\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN26\n   * @objetivo Impedir cancelamento pelo paciente com menos de 24 horas de antecedência\n   * @resultadoEsperado Retornar erro de regra informando prazo de 24h e para procurar a recepção\n   */\n  test('deve impedir cancelamento do paciente com menos de 24 horas', () => {\n    const consulta = { status: STATUS.AGENDADA, inicio: somarMinutos(agoraPadrao, 20 * 60) };\n    const ator = { perfil: 'PACIENTE', ehDono: true };\n    const res = verificarCancelamento(consulta, ator, agoraPadrao, '');\n    expect(res.tipo).toBe('REGRA');\n    expect(res.mensagem).toMatch(/com no mínimo 24 horas de antecedência/i);\n  });\n\n  /**\n   * @caso CT-UNI-061\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN26\n   * @objetivo Exigir motivo de cancelamento para recepção e médico\n   * @resultadoEsperado Retornar erro de regra caso motivo esteja em branco\n   */\n  test('deve exigir motivo de cancelamento quando efetuado pela recepção ou médico', () => {\n    const consulta = { status: STATUS.AGENDADA, inicio: somarMinutos(agoraPadrao, 2 * 60) };\n    const atorRecepcao = { perfil: 'RECEPCAO', ehDono: false };\n    expect(verificarCancelamento(consulta, atorRecepcao, agoraPadrao, '')).toEqual({\n      tipo: 'REGRA',\n      mensagem: 'Informe o motivo do cancelamento.',\n    });\n    expect(verificarCancelamento(consulta, atorRecepcao, agoraPadrao, 'Paciente solicitou')).toBeNull();\n  });\n\n  // --- RN27: Remarcação ---\n  /**\n   * @caso CT-UNI-062\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN27\n   * @objetivo Permitir remarcação com mais de 24h de antecedência quando remarcacoes <"+" 2\n   * @resultadoEsperado verificarRemarcacao retorna null\n   */\n  test('deve permitir remarcação válida até 24h antes e dentro do limite de 2 vezes', () => {\n    const consulta = { status: STATUS.AGENDADA, inicio: somarMinutos(agoraPadrao, 26 * 60), remarcacoes: 1 };\n    const ator = { perfil: 'PACIENTE', ehDono: true };\n    expect(verificarRemarcacao(consulta, ator, agoraPadrao)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-063\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN27\n   * @objetivo Impedir remarcação que exceda o limite de 2 remarcações\n   * @resultadoEsperado Retornar erro informando que atingiu o limite de 2 remarcações\n   */\n  test('deve impedir consulta de ser remarcada pela 3ª vez', () => {\n    const consulta = { status: STATUS.AGENDADA, inicio: somarMinutos(agoraPadrao, 30 * 60), remarcacoes: 2 };\n    const ator = { perfil: 'PACIENTE', ehDono: true };\n    const res = verificarRemarcacao(consulta, ator, agoraPadrao);\n    expect(res.tipo).toBe('REGRA');\n    expect(res.mensagem).toMatch(/limite de 2 remarcações/i);\n  });\n\n  // --- RN28: Realização ---\n  /**\n   * @caso CT-UNI-064\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN28\n   * @objetivo Permitir ao médico dono registrar atendimento a partir do horário de início\n   * @resultadoEsperado verificarRealizacao retorna null\n   */\n  test('deve permitir ao médico dono registrar atendimento no horário da consulta', () => {\n    const consulta = { status: STATUS.CONFIRMADA, inicio: agoraPadrao };\n    const ator = { perfil: 'MEDICO', ehDono: true };\n    expect(verificarRealizacao(consulta, ator, agoraPadrao)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-065\n   * @nivel unitario\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RN28\n   * @objetivo Proibir médico que não é dono ou recepção de registrar atendimento\n   * @resultadoEsperado Retornar erro de PERMISSAO\n   */\n  test('deve impedir que recepção ou outro médico registre atendimento realizado', () => {\n    const consulta = { status: STATUS.CONFIRMADA, inicio: agoraPadrao };\n    expect(verificarRealizacao(consulta, { perfil: 'RECEPCAO', ehDono: false }, agoraPadrao)).toEqual({\n      tipo: 'PERMISSAO',\n      mensagem: expect.stringMatching(/Somente o médico da consulta/i),\n    });\n    expect(verificarRealizacao(consulta, { perfil: 'MEDICO', ehDono: false }, agoraPadrao)).toEqual({\n      tipo: 'PERMISSAO',\n      mensagem: expect.stringMatching(/Somente o médico da consulta/i),\n    });\n  });\n\n  /**\n   * @caso CT-UNI-066\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN28\n   * @objetivo Impedir registro de atendimento antes do horário de início da consulta\n   * @resultadoEsperado Retornar erro de regra informando que só pode registrar a partir do horário\n   */\n  test('deve impedir atendimento antes do horário de início', () => {\n    const consulta = { status: STATUS.CONFIRMADA, inicio: somarMinutos(agoraPadrao, 10) };\n    const ator = { perfil: 'MEDICO', ehDono: true };\n    const res = verificarRealizacao(consulta, ator, agoraPadrao);\n    expect(res.tipo).toBe('REGRA');\n    expect(res.mensagem).toMatch(/a partir do horário da consulta/i);\n  });\n\n  // --- RN29: Falta ---\n  /**\n   * @caso CT-UNI-067\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN29\n   * @objetivo Permitir registrar falta após 15 minutos do horário de início\n   * @resultadoEsperado verificarFalta retorna null para médico dono e recepção\n   */\n  test('deve permitir registro de falta após 15 minutos do início', () => {\n    const consulta = { status: STATUS.AGENDADA, inicio: somarMinutos(agoraPadrao, -16) }; // começou há 16 min\n    expect(verificarFalta(consulta, { perfil: 'MEDICO', ehDono: true }, agoraPadrao)).toBeNull();\n    expect(verificarFalta(consulta, { perfil: 'RECEPCAO', ehDono: false }, agoraPadrao)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-068\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN29\n   * @objetivo Impedir registro de falta antes de decorridos 15 minutos do início\n   * @resultadoEsperado Retornar erro de tolerância de 15 minutos\n   */\n  test('deve impedir registro de falta antes de 15 minutos do início', () => {\n    const consulta = { status: STATUS.AGENDADA, inicio: somarMinutos(agoraPadrao, -10) }; // começou há 10 min\n    const res = verificarFalta(consulta, { perfil: 'RECEPCAO', ehDono: false }, agoraPadrao);\n    expect(res.tipo).toBe('REGRA');\n    expect(res.mensagem).toMatch(/15 minutos após o início/i);\n  });\n\n  /**\n   * @caso CT-UNI-069\n   * @nivel unitario\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RN29\n   * @objetivo Impedir paciente de registrar falta\n   * @resultadoEsperado Retornar erro de PERMISSAO\n   */\n  test('deve impedir paciente de registrar falta', () => {\n    const consulta = { status: STATUS.AGENDADA, inicio: somarMinutos(agoraPadrao, -30) };\n    const res = verificarFalta(consulta, { perfil: 'PACIENTE', ehDono: true }, agoraPadrao);\n    expect(res.tipo).toBe('PERMISSAO');\n  });\n\n  // --- RNF07: Manutenibilidade e Constantes do Domínio ---\n  /**\n   * @caso CT-UNI-070\n   * @nivel unitario\n   * @atributo manutenibilidade\n   * @subatributo modularidade\n   * @requisito RNF07\n   * @objetivo Validar que o objeto REGRAS é imutável e expõe todos os limites especificados\n   * @resultadoEsperado REGRAS está congelado com Object.freeze e contém constantes corretas\n   */\n  test('deve manter objeto REGRAS imutável com os parâmetros do sistema', () => {\n    expect(Object.isFrozen(REGRAS)).toBe(true);\n    expect(REGRAS.ANTECEDENCIA_MINIMA_MIN).toBe(120);\n    expect(REGRAS.ANTECEDENCIA_MAXIMA_DIAS).toBe(60);\n    expect(REGRAS.MAX_CONSULTAS_ATIVAS).toBe(3);\n    expect(REGRAS.MAX_ATIVAS_POR_ESPECIALIDADE).toBe(1);\n    expect(REGRAS.LIMITE_FALTAS).toBe(3);\n    expect(REGRAS.DESCONTO_IDOSO_PERCENTUAL).toBe(10);\n  });\n});\n"},"backend/__testes__/integracao/consultas-service.test.js":{"tests":[{"id":"32","name":"Integração: ConsultasService deve agendar consulta calculando valor base da especialidade","location":{"start":{"column":4,"line":34}}},{"id":"33","name":"Integração: ConsultasService deve calcular desconto de idoso de 10% no agendamento","location":{"start":{"column":4,"line":60}}},{"id":"34","name":"Integração: ConsultasService deve conceder retorno gratuito após consulta realizada com mesmo médico em 30 dias","location":{"start":{"column":4,"line":83}}},{"id":"35","name":"Integração: ConsultasService deve impedir que o paciente tenha duas consultas ativas no mesmo horário","location":{"start":{"column":4,"line":119}}},{"id":"36","name":"Integração: ConsultasService deve bloquear mais de 1 consulta ativa futura na mesma especialidade","location":{"start":{"column":4,"line":151}}},{"id":"37","name":"Integração: ConsultasService deve suspender agendamento de paciente com 3 faltas recentes","location":{"start":{"column":4,"line":181}}},{"id":"38","name":"Integração: ConsultasService deve impedir agendamento para paciente inativo","location":{"start":{"column":4,"line":218}}},{"id":"39","name":"Integração: ConsultasService deve confirmar consulta nas 48h anteriores pelo paciente dono","location":{"start":{"column":4,"line":241}}},{"id":"40","name":"Integração: ConsultasService deve cancelar consulta pelo paciente com mais de 24 horas de antecedência","location":{"start":{"column":4,"line":266}}},{"id":"41","name":"Integração: ConsultasService deve devolver direito a retorno caso consulta com retorno seja cancelada","location":{"start":{"column":4,"line":292}}},{"id":"42","name":"Integração: ConsultasService deve remarcar consulta atualizando horário e contador de remarcações","location":{"start":{"column":9,"line":338}}},{"id":"43","name":"Integração: ConsultasService deve registrar atendimento realizado pelo médico dono após o horário","location":{"start":{"column":4,"line":368}}},{"id":"44","name":"Integração: ConsultasService deve registrar falta do paciente após a tolerância de 15 minutos","location":{"start":{"column":4,"line":398}}},{"id":"45","name":"Integração: ConsultasService deve impedir paciente de acessar consulta alheia","location":{"start":{"column":4,"line":425}}},{"id":"46","name":"Integração: ConsultasService médico lista somente consultas da própria agenda","location":{"start":{"column":4,"line":452}}}],"source":"const { abrirBanco } = require('../../src/db/connection');\nconst { semear } = require('../../src/db/seed');\nconst { criarServicos } = require('../../src/services');\nconst clock = require('../../src/utils/clock');\nconst { somarDias, somarMinutos, formatarDataHora } = require('../../src/utils/datas');\n\ndescribe('Integração: ConsultasService', () => {\n  let db;\n  let servicos;\n  let dados;\n  const agoraFixo = new Date('2026-10-19T08:00:00'); // Segunda-feira\n\n  beforeEach(() => {\n    clock.definirAgora(agoraFixo);\n    db = abrirBanco(':memory:');\n    dados = semear(db);\n    servicos = criarServicos(db);\n  });\n\n  afterEach(() => {\n    clock.definirAgora(null);\n    db.close();\n  });\n\n  /**\n   * @caso CT-INT-031\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF08.1, RF08.2, RN22\n   * @objetivo Agendar consulta para o próprio paciente e calcular o valor padrão\n   * @resultadoEsperado Consulta gravada como AGENDADA com valor integral da especialidade\n   */\n  test('deve agendar consulta calculando valor base da especialidade', () => {\n    const paciente = dados.pacientes[0]; // Ana Pereira (nascida em 1990)\n    const medico = dados.medicos[0]; // Clínica Geral (R$ 150,00 -> 15000 centavos)\n    const ator = { perfil: 'PACIENTE', pacienteId: paciente.id };\n\n    const consulta = servicos.consultasService.agendar(ator, {\n      pacienteId: paciente.id,\n      medicoId: medico.id,\n      inicio: '2026-10-20 09:00',\n    });\n\n    expect(consulta.id).toBeDefined();\n    expect(consulta.status).toBe('AGENDADA');\n    expect(consulta.valorCentavos).toBe(15000);\n    expect(consulta.retornoDe).toBeNull();\n  });\n\n  /**\n   * @caso CT-INT-032\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF08.2, RN23\n   * @objetivo Aplicar desconto de 10% para paciente idoso (>= 60 anos)\n   * @resultadoEsperado Valor gravado é 90% do preço base\n   */\n  test('deve calcular desconto de idoso de 10% no agendamento', () => {\n    const pacienteIdoso = dados.pacientes[1]; // João Santos, nascido em 1958 (68 anos)\n    const medico = dados.medicos[0]; // Clínica Geral (R$ 150,00 -> 13500 com 10%)\n    const ator = { perfil: 'PACIENTE', pacienteId: pacienteIdoso.id };\n\n    const consulta = servicos.consultasService.agendar(ator, {\n      pacienteId: pacienteIdoso.id,\n      medicoId: medico.id,\n      inicio: '2026-10-20 09:30',\n    });\n\n    expect(consulta.valorCentavos).toBe(13500);\n  });\n\n  /**\n   * @caso CT-INT-033\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF08.2, RN24\n   * @objetivo Conceder retorno gratuito com valor zero após consulta REALIZADA no mesmo médico\n   * @resultadoEsperado valorCentavos = 0 e retornoDe apontando para o id da consulta realizada\n   */\n  test('deve conceder retorno gratuito após consulta realizada com mesmo médico em 30 dias', () => {\n    const paciente = dados.pacientes[0];\n    const medico = dados.medicos[0];\n    const ator = { perfil: 'RECEPCAO' };\n\n    // Insere consulta realizada há 10 dias\n    const consultaRealizadaId = servicos.repos.consultas.inserir({\n      pacienteId: paciente.id,\n      medicoId: medico.id,\n      inicio: '2026-10-09 09:00',\n      fim: '2026-10-09 09:30',\n      valorCentavos: 15000,\n      agora: '2026-10-09 08:00',\n    });\n    servicos.repos.consultas.atualizarStatus(consultaRealizadaId, 'REALIZADA', '2026-10-09 09:30');\n\n    // Novo agendamento dentro dos 30 dias\n    const nova = servicos.consultasService.agendar(ator, {\n      pacienteId: paciente.id,\n      medicoId: medico.id,\n      inicio: '2026-10-20 10:00',\n    });\n\n    expect(nova.valorCentavos).toBe(0);\n    expect(nova.retornoDe).toBe(consultaRealizadaId);\n  });\n\n  /**\n   * @caso CT-INT-034\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN18\n   * @objetivo Impedir paciente de agendar duas consultas no mesmo horário (conflito de agenda do paciente)\n   * @resultadoEsperado Lança erro CONFLITO\n   */\n  test('deve impedir que o paciente tenha duas consultas ativas no mesmo horário', () => {\n    const paciente = dados.pacientes[0];\n    const medico1 = dados.medicos[0];\n    const medico2 = dados.medicos[1]; // Dra. Beatriz (atende seg/qua/sex 09-15)\n    const ator = { perfil: 'PACIENTE', pacienteId: paciente.id };\n\n    // Primeira consulta na quarta-feira 2026-10-21 09:00\n    servicos.consultasService.agendar(ator, {\n      pacienteId: paciente.id,\n      medicoId: medico1.id,\n      inicio: '2026-10-21 09:00',\n    });\n\n    // Tentativa no mesmo horário com outro médico\n    expect(() => {\n      servicos.consultasService.agendar(ator, {\n        pacienteId: paciente.id,\n        medicoId: medico2.id,\n        inicio: '2026-10-21 09:00',\n      });\n    }).toThrow(/já possui outra consulta neste horário/i);\n  });\n\n  /**\n   * @caso CT-INT-035\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN19\n   * @objetivo Bloquear agendamento ao exceder o limite de consultas por especialidade\n   * @resultadoEsperado Lança erro REGRA_NEGOCIO de especialidade repetida\n   */\n  test('deve bloquear mais de 1 consulta ativa futura na mesma especialidade', () => {\n    const paciente = dados.pacientes[0];\n    const medico1 = dados.medicos[0]; // Clínica Geral\n    const ator = { perfil: 'PACIENTE', pacienteId: paciente.id };\n\n    servicos.consultasService.agendar(ator, {\n      pacienteId: paciente.id,\n      medicoId: medico1.id,\n      inicio: '2026-10-20 09:00',\n    });\n\n    // Segunda consulta na mesma especialidade\n    expect(() => {\n      servicos.consultasService.agendar(ator, {\n        pacienteId: paciente.id,\n        medicoId: medico1.id,\n        inicio: '2026-10-21 09:00',\n      });\n    }).toThrow(/já possui uma consulta agendada nesta especialidade/i);\n  });\n\n  /**\n   * @caso CT-INT-036\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN20\n   * @objetivo Bloquear agendamento de paciente com 3 ou mais faltas nos últimos 90 dias\n   * @resultadoEsperado Lança erro REGRA_NEGOCIO informando suspensão por faltas\n   */\n  test('deve suspender agendamento de paciente com 3 faltas recentes', () => {\n    const paciente = dados.pacientes[0];\n    const medico = dados.medicos[0];\n    const ator = { perfil: 'RECEPCAO' };\n\n    // Insere 3 faltas\n    for (const diasAtras of [30, 20, 5]) {\n      const dataHora = formatarDataHora(somarDias(agoraFixo, -diasAtras));\n      const id = servicos.repos.consultas.inserir({\n        pacienteId: paciente.id,\n        medicoId: medico.id,\n        inicio: dataHora,\n        fim: formatarDataHora(somarMinutos(somarDias(agoraFixo, -diasAtras), 30)),\n        valorCentavos: 15000,\n        agora: dataHora,\n      });\n      servicos.repos.consultas.atualizarStatus(id, 'FALTA', dataHora);\n    }\n\n    expect(() => {\n      servicos.consultasService.agendar(ator, {\n        pacienteId: paciente.id,\n        medicoId: medico.id,\n        inicio: '2026-10-20 11:00',\n      });\n    }).toThrow(/Paciente suspenso por faltas até/i);\n  });\n\n  /**\n   * @caso CT-INT-037\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN21\n   * @objetivo Bloquear agendamento para paciente com conta inativa\n   * @resultadoEsperado Lança erro REGRA_NEGOCIO de paciente inativo\n   */\n  test('deve impedir agendamento para paciente inativo', () => {\n    const paciente = dados.pacientes[0];\n    const medico = dados.medicos[0];\n    servicos.cadastroService.definirUsuarioAtivo(paciente.usuarioId, false);\n\n    expect(() => {\n      servicos.consultasService.agendar({ perfil: 'RECEPCAO' }, {\n        pacienteId: paciente.id,\n        medicoId: medico.id,\n        inicio: '2026-10-20 11:00',\n      });\n    }).toThrow(/Paciente inativo não pode agendar consultas/i);\n  });\n\n  /**\n   * @caso CT-INT-038\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF09.1, RN25\n   * @objetivo Confirmar consulta agendada dentro da janela de 48 horas\n   * @resultadoEsperado Status da consulta atualizado para CONFIRMADA\n   */\n  test('deve confirmar consulta nas 48h anteriores pelo paciente dono', () => {\n    const paciente = dados.pacientes[0];\n    const medico = dados.medicos[0];\n    const ator = { perfil: 'PACIENTE', pacienteId: paciente.id };\n\n    // Consulta em 24h (2026-10-20 08:00)\n    const c = servicos.consultasService.agendar(ator, {\n      pacienteId: paciente.id,\n      medicoId: medico.id,\n      inicio: '2026-10-20 08:00',\n    });\n\n    const confirmada = servicos.consultasService.confirmar(ator, c.id);\n    expect(confirmada.status).toBe('CONFIRMADA');\n  });\n\n  /**\n   * @caso CT-INT-039\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF09.2, RN26\n   * @objetivo Cancelar consulta pelo paciente com mais de 24 horas de antecedência\n   * @resultadoEsperado Status passa para CANCELADA e canceladoPor fica PACIENTE\n   */\n  test('deve cancelar consulta pelo paciente com mais de 24 horas de antecedência', () => {\n    const paciente = dados.pacientes[0];\n    const medico = dados.medicos[0];\n    const ator = { perfil: 'PACIENTE', pacienteId: paciente.id };\n\n    // Consulta em 48h (2026-10-21 09:00)\n    const c = servicos.consultasService.agendar(ator, {\n      pacienteId: paciente.id,\n      medicoId: medico.id,\n      inicio: '2026-10-21 09:00',\n    });\n\n    const cancelada = servicos.consultasService.cancelar(ator, c.id, {});\n    expect(cancelada.status).toBe('CANCELADA');\n    expect(cancelada.canceladoPor).toBe('PACIENTE');\n  });\n\n  /**\n   * @caso CT-INT-040\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN24\n   * @objetivo Consulta cancelada deve devolver o direito ao retorno gratuito\n   * @resultadoEsperado Paciente pode usar novamente a consulta realizada para obter retorno\n   */\n  test('deve devolver direito a retorno caso consulta com retorno seja cancelada', () => {\n    const paciente = dados.pacientes[0];\n    const medico = dados.medicos[0];\n    const ator = { perfil: 'RECEPCAO' };\n\n    // Consulta realizada\n    const cRealizadaId = servicos.repos.consultas.inserir({\n      pacienteId: paciente.id,\n      medicoId: medico.id,\n      inicio: '2026-10-05 09:00',\n      fim: '2026-10-05 09:30',\n      valorCentavos: 15000,\n      agora: '2026-10-05 08:00',\n    });\n    servicos.repos.consultas.atualizarStatus(cRealizadaId, 'REALIZADA', '2026-10-05 09:30');\n\n    // Agenda retorno para 2026-10-20 09:00\n    const retorno = servicos.consultasService.agendar(ator, {\n      pacienteId: paciente.id,\n      medicoId: medico.id,\n      inicio: '2026-10-20 09:00',\n    });\n    expect(retorno.valorCentavos).toBe(0);\n\n    // Cancela o retorno\n    servicos.consultasService.cancelar(ator, retorno.id, { motivo: 'Paciente não pode ir' });\n\n    // Novo agendamento deve ser retorno gratuito novamente\n    const novoRetorno = servicos.consultasService.agendar(ator, {\n      pacienteId: paciente.id,\n      medicoId: medico.id,\n      inicio: '2026-10-21 09:00',\n    });\n    expect(novoRetorno.valorCentavos).toBe(0);\n    expect(novoRetorno.retornoDe).toBe(cRealizadaId);\n  });\n\n  /**\n   * @caso CT-INT-041\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF09.3, RN27\n   * @objetivo Remarcar consulta para outro horário válido recalculando valor e incrementando remarcacoes\n   * @resultadoEsperado Consulta com novo horário, status AGENDADA e remarcacoes = 1\n   */\n  test.skip('deve remarcar consulta atualizando horário e contador de remarcações', () => {\n    const paciente = dados.pacientes[0];\n    const medico = dados.medicos[0];\n    const ator = { perfil: 'PACIENTE', pacienteId: paciente.id };\n\n    const c = servicos.consultasService.agendar(ator, {\n      pacienteId: paciente.id,\n      medicoId: medico.id,\n      inicio: '2026-10-21 09:00',\n    });\n    servicos.consultasService.confirmar(ator, c.id);\n\n    const remarcada = servicos.consultasService.remarcar(ator, c.id, {\n      inicio: '2026-10-21 10:00',\n    });\n\n    expect(remarcada.inicio).toBe('2026-10-21 10:00');\n    expect(remarcada.status).toBe('AGENDADA'); // volta para AGENDADA\n    expect(remarcada.remarcacoes).toBe(1);\n  });\n\n  /**\n   * @caso CT-INT-042\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF09.4, RN28\n   * @objetivo Registrar atendimento médico realizado a partir do início da consulta\n   * @resultadoEsperado Status REALIZADA e observações gravadas\n   */\n  test('deve registrar atendimento realizado pelo médico dono após o horário', () => {\n    const paciente = dados.pacientes[0];\n    const medico = dados.medicos[0];\n    const cId = servicos.repos.consultas.inserir({\n      pacienteId: paciente.id,\n      medicoId: medico.id,\n      inicio: '2026-10-19 08:00', // agora\n      fim: '2026-10-19 08:30',\n      valorCentavos: 15000,\n      agora: '2026-10-18 08:00',\n    });\n\n    const atorMedico = { perfil: 'MEDICO', medicoId: medico.id };\n    const realizada = servicos.consultasService.registrarRealizada(atorMedico, cId, {\n      observacoes: 'Paciente medicado e orientado.',\n    });\n\n    expect(realizada.status).toBe('REALIZADA');\n    expect(realizada.observacoes).toBe('Paciente medicado e orientado.');\n  });\n\n  /**\n   * @caso CT-INT-043\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF09.5, RN29\n   * @objetivo Registrar falta do paciente após 15 minutos do início\n   * @resultadoEsperado Status FALTA registrado com sucesso\n   */\n  test('deve registrar falta do paciente após a tolerância de 15 minutos', () => {\n    const paciente = dados.pacientes[0];\n    const medico = dados.medicos[0];\n    // Consulta iniciada às 07:30 (há 30 minutos em relação a 08:00)\n    const cId = servicos.repos.consultas.inserir({\n      pacienteId: paciente.id,\n      medicoId: medico.id,\n      inicio: '2026-10-19 07:30',\n      fim: '2026-10-19 08:00',\n      valorCentavos: 15000,\n      agora: '2026-10-18 08:00',\n    });\n\n    const ator = { perfil: 'RECEPCAO' };\n    const falta = servicos.consultasService.registrarFalta(ator, cId);\n    expect(falta.status).toBe('FALTA');\n  });\n\n  /**\n   * @caso CT-INT-044\n   * @nivel integracao\n   * @atributo seguranca\n   * @subatributo confidencialidade\n   * @requisito RF10.1, RN30\n   * @objetivo Impedir paciente de obter detalhes de consulta pertencente a outro paciente\n   * @resultadoEsperado Lança erro SEM_PERMISSAO\n   */\n  test('deve impedir paciente de acessar consulta alheia', () => {\n    const paciente1 = dados.pacientes[0];\n    const paciente2 = dados.pacientes[1];\n    const medico = dados.medicos[0];\n\n    const cId = servicos.repos.consultas.inserir({\n      pacienteId: paciente2.id,\n      medicoId: medico.id,\n      inicio: '2026-10-20 09:00',\n      fim: '2026-10-20 09:30',\n      valorCentavos: 15000,\n      agora: '2026-10-19 08:00',\n    });\n\n    const atorPaciente1 = { perfil: 'PACIENTE', pacienteId: paciente1.id };\n    expect(() => servicos.consultasService.obter(atorPaciente1, cId)).toThrow(/Você não tem acesso a esta consulta/i);\n  });\n\n  /**\n   * @caso CT-INT-045\n   * @nivel integracao\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF10.2\n   * @objetivo Listar consultas filtradas apenas para o médico logado\n   * @resultadoEsperado Lista contém apenas consultas associadas ao médico ator\n   */\n  test('médico lista somente consultas da própria agenda', () => {\n    const p = dados.pacientes[0];\n    const m1 = dados.medicos[0];\n    const m2 = dados.medicos[1];\n\n    servicos.repos.consultas.inserir({ pacienteId: p.id, medicoId: m1.id, inicio: '2026-10-20 09:00', fim: '2026-10-20 09:30', valorCentavos: 15000, agora: '2026-10-19 08:00' });\n    servicos.repos.consultas.inserir({ pacienteId: p.id, medicoId: m2.id, inicio: '2026-10-20 09:00', fim: '2026-10-20 09:45', valorCentavos: 30000, agora: '2026-10-19 08:00' });\n\n    const listaM1 = servicos.consultasService.listar({ perfil: 'MEDICO', medicoId: m1.id });\n    expect(listaM1).toHaveLength(1);\n    expect(listaM1[0].medicoId).toBe(m1.id);\n  });\n});\n"},"backend/__testes__/api/consultas-api.test.js":{"tests":[{"id":"47","name":"API: Consultas (/api/consultas) POST /api/consultas - paciente agenda consulta com sucesso","location":{"start":{"column":4,"line":49}}},{"id":"48","name":"API: Consultas (/api/consultas) POST /api/consultas - paciente recebe 403 ao tentar agendar para outro paciente","location":{"start":{"column":4,"line":73}}},{"id":"49","name":"API: Consultas (/api/consultas) POST /api/consultas - médico recebe 403 ao tentar agendar consulta","location":{"start":{"column":4,"line":96}}},{"id":"50","name":"API: Consultas (/api/consultas) POST /api/consultas - responde 422 para antecedência inferior a 2 horas","location":{"start":{"column":4,"line":119}}},{"id":"51","name":"API: Consultas (/api/consultas) GET /api/consultas - paciente lista apenas as próprias consultas","location":{"start":{"column":4,"line":143}}},{"id":"52","name":"API: Consultas (/api/consultas) GET /api/consultas/:id - paciente recebe 403 ao acessar consulta de outro paciente","location":{"start":{"column":4,"line":174}}},{"id":"53","name":"API: Consultas (/api/consultas) POST /api/consultas/:id/confirmar - confirma consulta com sucesso","location":{"start":{"column":4,"line":199}}},{"id":"54","name":"API: Consultas (/api/consultas) POST /api/consultas/:id/cancelar - paciente cancela consulta com antecedência","location":{"start":{"column":4,"line":222}}},{"id":"55","name":"API: Consultas (/api/consultas) POST /api/consultas/:id/cancelar - recepção deve informar motivo","location":{"start":{"column":4,"line":247}}},{"id":"56","name":"API: Consultas (/api/consultas) POST /api/consultas/:id/remarcar - remarca consulta com sucesso","location":{"start":{"column":4,"line":279}}},{"id":"57","name":"API: Consultas (/api/consultas) POST /api/consultas/:id/realizar - médico registra atendimento","location":{"start":{"column":4,"line":304}}},{"id":"58","name":"API: Consultas (/api/consultas) POST /api/consultas/:id/falta - registra falta após tolerância de 15 minutos","location":{"start":{"column":4,"line":334}}}],"source":"const request = require('supertest');\nconst { abrirBanco } = require('../../src/db/connection');\nconst { semear, SENHA_PADRAO } = require('../../src/db/seed');\nconst { criarApp } = require('../../src/app');\nconst clock = require('../../src/utils/clock');\n\ndescribe('API: Consultas (/api/consultas)', () => {\n  let db;\n  let app;\n  let tokenRecepcao;\n  let tokenMedico1;\n  let tokenPacienteAna;\n  let tokenPacienteJoao;\n  const agoraFixo = new Date('2026-10-19T08:00:00'); // Segunda-feira 08:00\n\n  beforeEach(async () => {\n    clock.definirAgora(agoraFixo);\n    db = abrirBanco(':memory:');\n    semear(db);\n    app = criarApp({ db });\n\n    const lRec = await request(app).post('/api/auth/login').send({ email: 'recepcao@clinica.com', senha: SENHA_PADRAO });\n    tokenRecepcao = lRec.body.token;\n\n    const lMed1 = await request(app).post('/api/auth/login').send({ email: 'carlos@clinica.com', senha: SENHA_PADRAO });\n    tokenMedico1 = lMed1.body.token; // Médico 1\n\n    const lAna = await request(app).post('/api/auth/login').send({ email: 'ana@email.com', senha: SENHA_PADRAO });\n    tokenPacienteAna = lAna.body.token; // Paciente 1\n\n    const lJoao = await request(app).post('/api/auth/login').send({ email: 'joao@email.com', senha: SENHA_PADRAO });\n    tokenPacienteJoao = lJoao.body.token; // Paciente 2\n  });\n\n  afterEach(() => {\n    clock.definirAgora(null);\n    db.close();\n  });\n\n  /**\n   * @caso CT-API-030\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF08.1, RF08.2\n   * @objetivo Agendar consulta via POST /api/consultas por paciente autenticado\n   * @resultadoEsperado Status 201 com dados da consulta criada\n   */\n  test('POST /api/consultas - paciente agenda consulta com sucesso', async () => {\n    const res = await request(app)\n      .post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenPacienteAna}`)\n      .send({\n        medicoId: 1,\n        inicio: '2026-10-20 09:00',\n      });\n\n    expect(res.status).toBe(201);\n    expect(res.body.id).toBeDefined();\n    expect(res.body.status).toBe('AGENDADA');\n    expect(res.body.valorCentavos).toBe(15000);\n  });\n\n  /**\n   * @caso CT-API-031\n   * @nivel api\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RF08.1, RN30\n   * @objetivo Impedir paciente de agendar consulta em nome de outro paciente\n   * @resultadoEsperado Status 403 com erro.codigo = SEM_PERMISSAO\n   */\n  test('POST /api/consultas - paciente recebe 403 ao tentar agendar para outro paciente', async () => {\n    const res = await request(app)\n      .post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenPacienteAna}`)\n      .send({\n        pacienteId: 2, // ID de João\n        medicoId: 1,\n        inicio: '2026-10-20 09:30',\n      });\n\n    expect(res.status).toBe(403);\n    expect(res.body.erro.codigo).toBe('SEM_PERMISSAO');\n  });\n\n  /**\n   * @caso CT-API-032\n   * @nivel api\n   * @atributo seguranca\n   * @subatributo responsabilizacao\n   * @requisito RF08.1, RN30\n   * @objetivo Impedir perfil MÉDICO de agendar consultas diretamente pela API\n   * @resultadoEsperado Status 403 com erro.codigo = SEM_PERMISSAO\n   */\n  test('POST /api/consultas - médico recebe 403 ao tentar agendar consulta', async () => {\n    const res = await request(app)\n      .post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenMedico1}`)\n      .send({\n        pacienteId: 1,\n        medicoId: 1,\n        inicio: '2026-10-20 10:00',\n      });\n\n    expect(res.status).toBe(403);\n    expect(res.body.erro.codigo).toBe('SEM_PERMISSAO');\n  });\n\n  /**\n   * @caso CT-API-033\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN16, RNF04\n   * @objetivo Rejeitar agendamento com menos de 2 horas de antecedência\n   * @resultadoEsperado Status 422 com erro.codigo = REGRA_NEGOCIO\n   */\n  test('POST /api/consultas - responde 422 para antecedência inferior a 2 horas', async () => {\n    // Agora é 2026-10-19 08:00 -> tenta 2026-10-19 09:00 (1h depois)\n    const res = await request(app)\n      .post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenPacienteAna}`)\n      .send({\n        medicoId: 1,\n        inicio: '2026-10-19 09:00',\n      });\n\n    expect(res.status).toBe(422);\n    expect(res.body.erro.codigo).toBe('REGRA_NEGOCIO');\n    expect(res.body.erro.mensagem).toMatch(/mínimo 2 horas de antecedência/i);\n  });\n\n  /**\n   * @caso CT-API-034\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RF10.1, RN30\n   * @objetivo Paciente visualiza somente as próprias consultas na listagem\n   * @resultadoEsperado Lista contém apenas consultas associadas ao paciente autenticado\n   */\n  test('GET /api/consultas - paciente lista apenas as próprias consultas', async () => {\n    // Agenda consulta para Ana\n    await request(app)\n      .post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenPacienteAna}`)\n      .send({ medicoId: 1, inicio: '2026-10-20 09:00' });\n\n    // Agenda consulta para João via Recepção\n    await request(app)\n      .post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenRecepcao}`)\n      .send({ pacienteId: 2, medicoId: 1, inicio: '2026-10-20 09:30' });\n\n    // Ana consulta lista\n    const res = await request(app)\n      .get('/api/consultas')\n      .set('Authorization', `Bearer ${tokenPacienteAna}`);\n\n    expect(res.status).toBe(200);\n    expect(res.body.every((c) => c.pacienteNome === 'Ana Pereira')).toBe(true);\n  });\n\n  /**\n   * @caso CT-API-035\n   * @nivel api\n   * @atributo seguranca\n   * @subatributo confidencialidade\n   * @requisito RF10.1, RN30\n   * @objetivo Impedir paciente de obter detalhes de consulta de outro paciente\n   * @resultadoEsperado Status 403 com erro.codigo = SEM_PERMISSAO\n   */\n  test('GET /api/consultas/:id - paciente recebe 403 ao acessar consulta de outro paciente', async () => {\n    // Cria consulta para João\n    const cRes = await request(app)\n      .post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenRecepcao}`)\n      .send({ pacienteId: 2, medicoId: 1, inicio: '2026-10-20 09:30' });\n\n    // Ana tenta acessar\n    const res = await request(app)\n      .get(`/api/consultas/${cRes.body.id}`)\n      .set('Authorization', `Bearer ${tokenPacienteAna}`);\n\n    expect(res.status).toBe(403);\n    expect(res.body.erro.codigo).toBe('SEM_PERMISSAO');\n  });\n\n  /**\n   * @caso CT-API-036\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF09.1, RN25\n   * @objetivo Confirmar consulta agendada nas 48h anteriores\n   * @resultadoEsperado Status 200 com consulta no status CONFIRMADA\n   */\n  test('POST /api/consultas/:id/confirmar - confirma consulta com sucesso', async () => {\n    const cRes = await request(app)\n      .post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenPacienteAna}`)\n      .send({ medicoId: 1, inicio: '2026-10-20 09:00' }); // em 25h\n\n    const res = await request(app)\n      .post(`/api/consultas/${cRes.body.id}/confirmar`)\n      .set('Authorization', `Bearer ${tokenPacienteAna}`);\n\n    expect(res.status).toBe(200);\n    expect(res.body.status).toBe('CONFIRMADA');\n  });\n\n  /**\n   * @caso CT-API-037\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF09.2, RN26\n   * @objetivo Cancelar consulta pelo paciente com mais de 24 horas de antecedência\n   * @resultadoEsperado Status 200 com consulta no status CANCELADA\n   */\n  test('POST /api/consultas/:id/cancelar - paciente cancela consulta com antecedência', async () => {\n    const cRes = await request(app)\n      .post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenPacienteAna}`)\n      .send({ medicoId: 1, inicio: '2026-10-21 09:00' }); // em 49h\n\n    const res = await request(app)\n      .post(`/api/consultas/${cRes.body.id}/cancelar`)\n      .set('Authorization', `Bearer ${tokenPacienteAna}`)\n      .send({});\n\n    expect(res.status).toBe(200);\n    expect(res.body.status).toBe('CANCELADA');\n    expect(res.body.canceladoPor).toBe('PACIENTE');\n  });\n\n  /**\n   * @caso CT-API-038\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RF09.2, RN26\n   * @objetivo Exigir motivo no cancelamento efetuado pela recepção\n   * @resultadoEsperado Status 422 REGRA_NEGOCIO se motivo for omitido\n   */\n  test('POST /api/consultas/:id/cancelar - recepção deve informar motivo', async () => {\n    const cRes = await request(app)\n      .post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenRecepcao}`)\n      .send({ pacienteId: 1, medicoId: 1, inicio: '2026-10-20 09:00' });\n\n    const resSemMotivo = await request(app)\n      .post(`/api/consultas/${cRes.body.id}/cancelar`)\n      .set('Authorization', `Bearer ${tokenRecepcao}`)\n      .send({ motivo: '' });\n\n    expect(resSemMotivo.status).toBe(422);\n    expect(resSemMotivo.body.erro.mensagem).toMatch(/Informe o motivo do cancelamento/i);\n\n    const resComMotivo = await request(app)\n      .post(`/api/consultas/${cRes.body.id}/cancelar`)\n      .set('Authorization', `Bearer ${tokenRecepcao}`)\n      .send({ motivo: 'Imprevisto na recepção' });\n\n    expect(resComMotivo.status).toBe(200);\n    expect(resComMotivo.body.motivoCancelamento).toBe('Imprevisto na recepção');\n  });\n\n  /**\n   * @caso CT-API-039\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF09.3, RN27\n   * @objetivo Remarcar consulta com novo horário válido\n   * @resultadoEsperado Status 200 com horário atualizado e remarcacoes incrementado\n   */\n  test('POST /api/consultas/:id/remarcar - remarca consulta com sucesso', async () => {\n    const cRes = await request(app)\n      .post('/api/consultas')\n      .set('Authorization', `Bearer ${tokenPacienteAna}`)\n      .send({ medicoId: 1, inicio: '2026-10-21 09:00' });\n\n    const res = await request(app)\n      .post(`/api/consultas/${cRes.body.id}/remarcar`)\n      .set('Authorization', `Bearer ${tokenPacienteAna}`)\n      .send({ inicio: '2026-10-21 10:00' });\n\n    expect(res.status).toBe(200);\n    expect(res.body.inicio).toBe('2026-10-21 10:00');\n    expect(res.body.remarcacoes).toBe(1);\n  });\n\n  /**\n   * @caso CT-API-040\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF09.4, RN28\n   * @objetivo Médico dono registra atendimento realizado com observações\n   * @resultadoEsperado Status 200 com status REALIZADA e observações salvas\n   */\n  test('POST /api/consultas/:id/realizar - médico registra atendimento', async () => {\n    // Insere consulta no banco com início no horário atual\n    const cId = app.locals.servicos.repos.consultas.inserir({\n      pacienteId: 1,\n      medicoId: 1,\n      inicio: '2026-10-19 08:00',\n      fim: '2026-10-19 08:30',\n      valorCentavos: 15000,\n      agora: '2026-10-18 08:00',\n    });\n\n    const res = await request(app)\n      .post(`/api/consultas/${cId}/realizar`)\n      .set('Authorization', `Bearer ${tokenMedico1}`)\n      .send({ observacoes: 'Consulta de rotina concluída.' });\n\n    expect(res.status).toBe(200);\n    expect(res.body.status).toBe('REALIZADA');\n    expect(res.body.observacoes).toBe('Consulta de rotina concluída.');\n  });\n\n  /**\n   * @caso CT-API-041\n   * @nivel api\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RF09.5, RN29\n   * @objetivo Registrar falta do paciente após decorridos 15 minutos do horário de início\n   * @resultadoEsperado Status 200 com status FALTA\n   */\n  test('POST /api/consultas/:id/falta - registra falta após tolerância de 15 minutos', async () => {\n    // Consulta iniciada há 20 minutos (07:40)\n    const cId = app.locals.servicos.repos.consultas.inserir({\n      pacienteId: 1,\n      medicoId: 1,\n      inicio: '2026-10-19 07:40',\n      fim: '2026-10-19 08:10',\n      valorCentavos: 15000,\n      agora: '2026-10-18 08:00',\n    });\n\n    const res = await request(app)\n      .post(`/api/consultas/${cId}/falta`)\n      .set('Authorization', `Bearer ${tokenRecepcao}`);\n\n    expect(res.status).toBe(200);\n    expect(res.body.status).toBe('FALTA');\n  });\n});\n"},"backend/__testes__/unitario/validacoes.test.js":{"tests":[{"id":"59","name":"Validações de Domínio (validacoes.js) deve validar e-mail correto","location":{"start":{"column":4,"line":25}}},{"id":"60","name":"Validações de Domínio (validacoes.js) deve invalidar e-mail sem formato adequado","location":{"start":{"column":4,"line":39}}},{"id":"61","name":"Validações de Domínio (validacoes.js) deve validar senha forte com letras e números e 8 caracteres","location":{"start":{"column":4,"line":57}}},{"id":"62","name":"Validações de Domínio (validacoes.js) deve rejeitar senha curta no valor-limite inferior","location":{"start":{"column":4,"line":71}}},{"id":"63","name":"Validações de Domínio (validacoes.js) deve rejeitar senha sem dígitos ou sem letras","location":{"start":{"column":4,"line":84}}},{"id":"64","name":"Validações de Domínio (validacoes.js) deve normalizar CPF formatado com pontos e traço","location":{"start":{"column":4,"line":99}}},{"id":"65","name":"Validações de Domínio (validacoes.js) deve validar CPF com dígitos verificadores corretos","location":{"start":{"column":4,"line":113}}},{"id":"66","name":"Validações de Domínio (validacoes.js) deve rejeitar CPF composto por dígitos repetidos","location":{"start":{"column":4,"line":127}}},{"id":"67","name":"Validações de Domínio (validacoes.js) deve rejeitar CPF com DV incorreto ou tamanho diferente de 11","location":{"start":{"column":4,"line":141}}},{"id":"68","name":"Validações de Domínio (validacoes.js) deve calcular idade considerando mês e dia do aniversário","location":{"start":{"column":4,"line":156}}},{"id":"69","name":"Validações de Domínio (validacoes.js) deve aceitar data de nascimento válida e recente","location":{"start":{"column":4,"line":173}}},{"id":"70","name":"Validações de Domínio (validacoes.js) deve rejeitar data de nascimento posterior à data de hoje","location":{"start":{"column":4,"line":187}}},{"id":"71","name":"Validações de Domínio (validacoes.js) deve rejeitar data de nascimento para mais de 130 anos","location":{"start":{"column":4,"line":202}}},{"id":"72","name":"Validações de Domínio (validacoes.js) deve rejeitar formato de data incorreto","location":{"start":{"column":4,"line":217}}},{"id":"73","name":"Validações de Domínio (validacoes.js) deve indicar exigência de responsável para menor de 18 anos","location":{"start":{"column":4,"line":233}}},{"id":"74","name":"Validações de Domínio (validacoes.js) não deve exigir responsável para quem tem exatamente 18 anos ou mais","location":{"start":{"column":4,"line":248}}},{"id":"75","name":"Validações de Domínio (validacoes.js) deve validar CRM com formato e UF brasileira válida","location":{"start":{"column":4,"line":266}}},{"id":"76","name":"Validações de Domínio (validacoes.js) deve rejeitar CRM com quantidade de dígitos fora do intervalo 4-6","location":{"start":{"column":4,"line":281}}},{"id":"77","name":"Validações de Domínio (validacoes.js) deve rejeitar CRM com UF inválida ou sem separador","location":{"start":{"column":4,"line":295}}},{"id":"78","name":"Validações de Domínio (validacoes.js) deve aceitar durações de consulta válidas múltiplas de 15 entre 15 e 60","location":{"start":{"column":4,"line":311}}},{"id":"79","name":"Validações de Domínio (validacoes.js) deve rejeitar durações fora dos limites ou não múltiplas de 15","location":{"start":{"column":4,"line":327}}},{"id":"80","name":"Validações de Domínio (validacoes.js) deve conter as 27 UFs válidas brasileiras","location":{"start":{"column":4,"line":345}}}],"source":"const {\n  emailValido,\n  senhaValida,\n  normalizarCpf,\n  cpfValido,\n  crmValido,\n  calcularIdade,\n  validarDataNascimento,\n  exigeResponsavel,\n  duracaoConsultaValida,\n  UFS,\n} = require('../../src/domain/validacoes');\n\ndescribe('Validações de Domínio (validacoes.js)', () => {\n  // --- RN01: E-mail ---\n  /**\n   * @caso CT-UNI-001\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN01\n   * @objetivo Aceitar e-mails com formato válido convencional\n   * @resultadoEsperado emailValido retorna true para endereço válido\n   */\n  test('deve validar e-mail correto', () => {\n    expect(emailValido('paciente@exemplo.com')).toBe(true);\n    expect(emailValido('medico.clinica@sub.dominio.org')).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-002\n   * @nivel unitario\n   * @atributo confiabilidade\n   * @subatributo maturidade\n   * @requisito RN01\n   * @objetivo Rejeitar e-mails sem arroba, sem domínio ou vazios\n   * @resultadoEsperado emailValido retorna false para entradas malformadas\n   */\n  test('deve invalidar e-mail sem formato adequado', () => {\n    expect(emailValido('')).toBe(false);\n    expect(emailValido('semarroba.com')).toBe(false);\n    expect(emailValido('usuario@')).toBe(false);\n    expect(emailValido('@dominio.com')).toBe(false);\n    expect(emailValido(null)).toBe(false);\n  });\n\n  // --- RN02: Senha ---\n  /**\n   * @caso CT-UNI-003\n   * @nivel unitario\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RN02\n   * @objetivo Aceitar senha com 8 ou mais caracteres contendo letras e números\n   * @resultadoEsperado senhaValida retorna true\n   */\n  test('deve validar senha forte com letras e números e 8 caracteres', () => {\n    expect(senhaValida('Senha123')).toBe(true);\n    expect(senhaValida('abc12345')).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-004\n   * @nivel unitario\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RN02\n   * @objetivo Rejeitar senha com menos de 8 caracteres\n   * @resultadoEsperado senhaValida retorna false para senha de 7 caracteres\n   */\n  test('deve rejeitar senha curta no valor-limite inferior', () => {\n    expect(senhaValida('Abc1234')).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-005\n   * @nivel unitario\n   * @atributo seguranca\n   * @subatributo autenticidade\n   * @requisito RN02\n   * @objetivo Rejeitar senha que contenha apenas letras ou apenas números\n   * @resultadoEsperado senhaValida retorna false se faltar letra ou dígito\n   */\n  test('deve rejeitar senha sem dígitos ou sem letras', () => {\n    expect(senhaValida('SomenteLetras')).toBe(false);\n    expect(senhaValida('1234567890')).toBe(false);\n  });\n\n  // --- RN03: CPF ---\n  /**\n   * @caso CT-UNI-006\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN03\n   * @objetivo Normalizar CPF removendo caracteres não numéricos\n   * @resultadoEsperado Retornar apenas os 11 dígitos numéricos\n   */\n  test('deve normalizar CPF formatado com pontos e traço', () => {\n    expect(normalizarCpf('529.982.247-25')).toBe('52998224725');\n    expect(normalizarCpf(null)).toBe('');\n  });\n\n  /**\n   * @caso CT-UNI-007\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN03\n   * @objetivo Validar CPF autêntico com dígitos verificadores corretos\n   * @resultadoEsperado cpfValido retorna true\n   */\n  test('deve validar CPF com dígitos verificadores corretos', () => {\n    expect(cpfValido('52998224725')).toBe(true);\n    expect(cpfValido('11144477735')).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-008\n   * @nivel unitario\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN03\n   * @objetivo Rejeitar CPF com todos os dígitos iguais\n   * @resultadoEsperado cpfValido retorna false mesmo que matematicamente a soma batesse\n   */\n  test('deve rejeitar CPF composto por dígitos repetidos', () => {\n    expect(cpfValido('11111111111')).toBe(false);\n    expect(cpfValido('00000000000')).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-009\n   * @nivel unitario\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN03\n   * @objetivo Rejeitar CPF com dígito verificador incorreto ou tamanho inválido\n   * @resultadoEsperado cpfValido retorna false\n   */\n  test('deve rejeitar CPF com DV incorreto ou tamanho diferente de 11', () => {\n    expect(cpfValido('52998224726')).toBe(false);\n    expect(cpfValido('123456789')).toBe(false);\n  });\n\n  // --- RN05: Idade e Data de Nascimento ---\n  /**\n   * @caso CT-UNI-010\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN05\n   * @objetivo Calcular a idade exata com base na data de nascimento e data de referência\n   * @resultadoEsperado Retornar a idade completa considerando se o aniversário já ocorreu no ano\n   */\n  test('deve calcular idade considerando mês e dia do aniversário', () => {\n    const ref = new Date(2026, 9, 19); // 19/10/2026\n    const jaFez = new Date(1990, 4, 14); // 14/05/1990 -> 36 anos\n    const aindaNaoFez = new Date(1990, 11, 25); // 25/12/1990 -> 35 anos\n    expect(calcularIdade(jaFez, ref)).toBe(36);\n    expect(calcularIdade(aindaNaoFez, ref)).toBe(35);\n  });\n\n  /**\n   * @caso CT-UNI-011\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN05\n   * @objetivo Aceitar data de nascimento válida e passada dentro do limite de 130 anos\n   * @resultadoEsperado validarDataNascimento retorna null\n   */\n  test('deve aceitar data de nascimento válida e recente', () => {\n    const hoje = new Date(2026, 9, 19);\n    expect(validarDataNascimento('1990-05-14', hoje)).toBeNull();\n  });\n\n  /**\n   * @caso CT-UNI-012\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN05\n   * @objetivo Rejeitar data de nascimento futura\n   * @resultadoEsperado Retornar mensagem de que data de nascimento não pode ser futura\n   */\n  test('deve rejeitar data de nascimento posterior à data de hoje', () => {\n    const hoje = new Date(2026, 9, 19);\n    const erro = validarDataNascimento('2026-10-20', hoje);\n    expect(erro).toMatch(/não pode ser futura/i);\n  });\n\n  /**\n   * @caso CT-UNI-013\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo pertinencia\n   * @requisito RN05\n   * @objetivo Rejeitar data de nascimento indicando idade superior a 130 anos\n   * @resultadoEsperado Retornar erro informando o limite de 130 anos\n   */\n  test('deve rejeitar data de nascimento para mais de 130 anos', () => {\n    const hoje = new Date(2026, 9, 19);\n    const erro = validarDataNascimento('1895-01-01', hoje);\n    expect(erro).toMatch(/não pode ser superior a 130 anos/i);\n  });\n\n  /**\n   * @caso CT-UNI-014\n   * @nivel unitario\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN05\n   * @objetivo Rejeitar formato de data inexistente ou inválido\n   * @resultadoEsperado Retornar mensagem de data inválida\n   */\n  test('deve rejeitar formato de data incorreto', () => {\n    const hoje = new Date(2026, 9, 19);\n    expect(validarDataNascimento('data-invalida', hoje)).toMatch(/Data de nascimento inválida/i);\n    expect(validarDataNascimento('2026-02-30', hoje)).toMatch(/Data de nascimento inválida/i);\n  });\n\n  // --- RN06: Responsável para menores de 18 anos ---\n  /**\n   * @caso CT-UNI-015\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RN06\n   * @objetivo Exigir responsável legal para menor de 18 anos\n   * @resultadoEsperado exigeResponsavel retorna true para menor de 18 anos\n   */\n  test('deve indicar exigência de responsável para menor de 18 anos', () => {\n    const hoje = new Date(2026, 9, 19);\n    const menor = new Date(2016, 9, 19); // 10 anos\n    expect(exigeResponsavel(menor, hoje)).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-016\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo completude\n   * @requisito RN06\n   * @objetivo Não exigir responsável legal para maior de 18 anos\n   * @resultadoEsperado exigeResponsavel retorna false para quem tem 18 anos ou mais\n   */\n  test('não deve exigir responsável para quem tem exatamente 18 anos ou mais', () => {\n    const hoje = new Date(2026, 9, 19);\n    const exatamente18 = new Date(2008, 9, 19); // exatamente 18 anos\n    const maior = new Date(2000, 1, 1);\n    expect(exigeResponsavel(exatamente18, hoje)).toBe(false);\n    expect(exigeResponsavel(maior, hoje)).toBe(false);\n  });\n\n  // --- RN07: CRM ---\n  /**\n   * @caso CT-UNI-017\n   * @nivel unitario\n   * @atributo adequacao-funcional\n   * @subatributo correcao\n   * @requisito RN07\n   * @objetivo Validar CRM no formato de 4 a 6 dígitos com barra e UF válida\n   * @resultadoEsperado crmValido retorna true\n   */\n  test('deve validar CRM com formato e UF brasileira válida', () => {\n    expect(crmValido('1234/SP')).toBe(true);\n    expect(crmValido('12345/MG')).toBe(true);\n    expect(crmValido('123456/RJ')).toBe(true);\n  });\n\n  /**\n   * @caso CT-UNI-018\n   * @nivel unitario\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN07\n   * @objetivo Rejeitar CRM com dígitos insuficientes ou excessivos\n   * @resultadoEsperado crmValido retorna false para menos de 4 ou mais de 6 dígitos\n   */\n  test('deve rejeitar CRM com quantidade de dígitos fora do intervalo 4-6', () => {\n    expect(crmValido('123/SP')).toBe(false);\n    expect(crmValido('1234567/SP')).toBe(false);\n  });\n\n  /**\n   * @caso CT-UNI-019\n   * @nivel unitario\n   * @atributo confiabilidade\n   * @subatributo tolerancia-a-falhas\n   * @requisito RN07\n   * @objetivo Rejeitar CRM com sigla de estado inexistente ou sem barra\n   * @resultadoEsperado crmValido retorna false\n   */\n  test('deve rejeitar CRM com UF inválida
